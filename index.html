
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>X3 日漫图片分割工具</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:14px;background:#f3f4f6;color:#222;font-family:system-ui,sans-serif}
main{max-width:1000px;margin:auto}
h1{font-size:22px}
h3{font-size:17px;margin-top:0}
.card{background:#fff;padding:15px;border-radius:12px;margin:13px 0}
p{font-size:14px;line-height:1.7;color:#555}
label{display:block;margin:12px 0;font-size:14px}
button,input,select{font:inherit}
button{background:#1769aa;color:#fff;border:0;border-radius:8px;padding:10px 14px;margin:4px;cursor:pointer}
button:disabled{opacity:.45}
.secondary{background:#555}
#status{white-space:pre-wrap;line-height:1.7;font-size:14px}
#originals,#preview{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:12px}
.item{background:#eee;border-radius:8px;padding:8px;min-width:0}
.item img{display:block;width:100%;height:auto;background:#fff}
.item div{font-size:12px;overflow-wrap:anywhere;margin:6px 0;white-space:pre-wrap}
input[type=number]{width:90px}
</style>
</head>
<body>
<main>
<h1>X3 日漫图片分割工具</h1>
<p>
输入日漫图片。先裁白边，再检测黑色画框边界、倾斜边界和双页中缝。
输出 PNG 为 528×792。横向阅读页会按屏幕比例裁切并旋转；
相邻页允许重复内容，避免画面缩小后留下大块空白。
封面、彩页及没有可靠画格证据的页面保留原方向。
</p>

<section class="card">
<h3>1. 选择图片</h3>
<input id="files" type="file" accept="image/*" multiple>
</section>

<section class="card">
<h3>2. 设置</h3>
<label>每张普通漫画页最多输出几张横向取景
<select id="parts">
<option value="2">2 张</option>
<option value="3" selected>3 张</option>
</select>
</label>
<label>相邻取景重叠像素
<input id="overlap" type="number" min="0" max="300" value="80">
</label>
<label>白边裁切
<select id="trimMode">
<option value="normal">普通</option>
<option value="strong" selected>积极</option>
<option value="off">关闭</option>
</select>
</label>
<label>黑线检测灵敏度
<select id="sensitivity">
<option value="strict">严格：减少误判</option>
<option value="normal" selected>普通</option>
<option value="sensitive">灵敏：尝试检测较细的线</option>
</select>
</label>
<label>
<input id="debug" type="checkbox" checked>
显示检测调试图
</label>
<button id="run">开始检测与分割</button>
<button id="clear" class="secondary">清空</button>
</section>

<section class="card">
<h3>3. 原图与检测结果</h3>
<div id="originals"></div>
</section>

<section class="card">
<h3>4. 状态</h3>
<div id="status">请选择图片。</div>
</section>

<section class="card">
<h3>5. 输出预览</h3>
<div id="preview"></div>
<button id="downloadAll" disabled>下载全部 PNG</button>
</section>
</main>

<script>
(function(){
"use strict";

const $=id=>document.getElementById(id);
const OUT_W=528, OUT_H=792;
let records=[], outputs=[], busy=false;

function status(s){$("status").textContent=s}

function canvas(w,h){
 const c=document.createElement("canvas");
 c.width=Math.max(1,Math.round(w));
 c.height=Math.max(1,Math.round(h));
 return c;
}

function crop(src,x,y,w,h){
 x=Math.max(0,Math.floor(x));
 y=Math.max(0,Math.floor(y));
 w=Math.max(1,Math.min(src.width-x,Math.ceil(w)));
 h=Math.max(1,Math.min(src.height-y,Math.ceil(h)));
 const c=canvas(w,h);
 c.getContext("2d").drawImage(src,x,y,w,h,0,0,w,h);
 return c;
}

 function rotate90(src){
  const c = document.createElement("canvas");
  c.width = src.height;
  c.height = src.width;
  const ctx = c.getContext("2d");
  ctx.translate(c.width / 2, c.height / 2);
  ctx.rotate(Math.PI / 2);
  ctx.drawImage(src, -src.width / 2, -src.height / 2);
  return c;
}

function loadImage(file){
 return new Promise((resolve,reject)=>{
  const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{URL.revokeObjectURL(url);resolve(img)};
  img.onerror=()=>{URL.revokeObjectURL(url);reject(Error("无法读取："+file.name))};
  img.src=url;
 });
}

function imageCanvas(img){
 const c=canvas(img.naturalWidth||img.width,img.naturalHeight||img.height);
 c.getContext("2d").drawImage(img,0,0,c.width,c.height);
 return c;
}

function grayImage(src,maxW=480,maxH=760){
 const scale=Math.min(1,maxW/src.width,maxH/src.height);
 const w=Math.max(1,Math.round(src.width*scale));
 const h=Math.max(1,Math.round(src.height*scale));
 const c=canvas(w,h);
 const ctx=c.getContext("2d",{willReadFrequently:true});
 ctx.drawImage(src,0,0,w,h);
 const d=ctx.getImageData(0,0,w,h).data;
 const g=new Uint8Array(w*h);
 for(let i=0,p=0;i<d.length;i+=4,p++){
  g[p]=Math.round(.299*d[i]+.587*d[i+1]+.114*d[i+2]);
 }
 return {g,w,h,scale};
}

function isColorPage(src){
 const c=canvas(80,110),ctx=c.getContext("2d",{willReadFrequently:true});
 ctx.drawImage(src,0,0,80,110);
 const d=ctx.getImageData(0,0,80,110).data;
 let colored=0,n=0;
 for(let i=0;i<d.length;i+=16){
  if(Math.max(d[i],d[i+1],d[i+2])-Math.min(d[i],d[i+1],d[i+2])>38)colored++;
  n++;
 }
 return colored/Math.max(1,n)>.10;
}

/* 从四边裁切近白色边缘，限制裁切范围，避免误删漫画内容。 */
function trimWhite(src){
 const mode=$("trimMode").value;
 if(mode==="off")return src;

 const {g,w,h,scale}=grayImage(src,600,850);
 const threshold=mode==="strong"?243:249;
 const maxFraction=mode==="strong"?.20:.11;

 function whiteRow(y){
  let n=0,k=0;
  for(let x=0;x<w;x+=2){n++;if(g[y*w+x]>=threshold)k++}
  return k/Math.max(1,n);
 }
 function whiteCol(x){
  let n=0,k=0;
  for(let y=0;y<h;y+=2){n++;if(g[y*w+x]>=threshold)k++}
  return k/Math.max(1,n);
 }

 let t=0,b=h-1,l=0,r=w-1;
 const maxY=Math.floor(h*maxFraction);
 const maxX=Math.floor(w*maxFraction);

 while(t<maxY&&whiteRow(t)>.94)t++;
 while(b>h-1-maxY&&whiteRow(b)>.94)b--;
 while(l<maxX&&whiteCol(l)>.94)l++;
 while(r>w-1-maxX&&whiteCol(r)>.94)r--;

 if(r-l<w*.45||b-t<h*.45)return src;

 return crop(src,
  Math.round(l/scale),Math.round(t/scale),
  Math.round((r-l+1)/scale),Math.round((b-t+1)/scale));
}

/*
 * 检测双页中缝。
 * 不能只因为中央某一列是白色就判定为中缝；
 * 中央亮带两侧必须都存在足够的漫画墨迹。
 */
function detectGutter(src){
 if(src.width/src.height<1.25)return null;

 const {g,w,h,scale}=grayImage(src,650,850);
 const xa=Math.floor(w*.36),xb=Math.ceil(w*.64);
 let bestX=-1,bestScore=0;

 for(let x=xa;x<xb;x++){
  let white=0,n=0;
  for(let y=Math.floor(h*.08);y<h*.92;y+=2){
   n++;
   if(g[y*w+x]>218)white++;
  }
  const score=white/Math.max(1,n);
  if(score>bestScore){bestScore=score;bestX=x}
 }

 if(bestX<0||bestScore<.68)return null;

 const band=Math.max(2,Math.round(w*.008));
 let left=bestX,right=bestX;

 while(left>xa&&g[Math.floor(h*.5)*w+left-1]>205)left--;
 while(right<xb-1&&g[Math.floor(h*.5)*w+right+1]>205)right++;

 if(right-left>w*.07)return null;

 function ink(a,b){
  let k=0,n=0;
  for(let y=Math.floor(h*.12);y<h*.88;y+=3){
   for(let x=Math.max(0,a);x<Math.min(w,b);x+=3){
    n++;
    if(g[y*w+x]<180)k++;
   }
  }
  return k/Math.max(1,n);
 }

 if(ink(bestX-band*5,bestX-band)<.012)return null;
 if(ink(bestX+band,bestX+band*5)<.012)return null;

 return Math.round(bestX/scale);
}

/*
 * 黑色边界检测。
 *
 * 不把白色横带作为分割线。
 * 候选线必须具有足够长的暗色像素支持。
 * 检测多种斜率；斜线只作为结构证据，不会直接把
 * 斜线的中点冒充成整页的水平切割坐标。
 *
 * 规则算法无法百分之百区分气泡边缘和画框，
 * 因此要求候选线足够长、暗线证据足够强。
 */

/*
 * 黑色画框边界检测（修正版）
 *
 * 1. 单根黑线可以独立成为候选边界，不强制要求双线配对。
 * 2. 双黑线之间的白色间隙只作为辅助证据，不作为必需条件。
 * 3. 检测水平线和倾斜线。
 * 4. 尽量排除气泡轮廓、短线和文字造成的误判。
 * 5. 相邻候选只合并非常接近的重复检测，避免漏掉不同画格的边界。
 */
function detectBorders(src){
 const {g,w,h,scale}=grayImage(src,520,780);
 const sensitivity=$("sensitivity").value;

 const darkLimit=sensitivity==="strict"?82:
                 sensitivity==="sensitive"?135:110;

 const minCoverage=sensitivity==="strict"?.70:
                   sensitivity==="sensitive"?.48:.58;

 const x0=Math.floor(w*.035);
 const x1=Math.ceil(w*.965);
 const width=x1-x0;

 const lineCandidates=[];

 /*
  * 扫描不同角度的黑线。
  * 每条候选线分成多个区段，允许局部被文字或图案遮挡。
  */
 function scanSlope(degrees){
  const slope=Math.tan(degrees*Math.PI/180);
  const bins=40;
  const binWidth=width/bins;
  const minY=Math.floor(h*.06);
  const maxY=Math.ceil(h*.94);

  // 更密集地扫描，减少细线漏检
  const step=Math.max(1,Math.round(h*.0025));

  for(let base=minY;base<maxY;base+=step){
   let hitBins=0;
   let first=-1;
   let last=-1;
   let totalHits=0;
   let totalSamples=0;

   for(let bi=0;bi<bins;bi++){
    const xa=Math.floor(x0+bi*binWidth);
    const xb=Math.min(x1,Math.floor(x0+(bi+1)*binWidth));

    let localHits=0;
    let localN=0;

    for(let x=xa;x<xb;x+=2){
     const y=Math.round(base+slope*(x-(x0+x1)/2));

     if(y<1||y>=h-1)continue;

     localN++;

     const v=g[y*w+x];
     const above=g[(y-1)*w+x];
     const below=g[(y+1)*w+x];

     /*
      * 黑线判断：
      * 允许线条周围不是纯白色，避免扫描灰度漫画时漏检。
      */
     if(v<darkLimit &&
        v<=above+24 &&
        v<=below+24){
      localHits++;
     }
    }

    totalHits+=localHits;
    totalSamples+=localN;

    if(localN&&localHits/Math.max(1,localN)>.38){
     hitBins++;
     if(first<0)first=bi;
     last=bi;
    }
   }

   const coverage=hitBins/bins;
   const lengthRatio=first<0?0:(last-first+1)/bins;

   /*
    * 单根线独立判断。
    * 不再要求必须找到第二根平行黑线。
    */
   if(coverage>=minCoverage&&lengthRatio>=.55){
    lineCandidates.push({
     base,
     degrees,
     slope,
     coverage,
     lengthRatio,
     score:coverage*.65+lengthRatio*.35
    });
   }
  }
 }

 // 先检查水平及接近水平的线，再检查倾斜线
 for(let deg=-30;deg<=30;deg+=3){
  scanSlope(deg);
 }

 /*
  * 合并同一根线反复扫描产生的重复结果。
  * 这里使用较小的距离，避免把相邻画框线合并掉。
  */
 lineCandidates.sort((a,b)=>b.score-a.score);

 const unique=[];

 for(const c of lineCandidates){
  const duplicate=unique.some(u=>
   Math.abs(u.base-c.base)<h*.006&&
   Math.abs(u.degrees-c.degrees)<4
  );

  if(!duplicate)unique.push(c);
 }

 /*
  * 对双黑线进行辅助判断：
  * 如果两条接近水平的暗线之间存在明显亮带，
  * 则提高这两条线的可信度。
  *
  * 注意：即使找不到配对线，单根线仍然保留。
  */
 const horizontal=unique.filter(c=>Math.abs(c.degrees)<=9);

 function brightGapBetween(a,b){
  const y1=Math.round(Math.min(a.base,b.base));
  const y2=Math.round(Math.max(a.base,b.base));

  if(y2-y1<2)return false;

  let bright=0;
  let total=0;

  const xa=Math.floor(x0+width*.08);
  const xb=Math.ceil(x1-width*.08);

  for(let y=y1+1;y<y2;y+=2){
   for(let x=xa;x<xb;x+=3){
    total++;
    if(g[y*w+x]>190)bright++;
   }
  }

  return total>0&&bright/total>.58;
 }

 for(let i=0;i<horizontal.length;i++){
  const a=horizontal[i];

  for(let j=i+1;j<horizontal.length;j++){
   const b=horizontal[j];
   const distance=Math.abs(a.base-b.base);

   if(distance>h*.025)break;
   if(distance<h*.002)continue;

   if(Math.abs(a.degrees-b.degrees)>4)continue;

   if(brightGapBetween(a,b)){
    a.score=Math.min(1,a.score+.10);
    b.score=Math.min(1,b.score+.10);
   }
  }
 }

 /*
  * 生成横向切割候选。
  * 只合并距离很近的重复检测。
  * 不会因为附近还有另一根线，就丢弃当前线。
  */
 horizontal.sort((a,b)=>a.base-b.base);

 const boundaries=[];

 for(const c of horizontal){
  if(c.base<h*.07||c.base>h*.93)continue;

  const y=Math.round(c.base/scale);
  const prev=boundaries[boundaries.length-1];

  if(prev&&Math.abs(prev.y-y)<h/scale*.006){
   if(c.score>prev.score){
    prev.y=y;
    prev.score=c.score;
    prev.coverage=c.coverage;
   }
  }else{
   boundaries.push({
    y,
    score:c.score,
    coverage:c.coverage,
    kind:"黑色横向边界"
   });
  }
 }

 /*
  * 斜线保留给调试图显示。
  * 不把斜线的中点直接当作水平切割位置。
  */
 const slanted=unique
  .filter(c=>Math.abs(c.degrees)>9)
  .map(c=>({
   y:Math.round(c.base/scale),
   degrees:c.degrees,
   coverage:c.coverage,
   score:c.score
  }));

 return {
  w,h,scale,
  boundaries,
  slanted
 };
}
    



function analyzePage(src){
 const d=detectBorders(src);
 const cuts=[];
 for(const c of d.boundaries){
  if(c.y<src.height*.10||c.y>src.height*.90)continue;
  if(!cuts.length||c.y-cuts[cuts.length-1]>=src.height*.10){
   cuts.push(c.y);
  }
 }
 return {cuts,detected:d};
}

/* 判断是否有足够强的横向边界证据。 */
function shouldSplit(src,a){
 if(a.cuts.length<1){
  return {split:false,reason:"没有找到可靠的黑色横向画框边界"};
 }

 const segments=[];
 let last=0;
 for(const y of a.cuts){
  if(y-last>=src.height*.12)segments.push({top:last,bottom:y});
  last=y;
 }
 if(src.height-last>=src.height*.12){
  segments.push({top:last,bottom:src.height});
 }

 if(segments.length<2){
  return {split:false,reason:"黑线不足以确认多个画格"};
 }

 /*
  * 不能因为检测到一根线，就声称它一定是画框。
  * 要求至少有两个有效区域，且边界上下都有墨迹。
  */
 const inkCheck=grayImage(src,300,450);
 const {g,w,h,scale}=inkCheck;
 const valid=[];

 for(const y0 of a.cuts){
  const y=Math.round(y0*scale);
  const radius=Math.max(3,Math.round(h*.035));
  let up=0,dn=0,nu=0,nd=0;

  for(let yy=Math.max(0,y-radius);yy<y;yy++){
   let row=0;
   for(let x=Math.floor(w*.04);x<w*.96;x+=2){
    if(g[yy*w+x]<175)row++;
   }
   up+=row/Math.max(1,w*.46);
   nu++;
  }

  for(let yy=y+1;yy<=Math.min(h-1,y+radius);yy++){
   let row=0;
   for(let x=Math.floor(w*.04);x<w*.96;x+=2){
    if(g[yy*w+x]<175)row++;
   }
   dn+=row/Math.max(1,w*.46);
   nd++;
  }

  if(up/Math.max(1,nu)>.018&&dn/Math.max(1,nd)>.018){
   valid.push(y0);
  }
 }

 if(valid.length<1){
  return {split:false,reason:"边界上下结构证据不足，保持整页"};
 }

 return {
  split:true,
  reason:"找到 "+valid.length+" 条黑色横向边界候选",
  cuts:valid
 };
}

/*
 * 将横向取景转换成 X3 文件。
 * 源裁切框比例约为 3:2，旋转后恰好匹配 528:792。
 * 不再使用 min() 缩小整页并留下大片白边。
 */
function makeLandscapePage(src){
 const targetH=Math.max(1,Math.min(src.height,Math.round(src.width*2/3)));
 const centerY=src.height/2;
 const y=Math.max(0,Math.min(src.height-targetH,Math.round(centerY-targetH/2)));
 const piece=crop(src,0,y,src.width,targetH);
 return makePage(rotate90(piece));
}

function makePage(src){
 const c=canvas(OUT_W,OUT_H);
 const ctx=c.getContext("2d");
 ctx.fillStyle="#fff";
 ctx.fillRect(0,0,OUT_W,OUT_H);

 /*
  * 此处输入应为 2:3 纵向图像。
  * 强制铺满输出尺寸，避免白色留边。
  */
 ctx.imageSmoothingEnabled=true;
 ctx.imageSmoothingQuality="high";
 ctx.drawImage(src,0,0,OUT_W,OUT_H);
 return c;
}

function safeName(s){
 return s.replace(/\.[^.]+$/,"")
  .replace(/[\\/:*?"<>|]/g,"_").slice(0,100)||"comic";
}

function addOutput(c,name){
 outputs.push({canvas:c,name});
}

/* 在原图上画出真实检测到的横线和斜线。 */
function makeDebug(src,a){
 const c=canvas(src.width,src.height);
 const ctx=c.getContext("2d");
 ctx.drawImage(src,0,0);

 ctx.lineWidth=Math.max(2,src.width/350);
 ctx.strokeStyle="#00c853";

 for(const b of a.detected.boundaries){
  ctx.beginPath();
  ctx.moveTo(0,b.y);
  ctx.lineTo(src.width,b.y);
  ctx.stroke();
 }

 ctx.strokeStyle="#ff9800";
 for(const s of a.detected.slanted){
  const y=s.y;
  const slope=Math.tan(s.degrees*Math.PI/180);
  ctx.beginPath();
  ctx.moveTo(0,y-slope*src.width/2);
  ctx.lineTo(src.width,y+slope*src.width/2);
  ctx.stroke();
 }

 return c;
}

function renderOriginals(){
 const root=$("originals");
 root.replaceChildren();

 records.forEach((r,i)=>{
  const box=document.createElement("div");
  box.className="item";

  const img=document.createElement("img");
  img.src=(r.debug||r.canvas).toDataURL("image/jpeg",.85);

  const t=document.createElement("div");
  t.textContent=(i+1)+". "+r.file.name+"\n"+(r.reason||"等待处理");

  box.append(img,t);
  root.append(box);
 });
}

function renderOutputs(){
 const root=$("preview");
 root.replaceChildren();

 outputs.forEach((o,i)=>{
  const box=document.createElement("div");
  box.className="item";

  const img=document.createElement("img");
  img.src=o.canvas.toDataURL("image/png");

  const t=document.createElement("div");
  t.textContent=(i+1)+". "+o.name;

  const b=document.createElement("button");
  b.className="secondary";
  b.textContent="下载此页";
  b.onclick=()=>downloadOne(o);

  box.append(img,t,b);
  root.append(box);
 });

 $("downloadAll").disabled=!outputs.length;
}

function downloadOne(o){
 const a=document.createElement("a");
 a.href=o.canvas.toDataURL("image/png");
 a.download=o.name;
 document.body.append(a);
 a.click();
 a.remove();
}

/*
 * 普通黑白页的输出：
 * 1. 画框证据不足：保持原页方向。
 * 2. 有画框证据：依据页面纵向范围制作重叠取景。
 * 3. 取景窗口始终尽可能填满 X3 画面。
 *
 * 说明：这里不声称能准确提取每个不规则漫画格；
 * 对复杂斜框，保留重叠比错误拼接更稳妥。
 */
function makeOverlappingViews(src,count,overlap){
 const viewportH=Math.max(1,Math.round(src.width*2/3));
 const maxTop=Math.max(0,src.height-viewportH);

 if(maxTop===0){
  return [makePage(rotate90(src))];
 }

 const desired=[];
 if(count===2){
  desired.push(0,maxTop);
 }else{
  desired.push(0,Math.round(maxTop/2),maxTop);
 }

 /*
  * 重叠参数越大，相邻窗口中心越靠近。
  * 不允许窗口超出图片边缘。
  */
 const baseStep=maxTop/Math.max(1,count-1);
 const overlapRatio=Math.max(0,Math.min(300,overlap))/300;
 const step=baseStep*(1-overlapRatio*.38);

 const tops=[];
 for(let i=0;i<count;i++){
  let top=Math.round(i*step);
  top=Math.min(maxTop,top);
  if(i===count-1)top=maxTop;
  if(!tops.length||top-tops[tops.length-1]>=Math.max(1,viewportH*.18)){
   tops.push(top);
  }
 }

 /*
  * 如果窗口数量因图片很短而减少，仍然至少保留一张。
  */
 if(!tops.length)tops.push(0);

 return tops.map((top,i)=>{
  const piece=crop(src,0,top,src.width,
   Math.min(viewportH,src.height-top));
  return {
   canvas:makePage(rotate90(piece)),
   top,
   index:i+1
  };
 });
}

async function process(){
 if(busy||!records.length)return;

 busy=true;
 $("run").disabled=true;
 outputs=[];
 $("preview").replaceChildren();

 try{
  const parts=Number($("parts").value);
  const overlap=Math.max(0,Math.min(300,Number($("overlap").value)||0));

  for(let fi=0;fi<records.length;fi++){
   const r=records[fi];
   r.debug=null;

   status("处理 "+(fi+1)+"/"+records.length+"："+r.file.name);

   const color=isColorPage(r.canvas);
   const base=trimWhite(r.canvas);
   const gutter=color?null:detectGutter(base);
   const pageList=[];

   if(color){
    pageList.push({canvas:base,suffix:"_color",portrait:true});
   }else if(gutter!==null){
    /*
     * 日漫通常右页先读，因此先输出右半页。
     */
    pageList.push({
     canvas:trimWhite(crop(base,gutter,0,base.width-gutter,base.height)),
     suffix:"_R"
    });
    pageList.push({
     canvas:trimWhite(crop(base,0,0,gutter,base.height)),
     suffix:"_L"
    });
   }else{
    pageList.push({canvas:base,suffix:""});
   }

   const notes=[];

   for(const p of pageList){
    const page=p.canvas;
    const name=safeName(r.file.name)+p.suffix;

    if(p.portrait){
     addOutput(makePage(page),name+"_portrait.png");
     notes.push("彩页保留整页");
     continue;
    }

    const analysis=analyzePage(page);
    const decision=shouldSplit(page,analysis);

    if($("debug").checked&&!r.debug){
     r.debug=makeDebug(page,analysis);
    }

    if(!decision.split){
     /*
      * 未确认画框时，不制造虚假的画格分割。
      */
     addOutput(makePage(page),name+"_portrait.png");
     notes.push(decision.reason+"，保持整页");
     continue;
    }

    const views=makeOverlappingViews(page,parts,overlap);
    views.forEach((v,i)=>{
     addOutput(v.canvas,
      name+"_view_"+String(i+1).padStart(2,"0")+".png");
    });

    notes.push(decision.reason+"；输出 "+views.length+" 张重叠取景");
   }

   r.reason=(color?"彩页；":gutter!==null?"检测到双页中缝，右页优先；":"")+notes.join("；");

   renderOriginals();
   renderOutputs();

   status("已处理 "+(fi+1)+"/"+records.length+"："+r.file.name+
    "\n"+r.reason+"\n累计输出："+outputs.length+" 页");

   await new Promise(resolve=>setTimeout(resolve,0));
  }

  status("处理完成。\n输入图片："+records.length+
   " 张\n输出 PNG："+outputs.length+
   " 张\n输出尺寸：528×792\n调试图中绿色线为横向黑线候选，橙色线为斜线候选。"+
   "\n请重点检查误判和标题页。");
 }catch(e){
  console.error(e);
  status("处理失败："+(e.message||String(e)));
 }finally{
  busy=false;
  $("run").disabled=false;
 }
}

$("files").addEventListener("change",async()=>{
 if(busy)return;

 records=[];
 outputs=[];
 $("preview").replaceChildren();
 $("originals").replaceChildren();
 $("downloadAll").disabled=true;

 const files=Array.from($("files").files||[]);
 if(!files.length){status("请选择图片。");return}

 try{
  for(const f of files){
   const img=await loadImage(f);
   records.push({
    file:f,
    canvas:imageCanvas(img),
    reason:"等待处理"
   });
  }

  renderOriginals();
  status("读取完成："+records.length+" 张图片。");
 }catch(e){
  status("读取失败："+e.message);
 }
});

$("run").addEventListener("click",process);

$("clear").addEventListener("click",()=>{
 if(busy)return;

 records=[];
 outputs=[];
 $("files").value="";
 $("originals").replaceChildren();
 $("preview").replaceChildren();
 $("downloadAll").disabled=true;
 status("已清空。");
});

$("downloadAll").addEventListener("click",async()=>{
 if(!outputs.length)return;

 $("downloadAll").disabled=true;
 for(const o of outputs){
  downloadOne(o);
  await new Promise(r=>setTimeout(r,250));
 }

 status("已发起 "+outputs.length+
  " 张 PNG 下载。如浏览器拦截，请允许多文件下载。");
 $("downloadAll").disabled=false;
});

})();
