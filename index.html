
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>X3 图片均分切页工具</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:16px;background:#f3f4f6;color:#222;font-family:system-ui,-apple-system,sans-serif}
main{max-width:900px;margin:auto}
h1{font-size:23px;margin:0 0 8px}
p{font-size:14px;line-height:1.7;color:#555}
.card{background:white;border-radius:12px;padding:16px;margin:14px 0;box-shadow:0 2px 8px #00000008}
label{display:block;margin:14px 0;font-size:14px}
select,input[type=number]{padding:8px;border:1px solid #ccc;border-radius:7px;font-size:15px}
input[type=file]{max-width:100%}
button{border:0;border-radius:8px;background:#1769aa;color:white;padding:11px 15px;font-size:15px;margin:4px 5px 4px 0;cursor:pointer}
button.secondary{background:#555}
button:disabled{opacity:.5}
#status{font-size:14px;line-height:1.7;white-space:pre-wrap}
#preview{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:12px}
.item{min-width:0;padding:8px;background:#eee;border-radius:8px}
.item img{display:block;width:100%;height:auto;background:white}
.item div{font-size:12px;line-height:1.5;overflow-wrap:anywhere;margin:6px 0}
.original{margin:12px 0}
.original img{display:block;max-width:100%;height:auto}
.small{font-size:12px;color:#777}
hr{border:0;border-top:1px solid #ddd;margin:15px 0}
</style>
</head>
<body>
<main>
<h1>X3 图片均分切页工具</h1>
<p>
全新简化版：先裁掉四周白边，再将长图沿上下方向均分为 2 份或 3 份。
不识别漫画格子、不拼格子，允许相邻页面重复部分画面。
每份独立适配 X3 的 792 × 528 横屏页面。
</p>

<section class="card">
<h3>1. 选择图片</h3>
<input id="files" type="file" accept="image/*" multiple>
<p class="small">支持一次选择多张图片，按文件选择顺序处理。</p>
</section>

<section class="card">
<h3>2. 切割设置</h3>

<label>
切成几份
<br>
<select id="parts">
<option value="2">均分 2 份</option>
<option value="3">均分 3 份</option>
</select>
</label>

<label>
页面重叠量
<br>
<input id="overlap" type="number" min="0" max="200" step="4" value="24"> 像素
<p class="small">相邻两份会重复这部分画面。数值越大，越不容易漏掉边界内容。</p>
</label>

<label>
白边裁切强度
<br>
<select id="trim">
<option value="normal">普通：只裁明显白边</option>
<option value="strong" selected>积极：尽量裁掉边框和边框水印</option>
<option value="off">不裁白边</option>
</select>
<p class="small">裁切根据边缘连续的近白区域判断。水印若覆盖整条边缘或颜色很深，无法保证完全去除。</p>
</label>

<label>
页面输出
<br>
<select id="fit">
<option value="fit">完整显示，保持比例（推荐）</option>
<option value="fill">铺满页面，允许裁掉左右少量内容</option>
</select>
</label>

<button id="run">开始切割</button>
<button id="clear" class="secondary">清空</button>
</section>

<section class="card">
<h3>3. 处理状态</h3>
<div id="status">请选择图片，然后开始切割。</div>
</section>

<section class="card">
<h3>4. 原图</h3>
<div id="originals"></div>
</section>

<section class="card">
<h3>5. 输出预览</h3>
<p class="small">每张输出图片都是 792 × 528。可逐页下载，也可以下载全部 PNG。</p>
<div id="preview"></div>
<hr>
<button id="download" disabled>下载全部 PNG</button>
</section>
</main>

<script>
(function(){
"use strict";

const PAGE_W=792;
const PAGE_H=528;
const $=id=>document.getElementById(id);
let outputs=[];
let busy=false;

function status(s){
  $("status").textContent=s;
}

function canvas(w,h){
  const c=document.createElement("canvas");
  c.width=Math.max(1,Math.round(w));
  c.height=Math.max(1,Math.round(h));
  return c;
}

function readImage(file){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{
      URL.revokeObjectURL(url);
      resolve(img);
    };
    img.onerror=()=>{
      URL.revokeObjectURL(url);
      reject(new Error("无法读取图片："+file.name));
    };
    img.src=url;
  });
}

function fromImage(img){
  const c=canvas(img.naturalWidth||img.width,img.naturalHeight||img.height);
  c.getContext("2d",{willReadFrequently:true})
    .drawImage(img,0,0,c.width,c.height);
  return c;
}

function crop(src,x,y,w,h){
  x=Math.max(0,Math.floor(x));
  y=Math.max(0,Math.floor(y));
  w=Math.max(1,Math.min(src.width-x,Math.ceil(w)));
  h=Math.max(1,Math.min(src.height-y,Math.ceil(h)));
  const c=canvas(w,h);
  c.getContext("2d").drawImage(src,x,y,w,h,0,0,w,h);
  return c;
}

/*
 * 沿图片四边扫描近白区域。
 * 使用整行/整列的亮色占比判断，因此少量水印不会阻止裁边。
 * 只在外侧有限区域内裁切，防止误删图片内部大块白色区域。
 */
function trimWhiteBorder(src){
  const mode=$("trim").value;
  if(mode==="off")return src;

  const w=src.width,h=src.height;
  if(w<10||h<10)return src;

  const data=src.getContext("2d",{willReadFrequently:true})
    .getImageData(0,0,w,h).data;

  const ratioThreshold=mode==="strong"?0.86:0.94;
  const maxX=Math.floor(w*(mode==="strong"?0.18:0.10));
  const maxY=Math.floor(h*(mode==="strong"?0.18:0.10));
  const sampleStep=Math.max(1,Math.floor(Math.min(w,h)/1200));

  function isBright(r,g,b,a){
    if(a<10)return true;
    return r>=242&&g>=242&&b>=242;
  }

  function rowBrightRatio(y){
    let bright=0,total=0;
    for(let x=0;x<w;x+=sampleStep){
      const i=(y*w+x)*4;
      if(isBright(data[i],data[i+1],data[i+2],data[i+3]))bright++;
      total++;
    }
    return bright/Math.max(1,total);
  }

  function colBrightRatio(x){
    let bright=0,total=0;
    for(let y=0;y<h;y+=sampleStep){
      const i=(y*w+x)*4;
      if(isBright(data[i],data[i+1],data[i+2],data[i+3]))bright++;
      total++;
    }
    return bright/Math.max(1,total);
  }

  let top=0,bottom=h-1,left=0,right=w-1;

  // 连续扫描四边，遇到不够白的整行/列即停止。
  while(top<maxY&&rowBrightRatio(top)>=ratioThreshold)top++;
  while(bottom>h-1-maxY&&rowBrightRatio(bottom)>=ratioThreshold)bottom--;
  while(left<maxX&&colBrightRatio(left)>=ratioThreshold)left++;
  while(right>w-1-maxX&&colBrightRatio(right)>=ratioThreshold)right--;

  // 防止极端情况裁得过多。
  if(right-left<w*0.45||bottom-top<h*0.45)return src;

  // 避免留下扫描停止位置的白边，向内容方向微调一小段。
  return crop(src,left,top,right-left+1,bottom-top+1);
}

/*
 * 统一输出 792×528。
 * fit：完整显示。
 * fill：铺满，必要时裁掉少量左右边缘。
 */
function makePage(src){
  const out=canvas(PAGE_W,PAGE_H);
  const ctx=out.getContext("2d");
  ctx.fillStyle="#fff";
  ctx.fillRect(0,0,PAGE_W,PAGE_H);

  const mode=$("fit").value;
  const scale=mode==="fill"
    ?Math.max(PAGE_W/src.width,PAGE_H/src.height)
    :Math.min(PAGE_W/src.width,PAGE_H/src.height);

  const dw=src.width*scale;
  const dh=src.height*scale;
  const dx=(PAGE_W-dw)/2;
  const dy=(PAGE_H-dh)/2;

  ctx.imageSmoothingEnabled=true;
  ctx.imageSmoothingQuality="high";
  ctx.drawImage(src,dx,dy,dw,dh);
  return out;
}

function safeName(s){
  return s.replace(/\.[^.]+$/,"")
    .replace(/[\\/:*?"<>|]/g,"_")
    .slice(0,100)||"image";
}

function addOriginal(file,src){
  const box=document.createElement("div");
  box.className="original";

  const title=document.createElement("div");
  title.textContent=file.name+"（原图 "+src.width+" × "+src.height+"）";

  const img=document.createElement("img");
  img.src=src.toDataURL("image/png");

  box.append(title,img);
  $("originals").appendChild(box);
}

function addOutput(c,name){
  outputs.push({canvas:c,name:name});
}

function render(){
  const root=$("preview");
  root.replaceChildren();

  outputs.forEach((item,i)=>{
    const box=document.createElement("div");
    box.className="item";

    const img=document.createElement("img");
    img.src=item.canvas.toDataURL("image/png");
    img.alt=item.name;

    const caption=document.createElement("div");
    caption.textContent=(i+1)+". "+item.name;

    const btn=document.createElement("button");
    btn.className="secondary";
    btn.textContent="下载此页";
    btn.onclick=()=>downloadOne(item);

    box.append(img,caption,btn);
    root.appendChild(box);
  });

  $("download").disabled=outputs.length===0;
}

function downloadOne(item){
  const a=document.createElement("a");
  a.href=item.canvas.toDataURL("image/png");
  a.download=item.name;
  document.body.appendChild(a);
  a.click();
  a.remove();
}

async function process(){
  if(busy)return;

  const files=Array.from($("files").files||[]);
  if(!files.length){
    status("请先选择图片。");
    return;
  }

  busy=true;
  $("run").disabled=true;
  $("preview").replaceChildren();
  $("originals").replaceChildren();
  outputs=[];

  try{
    const count=Number($("parts").value);
    const overlap=Math.max(0,Math.min(200,Number($("overlap").value)||0));
    let pageCount=0;

    for(let fi=0;fi<files.length;fi++){
      const file=files[fi];

      status(
        "正在处理 "+(fi+1)+"/"+files.length+"："+file.name+
        "\n已生成 "+pageCount+" 页。"
      );

      const img=await readImage(file);
      const original=fromImage(img);
      addOriginal(file,original);

      // 第一步：裁除四周白边。
      const src=trimWhiteBorder(original);

      // 第二步：沿纵向均分为 2 份或 3 份。
      const baseH=src.height/count;
      const baseName=safeName(file.name);

      for(let i=0;i<count;i++){
        // 每段上下重叠，避免切割线附近的画面丢失。
        const y0=Math.max(0,Math.floor(i*baseH-overlap/2));
        const y1=Math.min(
          src.height,
          Math.ceil((i+1)*baseH+(i<count-1?overlap/2:0))
        );

        const part=crop(src,0,y0,src.width,y1-y0);
        const page=makePage(part);

        addOutput(
          page,
          baseName+"_part_"+String(i+1).padStart(2,"0")+".png"
        );
        pageCount++;
      }

      status(
        "已处理 "+(fi+1)+"/"+files.length+"："+file.name+
        "\n裁边后尺寸："+src.width+" × "+src.height+
        "\n本图切成 "+count+" 份"+
        "\n累计生成 "+pageCount+" 页。"
      );

      render();
      await new Promise(resolve=>setTimeout(resolve,0));
    }

    status(
      "全部完成！\n"+
      "输入图片："+files.length+" 张\n"+
      "每张切成："+count+" 份\n"+
      "输出页面："+outputs.length+" 页\n"+
      "页面尺寸：792 × 528\n"+
      "没有进行格子识别或上下拼接。"
    );
  }catch(e){
    console.error(e);
    status("处理失败："+(e.message||String(e)));
  }finally{
    busy=false;
    $("run").disabled=false;
  }
}

$("run").addEventListener("click",process);

$("clear").addEventListener("click",()=>{
  if(busy)return;
  $("files").value="";
  $("preview").replaceChildren();
  $("originals").replaceChildren();
  outputs=[];
  $("download").disabled=true;
  status("已清空。请选择图片，然后开始切割。");
});

$("download").addEventListener("click",async()=>{
  if(!outputs.length)return;

  $("download").disabled=true;
  status("正在逐页发起下载，共 "+outputs.length+" 个 PNG 文件。");

  for(let i=0;i<outputs.length;i++){
    downloadOne(outputs[i]);
    await new Promise(resolve=>setTimeout(resolve,300));
  }

  status(
    "已发起全部 "+outputs.length+" 个 PNG 文件的下载。\n"+
    "若浏览器提示是否允许多个文件下载，请选择允许。"
  );
  $("download").disabled=false;
})();
})();
</script>
</body>
</html>
