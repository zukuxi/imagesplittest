<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>X3 日漫分割工具</title>
<style>
*{box-sizing:border-box}body{font:15px system-ui,sans-serif;background:#f3f4f6;color:#222;margin:0;padding:14px}main{max-width:1000px;margin:auto}.card{background:#fff;border-radius:12px;padding:14px;margin:12px 0}h1{font-size:22px}h3{font-size:17px}p{line-height:1.65;color:#555}label{display:block;margin:11px 0}button{padding:10px 14px;background:#1769aa;color:white;border:0;border-radius:8px;margin:4px}button:disabled{opacity:.45}.secondary{background:#555}input,select{font:inherit}input[type=number]{width:90px}#status{white-space:pre-wrap;line-height:1.7}#originals,#preview{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px}.item{background:#eee;padding:8px;border-radius:8px;min-width:0}.item img{width:100%;height:auto;display:block}.item div{font-size:12px;overflow-wrap:anywhere;white-space:pre-wrap;margin:6px 0}
</style></head><body><main>
<h1>X3 日漫分割工具</h1>
<p>结合 paneldet 的经典视觉思路（自适应背景阈值、递归白色间隙切分、连通区域与混合评分）和额外的保守判断。此版本是面向浏览器的 JavaScript 实现，不是把 Python 包直接塞进网页。无法可靠识别画格时保留整页。输出尺寸 528×792。</p>
<section class="card"><h3>1. 选择图片</h3><input id="files" type="file" accept="image/*" multiple></section>
<section class="card"><h3>2. 设置</h3>
<label>最大横向取景数量 <select id="parts"><option value="2">2 张</option><option value="3" selected>3 张</option></select></label>
<label>取景重叠像素 <input id="overlap" type="number" min="0" max="300" value="80"></label>
<label>白边裁切 <select id="trim"><option value="off">关闭</option><option value="normal">普通</option><option value="strong" selected>积极</option></select></label>
<label>检测策略 <select id="strategy"><option value="conservative" selected>保守（推荐，减少误切）</option><option value="balanced">均衡</option><option value="sensitive">灵敏</option></select></label>
<label><input id="debug" type="checkbox" checked> 显示检测线</label>
<button id="run">开始处理</button><button id="clear" class="secondary">清空</button></section>
<section class="card"><h3>3. 原图与判断</h3><div id="originals"></div></section>
<section class="card"><h3>4. 状态</h3><div id="status">请选择图片。</div></section>
<section class="card"><h3>5. 输出预览</h3><div id="preview"></div><button id="downloadAll" disabled>下载全部 PNG</button></section>
</main>
<script>
(()=>{"use strict";
const $=id=>document.getElementById(id),OW=528,OH=792;
let records=[],outputs=[],busy=false;
function canvas(w,h){let c=document.createElement("canvas");c.width=Math.max(1,Math.round(w));c.height=Math.max(1,Math.round(h));return c}
function crop(s,x,y,w,h){x=Math.max(0,Math.floor(x));y=Math.max(0,Math.floor(y));w=Math.max(1,Math.min(s.width-x,Math.ceil(w)));h=Math.max(1,Math.min(s.height-y,Math.ceil(h)));let c=canvas(w,h);c.getContext("2d").drawImage(s,x,y,w,h,0,0,w,h);return c}
function rotate90(s){let c=canvas(s.height,s.width),x=c.getContext("2d");x.translate(c.width/2,c.height/2);x.rotate(Math.PI/2);x.drawImage(s,-s.width/2,-s.height/2);return c}
function makePage(s){let c=canvas(OW,OH),x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,OW,OH);x.imageSmoothingEnabled=true;x.imageSmoothingQuality="high";x.drawImage(s,0,0,OW,OH);return c}
function loadImage(f){return new Promise((res,rej)=>{let u=URL.createObjectURL(f),i=new Image();i.onload=()=>{URL.revokeObjectURL(u);res(i)};i.onerror=()=>{URL.revokeObjectURL(u);rej(Error("无法读取："+f.name))};i.src=u})}
function toCanvas(i){let c=canvas(i.naturalWidth||i.width,i.naturalHeight||i.height);c.getContext("2d").drawImage(i,0,0);return c}
function gray(s,maxW=420,maxH=640){let scale=Math.min(1,maxW/s.width,maxH/s.height),w=Math.max(1,Math.round(s.width*scale)),h=Math.max(1,Math.round(s.height*scale)),c=canvas(w,h),x=c.getContext("2d",{willReadFrequently:true});x.drawImage(s,0,0,w,h);let d=x.getImageData(0,0,w,h).data,g=new Uint8Array(w*h);for(let i=0,p=0;i<d.length;i+=4,p++)g[p]=Math.round(.299*d[i]+.587*d[i+1]+.114*d[i+2]);return{g,w,h,scale}}
function colorPage(s){let c=canvas(72,96),x=c.getContext("2d",{willReadFrequently:true});x.drawImage(s,0,0,72,96);let d=x.getImageData(0,0,72,96).data,n=0,k=0;for(let i=0;i<d.length;i+=16){n++;if(Math.max(d[i],d[i+1],d[i+2])-Math.min(d[i],d[i+1],d[i+2])>38)k++}return k/n>.10}
function trimWhite(s){let mode=$("trim").value;if(mode==="off")return s;let{g,w,h,scale}=gray(s,600,850),th=mode==="strong"?243:249,lim=mode==="strong"?.20:.11;function row(y){let n=0,k=0;for(let x=0;x<w;x+=2){n++;if(g[y*w+x]>=th)k++}return k/n}function col(x){let n=0,k=0;for(let y=0;y<h;y+=2){n++;if(g[y*w+x]>=th)k++}return k/n}let t=0,b=h-1,l=0,r=w-1;while(t<h*lim&&row(t)>.94)t++;while(b>h-1-h*lim&&row(b)>.94)b--;while(l<w*lim&&col(l)>.94)l++;while(r>w-1-w*lim&&col(r)>.94)r--;if(r-l<w*.45||b-t<h*.45)return s;return crop(s,l/scale,t/scale,(r-l+1)/scale,(b-t+1)/scale)}
function detectSpreadGutter(s){if(s.width/s.height<1.25)return null;let{g,w,h,scale}=gray(s,600,780),lo=Math.floor(w*.36),hi=Math.ceil(w*.64),best=-1,bestScore=0;for(let x=lo;x<hi;x++){let white=0,n=0;for(let y=Math.floor(h*.08);y<h*.92;y+=2){n++;if(g[y*w+x]>218)white++}let q=white/n;if(q>bestScore){bestScore=q;best=x}}if(best<0||bestScore<.68)return null;let mid=Math.floor(h/2),l=best,r=best;while(l>lo&&g[mid*w+l-1]>205)l--;while(r<hi-1&&g[mid*w+r+1]>205)r++;if(r-l>w*.07)return null;function ink(a,b){let k=0,n=0;for(let y=Math.floor(h*.12);y<h*.88;y+=3)for(let x=Math.max(0,a);x<Math.min(w,b);x+=3){n++;if(g[y*w+x]<180)k++}return k/Math.max(1,n)}if(ink(best-w*.045,best-w*.012)<.012||ink(best+w*.012,best+w*.045)<.012)return null;return Math.round(best/scale)}
/* Adaptive threshold: estimate the page's paper tone from bright pixels instead of assuming pure white. */
function paperTone(g){let hist=new Uint32Array(256);for(let i=0;i<g.length;i+=3)hist[g[i]]++;let total=0;for(let i=180;i<256;i++)total+=hist[i];if(!total)return 245;let target=total*.55,n=0;for(let i=255;i>=180;i--){n+=hist[i];if(n>=target)return i}return 245}
function maskPage(src){let o=gray(src,440,660),{g,w,h,scale}=o,tone=paperTone(g),strategy=$("strategy").value;
 // Adaptive cutoff: scan grainy scans more gently, while keeping dark artwork as foreground.
 let cut=Math.max(145,Math.min(224,tone-(strategy==="sensitive"?20:strategy==="balanced"?28:36)));
 let mask=new Uint8Array(w*h);for(let i=0;i<g.length;i++)mask[i]=g[i]<cut?1:0;
 return{...o,mask,tone,cut}}
/* XY-cut style: find full-width horizontal runs of near-background pixels. */
function xyGutters(m){let{g,w,h,scale,tone}=m,strategy=$("strategy").value;
 let paper=Math.max(190,tone-(strategy==="sensitive"?12:strategy==="balanced"?8:5));
 let minWhite=strategy==="sensitive"?.70:strategy==="balanced"?.80:.88;
 let minRun=strategy==="sensitive"?.64:strategy==="balanced"?.73:.82;
 let rows=[];
 for(let y=Math.floor(h*.06);y<h*.94;y++){let white=0,run=0,best=0,ink=0;for(let x=Math.floor(w*.025);x<w*.975;x++){let v=g[y*w+x];if(v>=paper){white++;run++;if(run>best)best=run}else{run=0;if(v<m.cut)ink++}}
 let n=w*.95;if(white/n>=minWhite&&best/n>=minRun&&ink/n<.12)rows.push(y)}
 let groups=[];for(let y of rows){let p=groups[groups.length-1];if(!p||y>p.end+2)groups.push({start:y,end:y});else p.end=y}
 let cuts=[];for(let p of groups){let thick=p.end-p.start+1,cy=(p.start+p.end)/2;if(thick<Math.max(2,h*.003)||thick>h*.14||cy<h*.1||cy>h*.9)continue;
 function localInk(a,b){let k=0,n=0;for(let y=Math.max(0,a);y<Math.min(h,b);y+=2)for(let x=Math.floor(w*.06);x<w*.94;x+=3){n++;if(m.mask[y*w+x])k++}return k/Math.max(1,n)}
 if(localInk(cy-h*.08,cy-h*.015)>.015&&localInk(cy+h*.015,cy+h*.08)>.015)cuts.push({y:Math.round(cy/scale),score:(p.end-p.start+1)*localInk(cy-h*.08,cy-h*.015)*localInk(cy+h*.015,cy+h*.08)+.5})}
 return cuts}
/* Connected-component analysis: group foreground pixels, then use the component boxes to
   reject false full-width cuts that pass through one large connected illustration. */
function components(m){let{mask,w,h}=m,seen=new Uint8Array(w*h),boxes=[],stack=[];let minArea=Math.max(8,Math.floor(w*h*.00012)),maxNodes=Math.floor(w*h*.22);
 for(let i=0;i<mask.length;i++){if(!mask[i]||seen[i])continue;seen[i]=1;stack.push(i);let minX=w,maxX=0,minY=h,maxY=0,count=0;while(stack.length){let p=stack.pop(),x=p%w,y=(p/w)|0;count++;if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y;
 // 8-neighbour components: stop tiny text/screentone fragments from dominating by area filter later.
 for(let yy=Math.max(0,y-1);yy<=Math.min(h-1,y+1);yy++)for(let xx=Math.max(0,x-1);xx<=Math.min(w-1,x+1);xx++){let q=yy*w+xx;if(mask[q]&&!seen[q]){seen[q]=1;stack.push(q)}}}
 if(count>=minArea&&count<maxNodes)boxes.push({x:minX,y:minY,w:maxX-minX+1,h:maxY-minY+1,area:count})}
 return boxes}
function hybridCuts(src){let m=maskPage(src),xy=xyGutters(m),cc=components(m),{w,h,scale}=m;
 // Score each XY cut by how much foreground/connected artwork lies on both sides,
 // and whether a large component crosses the proposed gutter.
 let kept=[];for(let c of xy){let y=Math.round(c.y*scale);let cross=cc.filter(b=>b.y<y&&b.y+b.h>y&&b.w>w*.18&&b.h>h*.025);let inkUp=0,inkDown=0,n=0;for(let yy=Math.max(0,y-Math.floor(h*.08));yy<y;yy+=3)for(let x=Math.floor(w*.05);x<w*.95;x+=4){n++;if(m.mask[yy*w+x])inkUp++}let nu=0;for(let yy=y;yy<Math.min(h,y+Math.floor(h*.08));yy+=3)for(let x=Math.floor(w*.05);x<w*.95;x+=4){nu++;if(m.mask[yy*w+x])inkDown++}
 let crossingPenalty=cross.length?Math.min(.8,cross.length*.22):0;
 let score=c.score+Math.min(1,inkUp/Math.max(1,n)*8)+Math.min(1,inkDown/Math.max(1,nu)*8)-crossingPenalty;
 if(score>( $("strategy").value==="strict" ? 1.05 : $("strategy").value==="conservative" ? .8 : .48))kept.push({...c,score})}
 kept.sort((a,b)=>a.y-b.y);let out=[];for(let c of kept){let p=out[out.length-1];if(p&&c.y-p.y<src.height*.055){if(c.score>p.score)out[out.length-1]=c}else out.push(c)}
 return{cuts:out,mask:m,components:cc,xy}}
function analyze(src){let r=hybridCuts(src),cuts=r.cuts.filter(c=>c.y>src.height*.12&&c.y<src.height*.88),good=[];for(let c of cuts){if(!good.length||c.y-good[good.length-1].y>=src.height*.10)good.push(c)}
 let enough=good.length>=1&&good[0].y>src.height*.12&&src.height-good[good.length-1].y>src.height*.12;
 // Don't split pages where there is only one weak line and a huge connected component dominates.
 let large=r.components.filter(b=>b.area>r.mask.w*r.mask.h*.12).length;
 if(good.length===1&&large>=2&&$("strategy").value==="conservative")enough=false;
 return{...r,cuts:good,split:enough,reason:enough?"混合检测找到 "+good.length+" 条可信间隙":"XY/连通区域证据不足，保持整页"}}
function makeDebug(src,cuts){let c=canvas(src.width,src.height),x=c.getContext("2d");x.drawImage(src,0,0);x.strokeStyle="#00c853";x.lineWidth=Math.max(2,src.width/350);for(let b of cuts){x.beginPath();x.moveTo(0,b.y);x.lineTo(src.width,b.y);x.stroke()}return c}
function name(s){return s.replace(/\.[^.]+$/,"").replace(/[\\/:*?"<>|]/g,"_").slice(0,100)||"comic"}
function add(c,n){outputs.push({canvas:c,name:n})}
function views(s,count,overlap){let vh=Math.max(1,Math.min(s.height,Math.round(s.width*2/3))),max=s.height-vh;if(max<=0)return[{canvas:makePage(rotate90(s))}];let step=max/Math.max(1,count-1)*(1-Math.min(300,overlap)/300*.38),tops=[];for(let i=0;i<count;i++){let t=Math.min(max,Math.round(i*step));if(i===count-1)t=max;if(!tops.length||t-tops[tops.length-1]>=vh*.18)tops.push(t)}return tops.map((t,i)=>({canvas:makePage(rotate90(crop(s,0,t,s.width,Math.min(vh,s.height-t)))),index:i+1}))}
function download(o){let a=document.createElement("a");a.href=o.canvas.toDataURL("image/png");a.download=o.name;document.body.append(a);a.click();a.remove()}
function render(){let root=$("originals");root.replaceChildren();records.forEach((r,i)=>{let d=document.createElement("div");d.className="item";let im=document.createElement("img");im.src=(r.debug||r.canvas).toDataURL("image/jpeg",.85);let t=document.createElement("div");t.textContent=(i+1)+". "+r.file.name+"\n"+(r.reason||"等待处理");d.append(im,t);root.append(d)});root=$("preview");root.replaceChildren();outputs.forEach((o,i)=>{let d=document.createElement("div");d.className="item";let im=document.createElement("img");im.src=o.canvas.toDataURL("image/png");let t=document.createElement("div");t.textContent=(i+1)+". "+o.name;let b=document.createElement("button");b.className="secondary";b.textContent="下载此页";b.onclick=()=>download(o);d.append(im,t,b);root.append(d)});$("downloadAll").disabled=!outputs.length}
async function process(){if(busy||!records.length)return;busy=true;$("run").disabled=true;outputs=[];try{let count=Number($("parts").value),overlap=Number($("overlap").value)||0;for(let i=0;i<records.length;i++){let r=records[i],col=colorPage(r.canvas),base=trimWhite(r.canvas),gut=col?null:detectSpreadGutter(base),pages=col?[{src:base,suffix:"_color",portrait:true}]:gut!==null?[{src:trimWhite(crop(base,gut,0,base.width-gut,base.height)),suffix:"_R"},{src:trimWhite(crop(base,0,0,gut,base.height)),suffix:"_L"}]:[{src:base,suffix:""}],notes=[];r.debug=null;
 for(let p of pages){let s=p.src,nm=name(r.file.name)+p.suffix;if(p.portrait){add(makePage(s),nm+"_portrait.png");notes.push("彩页保留整页");continue}let a=analyze(s);if($("debug").checked&&!r.debug)r.debug=makeDebug(s,a.cuts);if(!a.split){add(makePage(s),nm+"_portrait.png");notes.push(a.reason+"，不切");continue}let v=views(s,count,overlap);v.forEach((q,j)=>add(q.canvas,nm+"_view_"+String(j+1).padStart(2,"0")+".png"));notes.push(a.reason+"；输出 "+v.length+" 张重叠取景")}
 r.reason=(col?"彩页；":gut!==null?"检测到双页中缝，右页优先；":"")+notes.join("；");render();$("status").textContent="处理 "+(i+1)+"/"+records.length+"："+r.file.name+"\n"+r.reason+"\n累计输出 "+outputs.length+" 页";await new Promise(res=>setTimeout(res,0))}
 $("status").textContent="处理完成。\n输入图片："+records.length+" 张\n输出 PNG："+outputs.length+" 张\n尺寸：528×792\n绿色线表示混合算法认为可信的水平间隙。请用前四张不切、第五张切的样本重点验证。"}catch(e){console.error(e);$("status").textContent="处理失败："+e.message}finally{busy=false;$("run").disabled=false}}
$("files").addEventListener("change",async()=>{if(busy)return;records=[];outputs=[];$("preview").replaceChildren();for(let f of Array.from($("files").files||[])){try{let im=await loadImage(f);records.push({file:f,canvas:toCanvas(im),reason:"等待处理"})}catch(e){$("status").textContent=e.message}}render();$("status").textContent="读取完成："+records.length+" 张图片。"});
$("run").addEventListener("click",process);$("clear").addEventListener("click",()=>{if(busy)return;records=[];outputs=[];$("files").value="";render();$("status").textContent="已清空。"});
$("downloadAll").addEventListener("click",async()=>{if(!outputs.length)return;$("downloadAll").disabled=true;for(let o of outputs){download(o);await new Promise(r=>setTimeout(r,250))}$("status").textContent="已发起 "+outputs.length+" 张 PNG 下载。如浏览器拦截，请允许多文件下载。";$("downloadAll").disabled=false});
})();
</script></body></html>
