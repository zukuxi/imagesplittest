
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>X3 日漫自动分割测试</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:14px;background:#f3f4f6;color:#222;font-family:system-ui,-apple-system,sans-serif}
main{max-width:960px;margin:auto}
h1{font-size:23px;margin:4px 0 10px}
h3{font-size:17px;margin:0 0 12px}
p{font-size:14px;line-height:1.7;color:#555}
.card{background:#fff;border-radius:12px;padding:15px;margin:13px 0;box-shadow:0 2px 8px #00000008}
label{display:block;font-size:14px;margin:12px 0}
select,input[type=number]{padding:8px;border:1px solid #ccc;border-radius:7px;font-size:14px;max-width:100%;background:#fff}
input[type=file]{max-width:100%}
button{border:0;border-radius:8px;background:#1769aa;color:white;padding:11px 15px;font-size:14px;margin:4px 5px 4px 0;cursor:pointer}
button.secondary{background:#555}
button:disabled{opacity:.45}
.small{font-size:12px;color:#777}
#status{white-space:pre-wrap;line-height:1.7;font-size:14px}
#originals{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.original{min-width:0;padding:10px;background:#f4f4f4;border-radius:9px}
.original img{display:block;max-width:100%;max-height:350px;width:auto;height:auto;margin:8px auto;background:#fff}
.original .filename{font-size:13px;overflow-wrap:anywhere;font-weight:600}
#preview{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:12px}
.item{min-width:0;padding:8px;background:#eee;border-radius:8px}
.item img{display:block;width:100%;height:auto;background:white}
.item div{font-size:12px;line-height:1.5;overflow-wrap:anywhere;margin:6px 0}
hr{border:0;border-top:1px solid #ddd;margin:15px 0}
</style>
</head>
<body>
<main>
<h1>X3 日漫自动分割测试</h1>
<p>
彩页不分页。黑白页先检测封闭对白框候选区域，再用 OCR 检查框内是否识别到文字。
有字的候选框不超过 3 个时保持整页，超过 3 个才尝试原有智能分页。
双页中缝按右页、左页顺序处理。最终输出为 528 × 792 PNG。
本工具仅生成 PNG，不转换 XTC/XTCH。
</p>

<section class="card">
<h3>1. 选择图片</h3>
<input id="files" type="file" accept="image/*" multiple>
<p class="small">支持多张图片，按文件选择顺序处理。</p>
</section>

<section class="card">
<h3>2. 分割设置</h3>
<label>
普通漫画内页分成几份<br>
<select id="parts">
<option value="2">2 份</option>
<option value="3" selected>3 份</option>
</select>
</label>
<label>
相邻分割区域重叠量<br>
<input id="overlap" type="number" min="0" max="200" step="4" value="24"> 像素
<p class="small">保留少量重叠，减少人物或对白在分割边缘被切断的风险。</p>
</label>
<label>
外围白边裁切<br>
<select id="trim">
<option value="normal">普通</option>
<option value="strong" selected>积极</option>
<option value="off">关闭</option>
</select>
</label>
<button id="run">开始自动判断与分割</button>
<button id="clear" class="secondary">清空</button>
</section>

<section class="card">
<h3>3. 原图与自动判断结果</h3>
<p class="small">显示每张图的处理判断和输出结果。</p>
<div id="originals"></div>
</section>

<section class="card">
<h3>4. 处理状态</h3>
<div id="status">请选择图片。</div>
</section>

<section class="card">
<h3>5. 分割结果预览</h3>
<p class="small">所有输出均为 528 × 792。分割页只旋转一次，避免倒置。</p>
<div id="preview"></div>
<hr>
<button id="download" disabled>下载全部 PNG</button>
</section>
</main>

<script>
(function(){
"use strict";

const $=id=>document.getElementById(id);
const PAGE_W=528;
const PAGE_H=792;
let records=[];
let outputs=[];
let busy=false;
let ocrWorkerPromise=null;

function status(s){
  $("status").textContent=s;
}

function makeCanvas(w,h){
  const c=document.createElement("canvas");
  c.width=Math.max(1,Math.round(w));
  c.height=Math.max(1,Math.round(h));
  return c;
}

function addOutput(canvas,name){
  outputs.push({canvas,name});
}

function readImage(file){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{
      URL.revokeObjectURL(url);
      resolve(img);
    };
    img.onerror=()=>{
      URL.revokeObjectURL(url);
      reject(new Error("无法读取图片："+file.name));
    };
    img.src=url;
  });
}

function imageToCanvas(img){
  const c=makeCanvas(img.naturalWidth||img.width,img.naturalHeight||img.height);
  c.getContext("2d",{willReadFrequently:true}).drawImage(img,0,0,c.width,c.height);
  return c;
}

function crop(src,x,y,w,h){
  x=Math.max(0,Math.floor(x));
  y=Math.max(0,Math.floor(y));
  w=Math.max(1,Math.min(src.width-x,Math.ceil(w)));
  h=Math.max(1,Math.min(src.height-y,Math.ceil(h)));
  const c=makeCanvas(w,h);
  c.getContext("2d").drawImage(src,x,y,w,h,0,0,w,h);
  return c;
}

function rotate90(src){
  const c=makeCanvas(src.height,src.width);
  const ctx=c.getContext("2d");
  ctx.translate(c.width/2,c.height/2);
  ctx.rotate(Math.PI/2);
  ctx.drawImage(src,-src.width/2,-src.height/2);
  return c;
}

/* 彩色页面保守检测 */
function isColorPage(src){
  const c=makeCanvas(80,120);
  const ctx=c.getContext("2d",{willReadFrequently:true});
  ctx.drawImage(src,0,0,80,120);
  const data=ctx.getImageData(0,0,80,120).data;
  let colored=0,sampled=0;

  for(let i=0;i<data.length;i+=16){
    const r=data[i],g=data[i+1],b=data[i+2];
    const max=Math.max(r,g,b);
    const min=Math.min(r,g,b);
    if(max>70&&max-min>35)colored++;
    sampled++;
  }
  return colored/Math.max(1,sampled)>0.08;
}

/* 裁切外围近白区域 */
function trimInfo(src){
  const mode=$("trim").value;
  const w=src.width,h=src.height;
  if(mode==="off"||w<10||h<10)return {canvas:src,left:0,top:0};

  const data=src.getContext("2d",{willReadFrequently:true}).getImageData(0,0,w,h).data;
  const threshold=mode==="strong"?0.86:0.94;
  const maxX=Math.floor(w*(mode==="strong"?0.18:0.10));
  const maxY=Math.floor(h*(mode==="strong"?0.18:0.10));
  const step=Math.max(1,Math.floor(Math.min(w,h)/1000));

  function bright(r,g,b,a){
    return a<10||(r>=242&&g>=242&&b>=242);
  }
  function rowRatio(y){
    let n=0,t=0;
    for(let x=0;x<w;x+=step){
      const i=(y*w+x)*4;
      if(bright(data[i],data[i+1],data[i+2],data[i+3]))n++;
      t++;
    }
    return n/Math.max(1,t);
  }
  function colRatio(x){
    let n=0,t=0;
    for(let y=0;y<h;y+=step){
      const i=(y*w+x)*4;
      if(bright(data[i],data[i+1],data[i+2],data[i+3]))n++;
      t++;
    }
    return n/Math.max(1,t);
  }

  let top=0,bottom=h-1,left=0,right=w-1;
  while(top<maxY&&rowRatio(top)>=threshold)top++;
  while(bottom>h-1-maxY&&rowRatio(bottom)>=threshold)bottom--;
  while(left<maxX&&colRatio(left)>=threshold)left++;
  while(right>w-1-maxX&&colRatio(right)>=threshold)right--;

  if(right-left<w*0.45||bottom-top<h*0.45){
    return {canvas:src,left:0,top:0};
  }

  return {
    canvas:crop(src,left,top,right-left+1,bottom-top+1),
    left,top
  };
}

function trim(src){
  return trimInfo(src).canvas;
}

/*
 * 第一步：找可能的封闭对白框。
 * 这里仍然是图像启发式候选检测，OCR会在下一步复核。
 */
function detectSpeechBalloons(src){
  const scale=Math.min(1,240/src.width,360/src.height);
  const w=Math.max(1,Math.round(src.width*scale));
  const h=Math.max(1,Math.round(src.height*scale));
  const c=makeCanvas(w,h);
  const ctx=c.getContext("2d",{willReadFrequently:true});
  ctx.drawImage(src,0,0,w,h);

  const rgba=ctx.getImageData(0,0,w,h).data;
  const gray=new Uint8Array(w*h);
  for(let i=0,p=0;i<rgba.length;i+=4,p++){
    gray[p]=Math.round(
      rgba[i]*0.299+rgba[i+1]*0.587+rgba[i+2]*0.114
    );
  }

  const visited=new Uint8Array(w*h);
  const queue=new Int32Array(w*h);
  let head=0,tail=0;

  function addExterior(i){
    if(i<0||i>=w*h||visited[i]||gray[i]<205)return;
    visited[i]=1;
    queue[tail++]=i;
  }

  for(let x=0;x<w;x++){
    addExterior(x);
    addExterior((h-1)*w+x);
  }
  for(let y=0;y<h;y++){
    addExterior(y*w);
    addExterior(y*w+w-1);
  }

  while(head<tail){
    const i=queue[head++];
    const x=i%w;
    const y=(i/w)|0;
    if(x>0)addExterior(i-1);
    if(x<w-1)addExterior(i+1);
    if(y>0)addExterior(i-w);
    if(y<h-1)addExterior(i+w);
  }

  const candidates=[];
  const minArea=Math.max(12,w*h*0.0010);
  const maxArea=w*h*0.12;

  for(let start=0;start<w*h;start++){
    if(visited[start]||gray[start]<205)continue;

    head=0;
    tail=0;
    queue[tail++]=start;
    visited[start]=1;

    let area=0;
    let minX=w,minY=h,maxX=0,maxY=0;

    while(head<tail){
      const i=queue[head++];
      const x=i%w;
      const y=(i/w)|0;
      area++;
      if(x<minX)minX=x;
      if(x>maxX)maxX=x;
      if(y<minY)minY=y;
      if(y>maxY)maxY=y;

      const neighbors=[
        x>0?i-1:-1,
        x<w-1?i+1:-1,
        y>0?i-w:-1,
        y<h-1?i+w:-1
      ];

      for(const j of neighbors){
        if(j>=0&&!visited[j]&&gray[j]>=205){
          visited[j]=1;
          queue[tail++]=j;
        }
      }
    }

    const bw=maxX-minX+1;
    const bh=maxY-minY+1;
    const boxArea=bw*bh;
    const ratio=bw/Math.max(1,bh);

    if(area<minArea||area>maxArea)continue;
    if(boxArea<minArea||boxArea>w*h*0.15)continue;
    if(bw<Math.max(7,w*0.035)||bh<Math.max(5,h*0.018))continue;
    if(bw>w*0.85||bh>h*0.65)continue;
    if(ratio<0.28||ratio>9)continue;
    if(minX<2||minY<2||maxX>w-3||maxY>h-3)continue;

    let dark=0;
    const bx0=Math.max(0,minX+1);
    const by0=Math.max(0,minY+1);
    const bx1=Math.min(w-1,maxX-1);
    const by1=Math.min(h-1,maxY-1);
    const bw2=bx1-bx0+1;
    const bh2=by1-by0+1;
    if(bw2<2||bh2<2)continue;

    const maskW=bw2,maskH=bh2;
    const mask=new Uint8Array(maskW*maskH);

    for(let yy=by0;yy<=by1;yy++){
      for(let xx=bx0;xx<=bx1;xx++){
        if(gray[yy*w+xx]<125){
          mask[(yy-by0)*maskW+(xx-bx0)]=1;
          dark++;
        }
      }
    }

    const inkRatio=dark/Math.max(1,mask.length);
    if(inkRatio<0.002||inkRatio>0.22)continue;

    const seen=new Uint8Array(mask.length);
    const componentQueue=new Int32Array(mask.length);
    let components=0;
    let largeBlobs=0;

    for(let p=0;p<mask.length;p++){
      if(!mask[p]||seen[p])continue;

      let qh=0,qt=0;
      componentQueue[qt++]=p;
      seen[p]=1;
      let size=0;

      while(qh<qt){
        const k=componentQueue[qh++];
        const xx=k%maskW;
        const yy=(k/maskW)|0;
        size++;

        for(let dy=-1;dy<=1;dy++){
          for(let dx=-1;dx<=1;dx++){
            if(dx===0&&dy===0)continue;
            const nx=xx+dx,ny=yy+dy;
            if(nx<0||nx>=maskW||ny<0||ny>=maskH)continue;
            const ni=ny*maskW+nx;
            if(mask[ni]&&!seen[ni]){
              seen[ni]=1;
              componentQueue[qt++]=ni;
            }
          }
        }
      }

      if(size>=2){
        components++;
        if(size>Math.max(18,mask.length*0.018))largeBlobs++;
      }
    }

    if(components<3||components>100)continue;
    if(largeBlobs>3)continue;

    candidates.push({
      x:minX,y:minY,w:bw,h:bh,area,inkRatio,components
    });
  }

  candidates.sort((a,b)=>a.y-b.y||a.x-b.x);
  const merged=[];

  for(const b of candidates){
    let match=null;

    for(const m of merged){
      const ix=Math.max(0,Math.min(m.x+m.w,b.x+b.w)-Math.max(m.x,b.x));
      const iy=Math.max(0,Math.min(m.y+m.h,b.y+b.h)-Math.max(m.y,b.y));
      const overlap=ix*iy/Math.max(1,Math.min(m.w*m.h,b.w*b.h));
      const gapX=Math.max(0,Math.max(m.x,b.x)-Math.min(m.x+m.w,b.x+b.w));
      const gapY=Math.max(0,Math.max(m.y,b.y)-Math.min(m.y+m.h,b.y+b.h));
      const close=gapX<=Math.max(3,w*0.025)&&gapY<=Math.max(3,h*0.025);

      if(overlap>0.25||close){
        match=m;
        break;
      }
    }

    if(!match){
      merged.push({...b});
    }else{
      const x1=Math.min(match.x,b.x);
      const y1=Math.min(match.y,b.y);
      const x2=Math.max(match.x+match.w,b.x+b.w);
      const y2=Math.max(match.y+match.h,b.y+b.h);
      match.x=x1;
      match.y=y1;
      match.w=x2-x1;
      match.h=y2-y1;
      match.area=Math.max(match.area,b.area);
      match.components=Math.max(match.components,b.components);
    }
  }

  return {count:merged.length,boxes:merged,width:w,height:h};
}

/*
 * 第二步：OCR复核候选框是否有可识别的文字。
 * 不把仅有边线、空白或纯图像的候选框直接计入数量。
 */
async function getOCRWorker(){
  if(!ocrWorkerPromise){
    ocrWorkerPromise=(async()=>{
      const Tesseract=await import(
        "https://cdn.jsdelivr.net/npm/tesseract.js@6.0.1/dist/tesseract.esm.min.js"
      );
      return await Tesseract.createWorker("jpn+chi_sim");
    })();
  }
  return await ocrWorkerPromise;
}

async function verifySpeechBalloonsWithOCR(src,detection){
  if(!detection.boxes.length){
    return {count:0,boxes:[],checked:0};
  }

  const worker=await getOCRWorker();
  const sx=src.width/detection.width;
  const sy=src.height/detection.height;
  const accepted=[];
  let checked=0;

  for(const b of detection.boxes){
    const x=Math.max(0,Math.floor(b.x*sx));
    const y=Math.max(0,Math.floor(b.y*sy));
    const w=Math.min(src.width-x,Math.ceil(b.w*sx));
    const h=Math.min(src.height-y,Math.ceil(b.h*sy));
    if(w<4||h<4)continue;

    const patch=makeCanvas(w,h);
    const ctx=patch.getContext("2d");
    ctx.fillStyle="#fff";
    ctx.fillRect(0,0,w,h);
    ctx.drawImage(src,x,y,w,h,0,0,w,h);

    try{
      const result=await worker.recognize(patch);
      checked++;

      const text=(result.data.text||"").replace(/\s/g,"");
      const chars=text.match(
        /[\p{L}\p{N}\p{Script=Han}\p{Script=Hiragana}\p{Script=Katakana}]/gu
      )||[];

      /*
       * 至少识别出一个文字字符且置信度达到阈值。
       * 这只是 OCR 文字验证，并不保证一定是对白气泡。
       */
      if(chars.length>=1&&result.data.confidence>=35){
        accepted.push(b);
      }
    }catch(error){
      console.warn("对白框 OCR 失败：",error);
    }
  }

  return {count:accepted.length,boxes:accepted,checked};
}

/* 原有分框线索检测 */
function detectPanelSeparators(src){
  const scale=Math.min(1,240/src.width,360/src.height);
  const w=Math.max(1,Math.round(src.width*scale));
  const h=Math.max(1,Math.round(src.height*scale));
  const c=makeCanvas(w,h);
  const ctx=c.getContext("2d",{willReadFrequently:true});
  ctx.drawImage(src,0,0,w,h);
  const rgba=ctx.getImageData(0,0,w,h).data;
  const gray=new Uint8Array(w*h);

  for(let i=0,p=0;i<rgba.length;i+=4,p++){
    gray[p]=Math.round(
      rgba[i]*0.299+rgba[i+1]*0.587+rgba[i+2]*0.114
    );
  }

  function groupLines(flags){
    const groups=[];
    let start=-1;
    for(let i=0;i<flags.length;i++){
      if(flags[i]&&start<0)start=i;
      if((!flags[i]||i===flags.length-1)&&start>=0){
        const end=flags[i]&&i===flags.length-1?i:i-1;
        groups.push({start,end,mid:(start+end)/2});
        start=-1;
      }
    }
    return groups;
  }

  function axisLines(horizontal){
    const axis=horizontal?h:w;
    const span=horizontal?w:h;
    const flags=new Array(axis).fill(false);
    const margin=Math.floor(axis*0.08);
    const step=Math.max(1,Math.floor(span/100));

    for(let a=margin;a<axis-margin;a++){
      let white=0,dark=0,total=0;
      for(let b=Math.floor(span*0.12);b<span*0.88;b+=step){
        const x=horizontal?b:a;
        const y=horizontal?a:b;
        const v=gray[y*w+x];
        total++;
        if(v>=238)white++;
        if(v<=55)dark++;
      }
      flags[a]=white/Math.max(1,total)>=0.78||
               dark/Math.max(1,total)>=0.76;
    }

    const raw=groupLines(flags);
    const minGap=Math.max(4,Math.round(axis*0.025));
    const merged=[];

    for(const g of raw){
      const prev=merged[merged.length-1];
      if(prev&&g.start-prev.end<=minGap){
        prev.end=g.end;
        prev.mid=(prev.start+prev.end)/2;
      }else{
        merged.push({...g});
      }
    }
    return merged.filter(g=>g.mid>axis*0.10&&g.mid<axis*0.90);
  }

  const horizontal=axisLines(true);
  const vertical=axisLines(false);
  const evidence=horizontal.length+vertical.length;

  return {
    hasPanels:evidence>=2,
    horizontal:horizontal.length,
    vertical:vertical.length,
    evidence,
    width:w,
    height:h
  };
}

/* 双页中缝检测 */
function detectGutter(src){
  const w=src.width,h=src.height;
  if(w<200||h<200||w/h<1.25)return null;

  const scale=Math.min(1,700/w,900/h);
  const sw=Math.max(1,Math.round(w*scale));
  const sh=Math.max(1,Math.round(h*scale));
  const c=makeCanvas(sw,sh);
  const ctx=c.getContext("2d",{willReadFrequently:true});
  ctx.drawImage(src,0,0,sw,sh);
  const rgba=ctx.getImageData(0,0,sw,sh).data;
  const gray=new Uint8Array(sw*sh);

  for(let i=0,p=0;i<rgba.length;i+=4,p++){
    gray[p]=Math.round(
      rgba[i]*0.299+rgba[i+1]*0.587+rgba[i+2]*0.114
    );
  }

  const x0=Math.floor(sw*0.35),x1=Math.ceil(sw*0.65);
  const yStep=Math.max(1,Math.floor(sh/500));
  let best=null;

  for(let x=x0;x<x1;x++){
    let bright=0,veryBright=0,penalty=0,total=0;
    const offset=Math.max(2,Math.round(sw*0.012));
    const lx=Math.max(0,x-offset),rx=Math.min(sw-1,x+offset);

    for(let y=0;y<sh;y+=yStep){
      const v=gray[y*sw+x];
      const near=(gray[y*sw+lx]+gray[y*sw+rx])/2;
      total++;
      if(v>=190)bright++;
      if(v>=220)veryBright++;
      if(v<near-18)penalty++;
    }

    const br=bright/Math.max(1,total);
    const vr=veryBright/Math.max(1,total);
    const score=br*0.55+vr*0.25-
      (penalty/Math.max(1,total))*0.30;
    if(!best||score>best.score)best={x,score,br};
  }

  if(!best||best.br<0.52||best.score<0.43)return null;

  let good=0,total=0;
  const radius=Math.max(2,Math.round(sw*0.004));

  for(let y=0;y<sh;y+=yStep){
    let n=0,t=0;
    for(let x=Math.max(x0,best.x-radius);x<=Math.min(x1-1,best.x+radius);x++){
      if(gray[y*sw+x]>=185)n++;
      t++;
    }
    if(n/Math.max(1,t)>=0.65)good++;
    total++;
  }

  if(good/Math.max(1,total)<0.48)return null;

  function content(a,b){
    a=Math.max(0,Math.min(sw-1,a));
    b=Math.max(a+1,Math.min(sw,b));
    let dark=0,n=0;
    const sx=Math.max(1,Math.floor((b-a)/25));
    const sy=Math.max(1,Math.floor(sh/300));

    for(let y=0;y<sh;y+=sy){
      for(let x=a;x<b;x+=sx){
        n++;
        if(gray[y*sw+x]<195)dark++;
      }
    }
    return dark/Math.max(1,n)>0.025;
  }

  const off=Math.max(4,Math.round(sw*0.035));
  const side=Math.max(8,Math.round(sw*0.09));
  if(!content(best.x-off-side,best.x-off))return null;
  if(!content(best.x+off,best.x+off+side))return null;

  return Math.round(best.x/scale);
}

function safeName(s){
  return s.replace(/\.[^.]+$/,"")
    .replace(/[\\/:*?"<>|]/g,"_")
    .slice(0,100)||"image";
}

/* 输出画布固定528×792 */
function makePortraitPage(src,sideways){
  const out=makeCanvas(PAGE_W,PAGE_H);
  const ctx=out.getContext("2d");
  ctx.fillStyle="#fff";
  ctx.fillRect(0,0,PAGE_W,PAGE_H);

  const content=sideways?rotate90(src):src;
  const margin=8;
  const scale=Math.min(
    (PAGE_W-margin*2)/content.width,
    (PAGE_H-margin*2)/content.height
  );
  const dw=content.width*scale;
  const dh=content.height*scale;

  ctx.imageSmoothingEnabled=true;
  ctx.imageSmoothingQuality="high";
  ctx.drawImage(content,(PAGE_W-dw)/2,(PAGE_H-dh)/2,dw,dh);
  return out;
}

function renderOriginals(){
  const root=$("originals");
  root.replaceChildren();

  records.forEach((r,i)=>{
    const box=document.createElement("div");
    box.className="original";

    const name=document.createElement("div");
    name.className="filename";
    name.textContent=(i+1)+". "+r.file.name;

    const img=document.createElement("img");
    img.src=r.canvas.toDataURL("image/jpeg",0.85);
    img.alt=r.file.name;

    const info=document.createElement("div");
    info.className="small";
    info.textContent=r.canvas.width+" × "+r.canvas.height;

    const result=document.createElement("div");
    result.className="small";
    result.textContent=r.reason||"等待自动分析";

    box.append(name,info,img,result);
    root.appendChild(box);
  });
}

function downloadOne(item){
  const a=document.createElement("a");
  a.href=item.canvas.toDataURL("image/png");
  a.download=item.name;
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function renderOutputs(){
  const root=$("preview");
  root.replaceChildren();

  outputs.forEach((item,i)=>{
    const box=document.createElement("div");
    box.className="item";

    const img=document.createElement("img");
    img.src=item.canvas.toDataURL("image/png");
    img.alt=item.name;

    const caption=document.createElement("div");
    caption.textContent=(i+1)+". "+item.name+
      "（"+item.canvas.width+" × "+item.canvas.height+"）";

    const btn=document.createElement("button");
    btn.className="secondary";
    btn.textContent="下载此页";
    btn.addEventListener("click",()=>downloadOne(item));

    box.append(img,caption,btn);
    root.appendChild(box);
  });

  $("download").disabled=outputs.length===0;
}

async function processImages(){
  if(busy)return;
  if(!records.length){
    status("请先选择图片。");
    return;
  }

  busy=true;
  $("run").disabled=true;
  outputs=[];
  $("preview").replaceChildren();

  try{
    const count=Number($("parts").value);
    const overlap=Math.max(0,Math.min(200,Number($("overlap").value)||0));
    let total=0;

    for(let fi=0;fi<records.length;fi++){
      const r=records[fi];
      status("正在分析 "+(fi+1)+"/"+records.length+"："+r.file.name);

      const original=r.canvas;
      const colorPage=isColorPage(original);
      const gutterOriginal=colorPage?null:detectGutter(original);
      const originalTrim=trimInfo(original);
      const base=originalTrim.canvas;
      let gutter=null;

      if(gutterOriginal!==null){
        const adjusted=gutterOriginal-originalTrim.left;
        if(adjusted>base.width*0.25&&adjusted<base.width*0.75){
          gutter=adjusted;
        }
      }

      let panels=[];

      if(colorPage){
        panels.push({canvas:base,suffix:"",spread:false});
      }else if(gutter!==null){
        panels.push({
          canvas:trim(crop(base,gutter,0,base.width-gutter,base.height)),
          suffix:"_R",
          spread:true
        });
        panels.push({
          canvas:trim(crop(base,0,0,gutter,base.height)),
          suffix:"_L",
          spread:true
        });
      }else{
        panels.push({canvas:base,suffix:"",spread:false});
      }

      let local=0;
      const decisions=[];

      for(const item of panels){
        const panel=item.canvas;
        const name=safeName(r.file.name)+item.suffix;

        if(colorPage){
          addOutput(makePortraitPage(panel,false),name+"_portrait.png");
          total++;
          local++;
          decisions.push("彩页保持整页");
          continue;
        }

        status(
          "正在识别对白框文字："+r.file.name+
          (item.suffix||"")+
          "\n首次使用需要下载 OCR 语言模型，请稍候。"
        );

        const candidates=detectSpeechBalloons(panel);
        let balloons;

        try{
          balloons=await verifySpeechBalloonsWithOCR(panel,candidates);
        }catch(ocrError){
          console.error(ocrError);
          balloons={count:0,boxes:[],checked:0};
          decisions.push("OCR初始化失败，保守保持整页");
        }

        const detection=detectPanelSeparators(panel);
        const enoughBalloons=balloons.count>3;
        const shouldSplit=enoughBalloons&&detection.hasPanels;

        if(!shouldSplit){
          addOutput(
            makePortraitPage(panel,false),
            name+"_portrait.png"
          );
          total++;
          local++;

          decisions.push(
            (item.suffix?"双页单页":"页面")+
            "：OCR确认有字的候选框 "+balloons.count+" 个，"+
            (balloons.count<=3
              ?"不超过3个，保持整页"
              :detection.hasPanels
                ?"超过3个，未检测到足够分页线索，保持整页"
                :"超过3个，但分页线索不足，保持整页")
          );
          continue;
        }

        /*
         * 超过3个 OCR 确认有字的候选框，且分页线索充分，
         * 才执行原有分页逻辑。
         */
        const work=rotate90(panel);
        const n=count;
        const segmentW=work.width/n;

        for(let i=0;i<n;i++){
          const left=Math.round(i*segmentW);
          const right=Math.round((i+1)*segmentW);
          const extra=Math.round(overlap/2);
          const x=Math.max(0,left-(i>0?extra:0));
          const end=Math.min(work.width,right+(i<n-1?extra:0));
          const piece=crop(work,x,0,end-x,work.height);

          addOutput(
            makePortraitPage(piece,false),
            name+"_part_"+String(i+1).padStart(2,"0")+".png"
          );
          total++;
          local++;
        }

        decisions.push(
          "OCR确认有字的候选框 "+balloons.count+
          " 个，分页线索 "+detection.evidence+
          " 条，执行原有分页"
        );
      }

      r.reason=
        (colorPage
          ?"检测到彩页，保持整页；"
          :gutter!==null
            ?"识别到疑似双页中缝，按右页→左页处理；"
            :"未识别到可靠双页中缝；")+
        decisions.join("；")+
        "；输出 "+local+" 页。";

      renderOriginals();
      renderOutputs();

      status(
        "已处理 "+(fi+1)+"/"+records.length+"："+r.file.name+
        "\n原图尺寸："+original.width+" × "+original.height+
        "\n页面类型："+(colorPage?"彩色页，保持整页":"黑白页")+
        "\n双页中缝："+(gutter!==null?"识别成功，右页→左页":"未拆分中缝")+
        "\n判断结果："+r.reason+
        "\n累计输出："+total+" 页"
      );

      await new Promise(resolve=>setTimeout(resolve,0));
    }

    status(
      "全部完成！"+
      "\n输入图片："+records.length+" 张"+
      "\n输出页面："+outputs.length+" 页"+
      "\n每张输出画布：528 × 792"+
      "\n彩页保持整页；只有 OCR 确认有字的候选框才计数。"+
      "\n不超过3个时保持整页，超过3个才尝试智能分页。"+
      "\n注意：OCR可能漏掉竖排小字；候选框检测也可能漏检或误检。"
    );

  }catch(e){
    console.error(e);
    status("处理失败："+(e.message||String(e)));
  }finally{
    busy=false;
    $("run").disabled=false;
  }
}

$("files").addEventListener("change",async()=>{
  if(busy)return;

  const files=Array.from($("files").files||[]);
  records=[];
  outputs=[];
  $("originals").replaceChildren();
  $("preview").replaceChildren();
  $("download").disabled=true;

  if(!files.length){
    status("请选择图片。");
    return;
  }

  status("正在读取图片……");

  try{
    for(let i=0;i<files.length;i++){
      const img=await readImage(files[i]);
      records.push({
        file:files[i],
        canvas:imageToCanvas(img),
        reason:"等待自动分析"
      });
    }

    renderOriginals();
    status("已读取 "+records.length+" 张图片。点击“开始自动判断与分割”。");
  }catch(e){
    status("读取失败："+(e.message||String(e)));
  }
});

$("run").addEventListener("click",processImages);

$("clear").addEventListener("click",()=>{
  if(busy)return;
  $("files").value="";
  records=[];
  outputs=[];
  $("originals").replaceChildren();
  $("preview").replaceChildren();
  $("download").disabled=true;
  status("已清空，请重新选择图片。");
});

$("download").addEventListener("click",async()=>{
  if(!outputs.length||busy)return;
  $("download").disabled=true;
  status("正在逐页发起下载，共 "+outputs.length+" 张 PNG。");

  for(let i=0;i<outputs.length;i++){
    downloadOne(outputs[i]);
    await new Promise(resolve=>setTimeout(resolve,300));
  }

  status(
    "已发起全部 "+outputs.length+" 张 PNG 的下载。\n"+
    "如果浏览器阻止多文件下载，请允许此网站下载多个文件。"
  );
  $("download").disabled=false;
});

})();
</script>
