
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>X3 图片裁边与日漫分割工具</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:16px;background:#f3f4f6;color:#222;font-family:system-ui,-apple-system,sans-serif}
main{max-width:900px;margin:auto}
h1{font-size:23px;margin:0 0 8px}
p{font-size:14px;line-height:1.7;color:#555}
.card{background:white;border-radius:12px;padding:16px;margin:14px 0;box-shadow:0 2px 8px #00000008}
label{display:block;margin:14px 0;font-size:14px}
select,input[type=number]{padding:8px;border:1px solid #ccc;border-radius:7px;font-size:15px}
input[type=file]{max-width:100%}
button{border:0;border-radius:8px;background:#1769aa;color:white;padding:11px 15px;font-size:15px;margin:4px 5px 4px 0;cursor:pointer}
button.secondary{background:#555}
button:disabled{opacity:.5}
#status{font-size:14px;line-height:1.7;white-space:pre-wrap}
#preview{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:12px}
.item{min-width:0;padding:8px;background:#eee;border-radius:8px}
.item img{display:block;width:100%;height:auto;background:white}
.item div{font-size:12px;line-height:1.5;overflow-wrap:anywhere;margin:6px 0}
.original{margin:12px 0}
.original img{display:block;max-width:100%;height:auto}
.small{font-size:12px;color:#777}
hr{border:0;border-top:1px solid #ddd;margin:15px 0}
</style>
</head>
<body>
<main>
<h1>X3 图片裁边与日漫分割工具</h1>
<p>
处理顺序：原图裁白边 → 判断是否存在左右页中缝 →
必要时按右页、左页顺序拆分 → 纵向切割 2 份或 3 份 →
每份再次独立裁白边 → 输出 792 × 528 PNG。
跨页图如果没有检测到明显中缝，就保留整张图。
</p>

<section class="card">
<h3>1. 选择图片</h3>
<input id="files" type="file" accept="image/*" multiple>
<p class="small">支持一次选择多张图片，按选择顺序处理。</p>
</section>

<section class="card">
<h3>2. 切割设置</h3>

<label>
纵向切成几份
<br>
<select id="parts">
<option value="2">切成 2 份</option>
<option value="3" selected>切成 3 份</option>
</select>
</label>

<label>
相邻页面重叠量
<br>
<input id="overlap" type="number" min="0" max="200" step="4" value="24"> 像素
<p class="small">
保留原有设置。当前纵向取景通过顶部、中间偏下、底部的位置形成重叠；
此数值暂不直接参与计算。
</p>
</label>

<label>
白边裁切强度
<br>
<select id="trim">
<option value="normal">普通：只裁明显白边</option>
<option value="strong" selected>积极：尽量裁掉边框白边</option>
<option value="off">不裁白边</option>
</select>
<p class="small">
同一强度用于第一次和第二次裁边。边框水印或大块白色画面可能影响自动裁切。
</p>
</label>

<label>
页面适配方式
<br>
<select id="fit">
<option value="fit" selected>完整显示，不裁切画面</option>
</select>
</label>

<button id="run">开始切割</button>
<button id="clear" class="secondary">清空</button>
</section>

<section class="card">
<h3>3. 处理状态</h3>
<div id="status">请选择图片，然后开始切割。</div>
</section>

<section class="card">
<h3>4. 原图预览</h3>
<div id="originals"></div>
</section>

<section class="card">
<h3>5. 输出预览</h3>
<p class="small">
输出图片为 792 × 528。每份取景独立裁白边，之后完整缩放到 X3 页面。
</p>
<div id="preview"></div>
<hr>
<button id="download" disabled>下载全部 PNG</button>
</section>
</main>

<script>
(function(){
"use strict";

const PAGE_W=792;
const PAGE_H=528;
const $=id=>document.getElementById(id);

let outputs=[];
let busy=false;

function status(s){
  $("status").textContent=s;
}

function canvas(w,h){
  const c=document.createElement("canvas");
  c.width=Math.max(1,Math.round(w));
  c.height=Math.max(1,Math.round(h));
  return c;
}

function readImage(file){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file);
    const img=new Image();

    img.onload=()=>{
      URL.revokeObjectURL(url);
      resolve(img);
    };

    img.onerror=()=>{
      URL.revokeObjectURL(url);
      reject(new Error("无法读取图片："+file.name));
    };

    img.src=url;
  });
}

function fromImage(img){
  const c=canvas(
    img.naturalWidth||img.width,
    img.naturalHeight||img.height
  );

  c.getContext("2d",{willReadFrequently:true})
    .drawImage(img,0,0,c.width,c.height);

  return c;
}

function crop(src,x,y,w,h){
  x=Math.max(0,Math.floor(x));
  y=Math.max(0,Math.floor(y));

  w=Math.max(1,Math.min(src.width-x,Math.ceil(w)));
  h=Math.max(1,Math.min(src.height-y,Math.ceil(h)));

  const c=canvas(w,h);

  c.getContext("2d").drawImage(
    src,
    x,y,w,h,
    0,0,w,h
  );

  return c;
}

/*
 * 裁掉图片四周连续的近白区域。
 * 普通模式较保守，积极模式允许一行或一列中
 * 存在少量非白像素。
 */
function trimWhiteBorder(src){
  const mode=$("trim").value;

  if(mode==="off")return src;

  const w=src.width;
  const h=src.height;

  if(w<10||h<10)return src;

  const data=src.getContext("2d",{
    willReadFrequently:true
  }).getImageData(0,0,w,h).data;

  const ratioThreshold=mode==="strong"?0.86:0.94;
  const maxX=Math.floor(w*(mode==="strong"?0.18:0.10));
  const maxY=Math.floor(h*(mode==="strong"?0.18:0.10));
  const sampleStep=Math.max(
    1,
    Math.floor(Math.min(w,h)/1200)
  );

  function isBright(r,g,b,a){
    if(a<10)return true;
    return r>=242&&g>=242&&b>=242;
  }

  function rowBrightRatio(y){
    let bright=0;
    let total=0;

    for(let x=0;x<w;x+=sampleStep){
      const i=(y*w+x)*4;

      if(isBright(
        data[i],
        data[i+1],
        data[i+2],
        data[i+3]
      )){
        bright++;
      }

      total++;
    }

    return bright/Math.max(1,total);
  }

  function colBrightRatio(x){
    let bright=0;
    let total=0;

    for(let y=0;y<h;y+=sampleStep){
      const i=(y*w+x)*4;

      if(isBright(
        data[i],
        data[i+1],
        data[i+2],
        data[i+3]
      )){
        bright++;
      }

      total++;
    }

    return bright/Math.max(1,total);
  }

  let top=0;
  let bottom=h-1;
  let left=0;
  let right=w-1;

  while(
    top<maxY &&
    rowBrightRatio(top)>=ratioThreshold
  ){
    top++;
  }

  while(
    bottom>h-1-maxY &&
    rowBrightRatio(bottom)>=ratioThreshold
  ){
    bottom--;
  }

  while(
    left<maxX &&
    colBrightRatio(left)>=ratioThreshold
  ){
    left++;
  }

  while(
    right>w-1-maxX &&
    colBrightRatio(right)>=ratioThreshold
  ){
    right--;
  }

  // 防止把图片误裁得过小。
  if(
    right-left<w*0.45 ||
    bottom-top<h*0.45
  ){
    return src;
  }

  return crop(
    src,
    left,
    top,
    right-left+1,
    bottom-top+1
  );
}

/*
 * 判断中间是否存在明显的近白竖向分隔带。
 *
 * 判断条件：
 * 1. 图片宽高比足够大；
 * 2. 中线附近的竖带在大部分高度上足够亮；
 * 3. 中缝左右两侧均存在一定的非白内容。
 *
 * 不满足条件就不拆，尽量保护连续跨页画面。
 */
function detectCenterGutter(src){
  const w=src.width;
  const h=src.height;

  // 宽高比只用于初筛，不单独决定拆页。
  if(w/h<1.35)return null;

  const bandW=Math.max(
    5,
    Math.round(w*0.025)
  );

  const center=Math.floor(w/2);
  const x0=Math.max(
    0,
    center-Math.floor(bandW/2)
  );

  const scanW=Math.min(
    bandW,
    w-x0
  );

  // 缩小采样量，降低大图检测开销。
  const scanH=Math.min(h,700);
  const sample=canvas(scanW,scanH);
  const sctx=sample.getContext("2d",{
    willReadFrequently:true
  });

  sctx.drawImage(
    src,
    x0,0,scanW,h,
    0,0,scanW,scanH
  );

  const data=sctx.getImageData(
    0,0,scanW,scanH
  ).data;

  let brightRows=0;

  for(let y=0;y<scanH;y++){
    let bright=0;

    for(let x=0;x<scanW;x++){
      const i=(y*scanW+x)*4;
      const r=data[i];
      const g=data[i+1];
      const b=data[i+2];
      const a=data[i+3];

      if(
        a<10 ||
        (r>=232&&g>=232&&b>=232)
      ){
        bright++;
      }
    }

    if(bright/scanW>=0.90){
      brightRows++;
    }
  }

  const gutterRatio=brightRows/Math.max(1,scanH);

  // 中线附近大部分高度都应呈现近白色。
  if(gutterRatio<0.72)return null;

  // 检查中缝左右两侧是否都有画面内容。
  const sideW=Math.max(
    4,
    Math.round(w*0.025)
  );

  const sideOffset=Math.round(w*0.07);

  const leftX=Math.max(
    0,
    center-sideOffset-sideW
  );

  const rightX=Math.min(
    w-1,
    center+sideOffset
  );

  const leftRegion=crop(
    src,
    leftX,
    0,
    Math.min(sideW,w-leftX),
    h
  );

  const rightRegion=crop(
    src,
    rightX,
    0,
    Math.min(sideW,w-rightX),
    h
  );

  function hasInk(region){
    const rw=region.width;
    const rh=region.height;

    const d=region.getContext("2d",{
      willReadFrequently:true
    }).getImageData(0,0,rw,rh).data;

    let dark=0;
    let total=0;

    const yStep=Math.max(
      1,
      Math.floor(rh/500)
    );

    const xStep=Math.max(
      1,
      Math.floor(rw/12)
    );

    for(let y=0;y<rh;y+=yStep){
      for(let x=0;x<rw;x+=xStep){
        const i=(y*rw+x)*4;
        total++;

        if(
          d[i+3]>=10 &&
          (d[i]<210||d[i+1]<210||d[i+2]<210)
        ){
          dark++;
        }
      }
    }

    return dark/Math.max(1,total)>0.025;
  }

  if(!hasInk(leftRegion))return null;
  if(!hasInk(rightRegion))return null;

  // 返回中线位置，供拆分使用。
  return center;
}

function makePage(src){
  const out=canvas(PAGE_W,PAGE_H);
  const ctx=out.getContext("2d");

  ctx.fillStyle="#fff";
  ctx.fillRect(0,0,PAGE_W,PAGE_H);

  const margin=8;
  const availableW=PAGE_W-margin*2;
  const availableH=PAGE_H-margin*2;

  // 保持比例完整显示，不裁切、不放大。
  const scale=Math.min(
    availableW/src.width,
    availableH/src.height,
    1
  );

  const dw=src.width*scale;
  const dh=src.height*scale;
  const dx=(PAGE_W-dw)/2;
  const dy=(PAGE_H-dh)/2;

  ctx.imageSmoothingEnabled=true;
  ctx.imageSmoothingQuality="high";

  ctx.drawImage(src,dx,dy,dw,dh);

  return out;
}

function safeName(s){
  return s.replace(/\.[^.]+$/,"")
    .replace(/[\\/:*?"<>|]/g,"_")
    .slice(0,100)||"image";
}

function addOriginal(file,src){
  const box=document.createElement("div");
  box.className="original";

  const title=document.createElement("div");
  title.textContent=
    file.name+
    "（原图 "+src.width+" × "+src.height+"）";

  const img=document.createElement("img");
  img.src=src.toDataURL("image/png");
  img.alt=file.name;

  box.append(title,img);
  $("originals").appendChild(box);
}

function addOutput(c,name){
  outputs.push({
    canvas:c,
    name:name
  });
}

function downloadOne(item){
  const a=document.createElement("a");

  a.href=item.canvas.toDataURL("image/png");
  a.download=item.name;

  document.body.appendChild(a);
  a.click();
  a.remove();
}

function render(){
  const root=$("preview");
  root.replaceChildren();

  outputs.forEach((item,i)=>{
    const box=document.createElement("div");
    box.className="item";

    const img=document.createElement("img");
    img.src=item.canvas.toDataURL("image/png");
    img.alt=item.name;

    const caption=document.createElement("div");
    caption.textContent=(i+1)+". "+item.name;

    const btn=document.createElement("button");
    btn.className="secondary";
    btn.textContent="下载此页";
    btn.addEventListener("click",()=>{
      downloadOne(item);
    });

    box.append(img,caption,btn);
    root.appendChild(box);
  });

  $("download").disabled=outputs.length===0;
}

async function process(){
  if(busy)return;

  const files=Array.from($("files").files||[]);

  if(!files.length){
    status("请先选择图片。");
    return;
  }

  busy=true;
  $("run").disabled=true;
  $("preview").replaceChildren();
  $("originals").replaceChildren();
  outputs=[];

  try{
    const count=Number($("parts").value);
    let pageCount=0;

    for(let fi=0;fi<files.length;fi++){
      const file=files[fi];

      status(
        "正在处理 "+
        (fi+1)+"/"+files.length+"："+file.name
      );

      const img=await readImage(file);
      const original=fromImage(img);

      addOriginal(file,original);

      // 第一次裁边：处理整张图片。
      const trimmedOriginal=trimWhiteBorder(original);

      const w=trimmedOriginal.width;
      const h=trimmedOriginal.height;
      const baseName=safeName(file.name);

      // 只有检测到明显中缝才拆成左右页。
      const gutterX=detectCenterGutter(trimmedOriginal);

      const panels=[];

      if(gutterX!==null){
        // 日漫阅读顺序：右页先、左页后。
        const rightPage=crop(
          trimmedOriginal,
          gutterX,
          0,
          w-gutterX,
          h
        );

        const leftPage=crop(
          trimmedOriginal,
          0,
          0,
          gutterX,
          h
        );

        panels.push({
          canvas:trimWhiteBorder(rightPage),
          suffix:"_R"
        });

        panels.push({
          canvas:trimWhiteBorder(leftPage),
          suffix:"_L"
        });
      }else{
        // 中缝不明确：不拆左右，保留完整画面。
        panels.push({
          canvas:trimmedOriginal,
          suffix:""
        });
      }

      let localPageCount=0;

      for(let pi=0;pi<panels.length;pi++){
        const panel=panels[pi].canvas;
        const panelName=baseName+panels[pi].suffix;

        const pw=panel.width;
        const ph=panel.height;

        // 单张 X3 页面比例为 792 × 528。
        const targetH=Math.min(
          ph,
          Math.max(
            1,
            Math.round(pw*PAGE_H/PAGE_W)
          )
        );

        const maxY=Math.max(0,ph-targetH);

        let positions;

        if(count===2){
          // 两份：顶部、底部。
          positions=[0,maxY];
        }else{
          // 三份：顶部、中间偏下、底部。
          positions=[
            0,
            Math.round(maxY*0.58),
            maxY
          ];
        }

        // 短图可能产生重复位置，去掉重复项。
        positions=positions
          .map(y=>Math.max(0,Math.min(maxY,Math.round(y))))
          .filter((y,i,a)=>a.indexOf(y)===i);

        for(let i=0;i<positions.length;i++){
          const y0=positions[i];
          const y1=Math.min(ph,y0+targetH);

          // 纵向切出当前取景。
          const rawPart=crop(
            panel,
            0,
            y0,
            pw,
            y1-y0
          );

          // 第二次裁边：每份独立处理。
          const trimmedPart=trimWhiteBorder(rawPart);

          // 缩放到 X3 页面。
          const page=makePage(trimmedPart);

          addOutput(
            page,
            panelName+
            "_part_"+
            String(i+1).padStart(2,"0")+
            ".png"
          );

          pageCount++;
          localPageCount++;
        }
      }

      status(
        "已处理 "+(fi+1)+"/"+files.length+"："+file.name+
        "\n原图尺寸："+original.width+" × "+original.height+
        "\n第一次裁边后："+w+" × "+h+
        "\n左右页判断："+(
          gutterX!==null
            ?"检测到明显中缝，按右页 → 左页拆分"
            :"未确认明显中缝，保留整张图"
        )+
        "\n本张输出："+localPageCount+" 页"+
        "\n累计输出："+pageCount+" 页"
      );

      render();

      // 让浏览器有机会更新进度和预览。
      await new Promise(resolve=>setTimeout(resolve,0));
    }

    status(
      "全部完成！"+
      "\n输入图片："+files.length+" 张"+
      "\n输出页面："+outputs.length+" 页"+
      "\n页面尺寸：792 × 528"+
      "\n双页图按右页 → 左页排序"+
      "\n未确认中缝的图片保持完整。"
    );

  }catch(e){
    console.error(e);
    status("处理失败："+(e.message||String(e)));
  }finally{
    busy=false;
    $("run").disabled=false;
  }
}

$("run").addEventListener("click",process);

$("clear").addEventListener("click",()=>{
  if(busy)return;

  $("files").value="";
  $("preview").replaceChildren();
  $("originals").replaceChildren();

  outputs=[];

  $("download").disabled=true;

  status("已清空。请选择图片，然后开始切割。");
});

$("download").addEventListener("click",async()=>{
  if(!outputs.length)return;

  $("download").disabled=true;

  status(
    "正在逐页发起下载，共 "+
    outputs.length+" 个 PNG 文件。"
  );

  for(let i=0;i<outputs.length;i++){
    downloadOne(outputs[i]);
    await new Promise(resolve=>setTimeout(resolve,300));
  }

  status(
    "已发起全部 "+outputs.length+" 个 PNG 文件的下载。\n"+
    "如果浏览器阻止多个文件下载，请允许此网站下载多个文件。"
  );

  $("download").disabled=false;
});

})();
</script>
</body>
</html>
