
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>X3 日漫竖排文字检测与分割</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:14px;background:#f3f4f6;color:#222;font-family:system-ui,sans-serif}
main{max-width:960px;margin:auto}
h1{font-size:22px}
h3{font-size:17px;margin-top:0}
.card{background:white;padding:15px;border-radius:12px;margin:13px 0}
p{font-size:14px;line-height:1.7;color:#555}
label{display:block;margin:12px 0;font-size:14px}
button,select,input{font:inherit}
button{background:#1769aa;color:white;border:0;border-radius:8px;padding:10px 14px;margin:4px;cursor:pointer}
button:disabled{opacity:.45}
.secondary{background:#555}
#status{white-space:pre-wrap;line-height:1.7;font-size:14px}
#originals,#preview{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.item{background:#eee;border-radius:8px;padding:8px;min-width:0}
.item img{display:block;width:100%;height:auto;background:white}
.item div{font-size:12px;overflow-wrap:anywhere;margin:6px 0}
.small{font-size:12px;color:#777}
</style>
</head>
<body>
<main>
<h1>X3 日漫竖排文字检测与分割</h1>
<p>
优先检测日漫竖排文字笔画，OCR 只作辅助，不要求 OCR 必须识别出完整句子。
支持日文、简体中文、繁体中文，兼容横排对白。
彩页保持整页；检测到疑似双页时按右页、左页顺序处理。
输出 PNG 尺寸为 528 × 792。
</p>

<section class="card">
<h3>1. 选择图片</h3>
<input id="files" type="file" accept="image/*" multiple>
</section>

<section class="card">
<h3>2. 分割设置</h3>
<label>每个页面分成几份
<select id="parts">
<option value="2">2 份</option>
<option value="3" selected>3 份</option>
</select>
</label>
<label>相邻分割重叠像素
<input id="overlap" type="number" min="0" max="200" value="24">
</label>
<label>外围白边
<select id="trim">
<option value="normal">普通裁切</option>
<option value="strong" selected>积极裁切</option>
<option value="off">关闭</option>
</select>
</label>
<label><input id="debug" type="checkbox" checked> 显示检测调试图</label>
<button id="run">开始检测与分割</button>
<button id="clear" class="secondary">清空</button>
</section>

<section class="card">
<h3>3. 原图与检测信息</h3>
<div id="originals"></div>
</section>

<section class="card">
<h3>4. 处理状态</h3>
<div id="status">请选择图片。</div>
</section>

<section class="card">
<h3>5. 输出预览</h3>
<div id="preview"></div>
<button id="download" disabled>下载全部 PNG</button>
</section>
</main>

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const PW=528,PH=792;
let records=[],outputs=[],busy=false,workerPromise=null;

function status(s){$("status").textContent=s}
function canvas(w,h){
 const c=document.createElement("canvas");
 c.width=Math.max(1,Math.round(w));c.height=Math.max(1,Math.round(h));
 return c;
}
function crop(src,x,y,w,h){
 x=Math.max(0,Math.floor(x));y=Math.max(0,Math.floor(y));
 w=Math.max(1,Math.min(src.width-x,Math.ceil(w)));
 h=Math.max(1,Math.min(src.height-y,Math.ceil(h)));
 const c=canvas(w,h);
 c.getContext("2d").drawImage(src,x,y,w,h,0,0,w,h);
 return c;
}
function rotate90(src){
 const c=canvas(src.height,src.width),ctx=c.getContext("2d");
 ctx.translate(c.width/2,c.height/2);ctx.rotate(Math.PI/2);
 ctx.drawImage(src,-src.width/2,-src.height/2);
 return c;
}
function loadImage(file){
 return new Promise((resolve,reject)=>{
  const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{URL.revokeObjectURL(url);resolve(img)};
  img.onerror=()=>{URL.revokeObjectURL(url);reject(Error("无法读取："+file.name))};
  img.src=url;
 });
}
function toCanvas(img){
 const c=canvas(img.naturalWidth||img.width,img.naturalHeight||img.height);
 c.getContext("2d").drawImage(img,0,0,c.width,c.height);
 return c;
}
function grayImage(src,maxW=500,maxH=700){
 const scale=Math.min(1,maxW/src.width,maxH/src.height);
 const w=Math.max(1,Math.round(src.width*scale));
 const h=Math.max(1,Math.round(src.height*scale));
 const c=canvas(w,h),ctx=c.getContext("2d",{willReadFrequently:true});
 ctx.drawImage(src,0,0,w,h);
 const rgba=ctx.getImageData(0,0,w,h).data,g=new Uint8Array(w*h);
 for(let i=0,p=0;i<rgba.length;i+=4,p++)
  g[p]=Math.round(.299*rgba[i]+.587*rgba[i+1]+.114*rgba[i+2]);
 return {g,w,h,scale};
}
function isColorPage(src){
 const {g}=grayImage(src,90,120);
 const c=canvas(90,120),ctx=c.getContext("2d",{willReadFrequently:true});
 ctx.drawImage(src,0,0,90,120);
 const d=ctx.getImageData(0,0,90,120).data;
 let colored=0,n=0;
 for(let i=0;i<d.length;i+=16){
  if(Math.max(d[i],d[i+1],d[i+2])-Math.min(d[i],d[i+1],d[i+2])>35)colored++;
  n++;
 }
 return colored/Math.max(1,n)>.08;
}
function trimInfo(src){
 const mode=$("trim").value,w=src.width,h=src.height;
 if(mode==="off")return {canvas:src,left:0,top:0};
 const {g,scale}=grayImage(src,600,800);
 const sw=Math.round(w*scale),sh=Math.round(h*scale);
 const threshold=mode==="strong"?242:248;
 function rowWhite(y){
  let n=0,t=0;
  for(let x=0;x<sw;x+=2){if(g[y*sw+x]>=threshold)n++;t++}
  return n/Math.max(1,t);
 }
 function colWhite(x){
  let n=0,t=0;
  for(let y=0;y<sh;y+=2){if(g[y*sw+x]>=threshold)n++;t++}
  return n/Math.max(1,t);
 }
 let top=0,bottom=sh-1,left=0,right=sw-1;
 const my=Math.floor(sh*(mode==="strong"?.18:.10));
 const mx=Math.floor(sw*(mode==="strong"?.18:.10));
 while(top<my&&rowWhite(top)>.94)top++;
 while(bottom>sh-my&&rowWhite(bottom)>.94)bottom--;
 while(left<mx&&colWhite(left)>.94)left++;
 while(right>sw-mx&&colWhite(right)>.94)right--;
 if(right-left<sw*.45||bottom-top<sh*.45)return {canvas:src,left:0,top:0};
 const l=Math.round(left/scale),t=Math.round(top/scale);
 return {canvas:crop(src,l,t,Math.round((right-left+1)/scale),Math.round((bottom-top+1)/scale)),left:l,top:t};
}
function trim(src){return trimInfo(src).canvas}

/*
 * 候选气泡检测。
 * 用边缘外部白色区域的连通性寻找可能被轮廓包围的亮区。
 * 不要求轮廓完全规整；后续还会使用文字笔画特征判断。
 */
function detectBalloons(src){
 const {g,w,h,scale}=grayImage(src,360,520);
 const visited=new Uint8Array(w*h),q=new Int32Array(w*h);
 let head=0,tail=0;
 function add(i){
  if(i<0||i>=w*h||visited[i]||g[i]<205)return;
  visited[i]=1;q[tail++]=i;
 }
 for(let x=0;x<w;x++){add(x);add((h-1)*w+x)}
 for(let y=0;y<h;y++){add(y*w);add(y*w+w-1)}
 while(head<tail){
  const i=q[head++],x=i%w,y=(i/w)|0;
  if(x>0)add(i-1);if(x<w-1)add(i+1);
  if(y>0)add(i-w);if(y<h-1)add(i+w);
 }
 const boxes=[],minArea=Math.max(12,w*h*.0003),maxArea=w*h*.30;
 for(let i=0;i<w*h;i++){
  if(visited[i]||g[i]<205)continue;
  head=0;tail=0;q[tail++]=i;visited[i]=1;
  let area=0,minX=w,minY=h,maxX=0,maxY=0;
  while(head<tail){
   const p=q[head++],x=p%w,y=(p/w)|0;area++;
   if(x<minX)minX=x;if(x>maxX)maxX=x;
   if(y<minY)minY=y;if(y>maxY)maxY=y;
   const ns=[x>0?p-1:-1,x<w-1?p+1:-1,y>0?p-w:-1,y<h-1?p+w:-1];
   for(const n of ns)if(n>=0&&!visited[n]&&g[n]>=205){visited[n]=1;q[tail++]=n}
  }
  const bw=maxX-minX+1,bh=maxY-minY+1,ratio=bw/Math.max(1,bh);
  if(area<minArea||area>maxArea||bw<5||bh<5||bw>w*.94||bh>h*.75||ratio<.18||ratio>12)continue;
  if(bw*bh>w*h*.32)continue;
  boxes.push({x:minX,y:minY,w:bw,h:bh,area});
 }
 boxes.sort((a,b)=>b.w*b.h-a.w*a.h);
 const kept=[];
 for(const b of boxes){
  let duplicate=false;
  for(const a of kept){
   const iw=Math.max(0,Math.min(a.x+a.w,b.x+b.w)-Math.max(a.x,b.x));
   const ih=Math.max(0,Math.min(a.y+a.h,b.y+b.h)-Math.max(a.y,b.y));
   if(iw*ih/Math.max(1,Math.min(a.w*a.h,b.w*b.h))>.70){duplicate=true;break}
  }
  if(!duplicate)kept.push(b);
 }
 kept.sort((a,b)=>a.y-b.y||a.x-b.x);
 return {boxes:kept,w,h,scale};
}

/*
 * 竖排笔画检测：不尝试直接读字。
 * 将候选区域切成小格，统计深色像素比例、局部笔画密度、
 * 以及是否出现多个分散的字符状墨迹团。
 * 日文汉字、假名、简繁中文都以图像笔画形式参与判断。
 */
function detectVerticalInk(src,box){
 const {g,w,h,scale}=grayImage(src,700,1000);
 const sx=src.width/w,sy=src.height/h;
 let x0=Math.max(0,Math.floor(box.x*scale)),y0=Math.max(0,Math.floor(box.y*scale));
 let x1=Math.min(w,Math.ceil((box.x+box.w)*scale)),y1=Math.min(h,Math.ceil((box.y+box.h)*scale));
 if(x1-x0<5||y1-y0<5)return {likely:false,score:0,verticalColumns:0,clusters:0};
 const bw=x1-x0,bh=y1-y0;
 const padX=Math.round(bw*.07),padY=Math.round(bh*.07);
 x0=Math.min(x1-1,x0+padX);x1=Math.max(x0+1,x1-padX);
 y0=Math.min(y1-1,y0+padY);y1=Math.max(y0+1,y1-padY);
 const cw=x1-x0,ch=y1-y0;
 const cellW=Math.max(2,Math.round(cw*.22));
 const cellH=Math.max(3,Math.round(ch*.085));
 let inkTotal=0,total=0,verticalColumns=0,occupiedCells=0;
 const rowInk=new Float32Array(ch),colInk=new Float32Array(cw);
 for(let y=0;y<ch;y++){
  for(let x=0;x<cw;x++){
   const v=g[(y0+y)*w+x0+x];
   // 对扫描漫画和浅色抗锯齿边缘更宽容
   if(v<178){rowInk[y]++;colInk[x]++;inkTotal++}
   total++;
  }
 }
 const inkRatio=inkTotal/Math.max(1,total);
 // 检查每一小格是否存在足够的文字笔画
 let clusters=0,inCluster=false;
 for(let yy=0;yy<ch;yy+=cellH){
  let count=0,n=0;
  for(let y=yy;y<Math.min(ch,yy+cellH);y++)
   for(let x=0;x<cw;x++){n++;if(g[(y0+y)*w+x0+x]<178)count++}
  const ratio=count/Math.max(1,n);
  const occupied=ratio>.025&&ratio<.72;
  if(occupied){occupiedCells++;if(!inCluster)clusters++;inCluster=true}
  else inCluster=false;
 }
 // 竖排字符常形成一串上下分布的墨迹块；
 // 这里检查纵向连续区域，不把“必须识别出字”当条件。
 let run=0,maxRun=0;
 for(let y=0;y<ch;y++){
  const ratio=rowInk[y]/Math.max(1,cw);
  if(ratio>.012&&ratio<.78){run++;maxRun=Math.max(maxRun,run)}
  else run=0;
 }
 // 多个有墨迹的横向切片 + 合理墨迹密度，可作为竖排文字的弱证据
 const sliceCount=Math.max(4,Math.floor(ch/Math.max(4,cellH)));
 let filledSlices=0;
 for(let s=0;s<sliceCount;s++){
  const a=Math.floor(s*ch/sliceCount),b=Math.max(a+1,Math.floor((s+1)*ch/sliceCount));
  let n=0,dark=0;
  for(let y=a;y<b;y++)for(let x=0;x<cw;x++){n++;if(g[(y0+y)*w+x0+x]<178)dark++}
  const r=dark/Math.max(1,n);
  if(r>.008&&r<.65)filledSlices++;
 }
 // 竖向分散笔画证据
 const sliceRatio=filledSlices/sliceCount;
 const clusterEvidence=occupiedCells>=3&&clusters>=2;
 const densityEvidence=inkRatio>.003&&inkRatio<.48;
 const verticalEvidence=sliceRatio>.35&&maxRun>=Math.min(4,ch*.025);
 const score=(densityEvidence?1:0)+(clusterEvidence?1:0)+(verticalEvidence?1:0);
 return {
  likely:densityEvidence&&(clusterEvidence||verticalEvidence),
  score,inkRatio,occupiedCells,clusters,verticalColumns,
  sliceRatio,maxRun
 };
}

/* OCR 是辅助。模型下载失败或识别不到文字时，不否定图像笔画检测。 */
async function getWorker(){
 if(!workerPromise){
  workerPromise=(async()=>{
   const T=await import("https://cdn.jsdelivr.net/npm/tesseract.js@6.0.1/dist/tesseract.esm.min.js");
   // 日文、简体中文、繁体中文
   return await T.createWorker("jpn+chi_sim+chi_tra");
  })();
 }
 return workerPromise;
}
async function ocrAssist(src,box){
 try{
  const worker=await getWorker();
  const scale=Math.min(4,Math.max(2,180/Math.max(1,Math.min(box.w,box.h))));
  const x=Math.max(0,Math.floor(box.x-2)),y=Math.max(0,Math.floor(box.y-2));
  const w=Math.min(src.width-x,Math.ceil(box.w+4)),h=Math.min(src.height-y,Math.ceil(box.h+4));
  const c=canvas(w*scale,h*scale),ctx=c.getContext("2d",{willReadFrequently:true});
  ctx.fillStyle="white";ctx.fillRect(0,0,c.width,c.height);
  ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality="high";
  ctx.drawImage(src,x,y,w,h,0,0,c.width,c.height);
  // 自动对比度增强
  const im=ctx.getImageData(0,0,c.width,c.height);
  let min=255,max=0;
  for(let i=0;i<im.data.length;i+=4){
   const v=Math.round(.299*im.data[i]+.587*im.data[i+1]+.114*im.data[i+2]);
   im.data[i]=im.data[i+1]=im.data[i+2]=v;
   min=Math.min(min,v);max=Math.max(max,v);
  }
  const range=Math.max(1,max-min);
  for(let i=0;i<im.data.length;i+=4){
   const v=Math.max(0,Math.min(255,Math.round((im.data[i]-min)*255/range)));
   im.data[i]=im.data[i+1]=im.data[i+2]=v;
  }
  ctx.putImageData(im,0,0);
  // 尝试识别；是否含字仍由图像特征决定
  const result=await worker.recognize(c);
  const text=(result.data.text||"").replace(/\s/g,"");
  return {ok:/[\p{L}\p{N}\p{Script=Han}\p{Script=Hiragana}\p{Script=Katakana}]/u.test(text),text,confidence:result.data.confidence||0,error:false};
 }catch(e){
  console.warn("OCR 辅助识别失败",e);
  return {ok:false,text:"",confidence:0,error:true};
 }
}

/* 找分页线索，辅助决定是否分割 */
function detectSeparators(src){
 const {g,w,h}=grayImage(src,260,380);
 function countLines(horizontal){
  const axis=horizontal?h:w,span=horizontal?w:h;
  let count=0,inside=false,groups=0;
  for(let a=Math.floor(axis*.10);a<axis*.90;a++){
   let light=0,n=0;
   for(let b=Math.floor(span*.10);b<span*.90;b+=2){
    if(g[horizontal?a*w+b:b*w+a]>=235)light++;
    n++;
   }
   const hit=light/Math.max(1,n)>.80;
   if(hit&&!inside){groups++;inside=true}
   if(!hit)inside=false;
  }
  count=groups;return count;
 }
 const horizontal=countLines(true),vertical=countLines(false);
 return {horizontal,vertical,total:horizontal+vertical,hasPanels:horizontal+vertical>=2};
}
function detectGutter(src){
 if(src.width/src.height<1.25)return null;
 const {g,w,h,scale}=grayImage(src,700,900);
 let bestX=-1,best=-1;
 for(let x=Math.floor(w*.35);x<Math.ceil(w*.65);x++){
  let light=0,n=0;
  for(let y=Math.floor(h*.06);y<h*.94;y+=2){if(g[y*w+x]>205)light++;n++}
  const score=light/Math.max(1,n);
  if(score>best){best=score;bestX=x}
 }
 if(best<.68)return null;
 const margin=Math.max(3,Math.round(w*.04));
 function darkRatio(a,b){
  let dark=0,n=0;
  for(let y=Math.floor(h*.1);y<h*.9;y+=3)
   for(let x=Math.max(0,a);x<Math.min(w,b);x+=3){n++;if(g[y*w+x]<190)dark++}
  return dark/Math.max(1,n);
 }
 if(darkRatio(bestX-margin*3,bestX-margin)<.025||
    darkRatio(bestX+margin,bestX+margin*3)<.025)return null;
 return Math.round(bestX/scale);
}
function makePage(src,rotate=false){
 const content=rotate?rotate90(src):src;
 const c=canvas(PW,PH),ctx=c.getContext("2d");
 ctx.fillStyle="white";ctx.fillRect(0,0,PW,PH);
 const scale=Math.min((PW-12)/content.width,(PH-12)/content.height);
 const w=content.width*scale,h=content.height*scale;
 ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality="high";
 ctx.drawImage(content,(PW-w)/2,(PH-h)/2,w,h);
 return c;
}
function safeName(s){return s.replace(/\.[^.]+$/,"").replace(/[\\/:*?"<>|]/g,"_").slice(0,100)||"comic"}
function addOutput(c,name){outputs.push({canvas:c,name})}
function makeDebug(src,detection,inkResults){
 const c=canvas(src.width,src.height),ctx=c.getContext("2d");
 ctx.drawImage(src,0,0);
 const sx=src.width/detection.w,sy=src.height/detection.h;
 detection.boxes.forEach((b,i)=>{
  const r=inkResults[i];
  ctx.strokeStyle=r&&r.ink.likely?"#00c853":"#ff1744";
  ctx.lineWidth=Math.max(2,src.width/450);
  ctx.strokeRect(b.x*sx,b.y*sy,b.w*sx,b.h*sy);
 });
 return c;
}
function renderOriginals(){
 const root=$("originals");root.replaceChildren();
 records.forEach((r,i)=>{
  const box=document.createElement("div");box.className="item";
  const img=document.createElement("img");img.src=(r.debug||r.canvas).toDataURL("image/jpeg",.85);
  const text=document.createElement("div");
  text.textContent=(i+1)+". "+r.file.name+"\n"+(r.reason||"等待处理");
  box.append(img,text);root.append(box);
 });
}
function renderOutputs(){
 const root=$("preview");root.replaceChildren();
 outputs.forEach((o,i)=>{
  const box=document.createElement("div");box.className="item";
  const img=document.createElement("img");img.src=o.canvas.toDataURL("image/png");
  const t=document.createElement("div");t.textContent=(i+1)+". "+o.name;
  const b=document.createElement("button");b.className="secondary";b.textContent="下载此页";
  b.onclick=()=>download(o);
  box.append(img,t,b);root.append(box);
 });
 $("download").disabled=!outputs.length;
}
function download(o){
 const a=document.createElement("a");a.href=o.canvas.toDataURL("image/png");a.download=o.name;
 document.body.append(a);a.click();a.remove();
}

async function process(){
 if(busy||!records.length)return;
 busy=true;$("run").disabled=true;outputs=[];$("preview").replaceChildren();
 try{
  const parts=Number($("parts").value),overlap=Math.max(0,Math.min(200,Number($("overlap").value)||0));
  for(let fi=0;fi<records.length;fi++){
   const r=records[fi],src=r.canvas;
   status("分析图片 "+(fi+1)+"/"+records.length+"："+r.file.name);
   r.debug=null;
   const color=isColorPage(src);
   const ti=trimInfo(src),base=ti.canvas;
   const gutter=color?null:detectGutter(base);
   let panels=[];
   if(color)panels=[{canvas:base,suffix:""}];
   else if(gutter!==null){
    panels=[
     {canvas:trim(crop(base,gutter,0,base.width-gutter,base.height)),suffix:"_R"},
     {canvas:trim(crop(base,0,0,gutter,base.height)),suffix:"_L"}
    ];
   }else panels=[{canvas:base,suffix:""}];

   const decisions=[];let pageCount=0;
   for(const p of panels){
    const name=safeName(r.file.name)+p.suffix,panel=p.canvas;
    if(color){
     addOutput(makePage(panel,false),name+"_portrait.png");pageCount++;
     decisions.push("彩页保持整页");
     continue;
    }
    status("检测漫画文字笔画："+r.file.name+p.suffix);
    const det=detectBalloons(panel),results=[];
    let inkCount=0,ocrCount=0,ocrErrors=0;
    for(let i=0;i<det.boxes.length;i++){
     const b=det.boxes[i];
     const ink=detectVerticalInk(panel,b);
     // 只有图像特征提示可能有字时才调用 OCR；OCR 失败不否定图像检测
     let ocr={ok:false,error:false,text:"",confidence:0};
     if(ink.likely){
      ocrCount++;
      ocr=await ocrAssist(panel,b);
      if(ocr.error)ocrErrors++;
      inkCount++;
     }
     results.push({box:b,ink,ocr});
    }
    const likelyBoxes=results.filter(x=>x.ink.likely);
    const sep=detectSeparators(panel);
    if($("debug").checked&&!r.debug)r.debug=makeDebug(panel,det,results);

    // 决策依据是疑似含字的图像区域，而不是 OCR 读出了几个字。
    const shouldSplit=likelyBoxes.length>3&&sep.hasPanels;
    if(!shouldSplit){
     addOutput(makePage(panel,false),name+"_portrait.png");pageCount++;
     decisions.push(
      "气泡候选 "+det.boxes.length+
      "；竖排/笔画疑似有字 "+likelyBoxes.length+
      "；OCR 检查 "+ocrCount+
      "；OCR 识别成功 "+results.filter(x=>x.ocr.ok).length+
      "；分页线索 "+sep.total+
      "；保持整页"
     );
    }else{
     const rotated=rotate90(panel),sw=rotated.width/parts;
     for(let i=0;i<parts;i++){
      const left=Math.round(i*sw),right=Math.round((i+1)*sw),extra=Math.round(overlap/2);
      const x=Math.max(0,left-(i>0?extra:0)),end=Math.min(rotated.width,right+(i<parts-1?extra:0));
      const piece=crop(rotated,x,0,end-x,rotated.height);
      addOutput(makePage(piece,false),name+"_part_"+String(i+1).padStart(2,"0")+".png");
      pageCount++;
     }
     decisions.push(
      "气泡候选 "+det.boxes.length+
      "；竖排/笔画疑似有字 "+likelyBoxes.length+
      "；OCR 识别成功 "+results.filter(x=>x.ocr.ok).length+
      "；分页线索 "+sep.total+"；执行分割"
     );
    }
   }
   r.reason=(color?"彩页；":gutter!==null?"双页中缝：右页优先；":"")+
    decisions.join("；")+"；本图输出 "+pageCount+" 页";
   renderOriginals();renderOutputs();
   status("已处理 "+(fi+1)+"/"+records.length+"："+r.file.name+
    "\n"+r.reason+"\n累计输出："+outputs.length+" 页");
   await new Promise(resolve=>setTimeout(resolve,0));
  }
  status("处理完成。\n输入图片："+records.length+
   " 张\n输出 PNG："+outputs.length+" 张\n尺寸：528 × 792\n"+
   "绿框表示图像笔画检测认为疑似有字，红框表示未通过笔画判断。\n"+
   "注意：竖排笔画检测是启发式方法，仍可能受速度线、背景纹理和不规则气泡影响。");
 }catch(e){
  console.error(e);status("处理失败："+(e.message||String(e)));
 }finally{busy=false;$("run").disabled=false}
}
$("files").addEventListener("change",async()=>{
 if(busy)return;
 records=[];outputs=[];$("preview").replaceChildren();$("originals").replaceChildren();$("download").disabled=true;
 const files=Array.from($("files").files||[]);
 if(!files.length){status("请选择图片。");return}
 try{
  for(const f of files){
   const img=await loadImage(f);
   records.push({file:f,canvas:toCanvas(img),reason:"等待检测"});
  }
  renderOriginals();status("读取完成："+records.length+" 张图片。");
 }catch(e){status("读取失败："+e.message)}
});
$("run").addEventListener("click",process);
$("clear").addEventListener("click",()=>{
 if(busy)return;
 records=[];outputs=[];$("files").value="";
 $("originals").replaceChildren();$("preview").replaceChildren();$("download").disabled=true;
 status("已清空。");
});
$("download").addEventListener("click",async()=>{
 if(!outputs.length)return;
 $("download").disabled=true;
 for(let i=0;i<outputs.length;i++){
  download(outputs[i]);await new Promise(r=>setTimeout(r,250));
 }
 status("已发起 "+outputs.length+" 张 PNG 下载。如浏览器拦截，请允许多文件下载。");
 $("download").disabled=false;
});
})();
</script>
