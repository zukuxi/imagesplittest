<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>X3 日漫分割工具</title>
<style>
*{box-sizing:border-box}body{font:15px system-ui,sans-serif;background:#f3f4f6;color:#222;margin:0;padding:14px}main{max-width:1000px;margin:auto}.card{background:#fff;border-radius:12px;padding:14px;margin:12px 0}h1{font-size:22px}h3{font-size:17px}p{line-height:1.65;color:#555}label{display:block;margin:11px 0}button{padding:10px 14px;background:#1769aa;color:white;border:0;border-radius:8px;margin:4px}button:disabled{opacity:.45}.secondary{background:#555}input,select{font:inherit}input[type=number]{width:90px}#status{white-space:pre-wrap;line-height:1.7}#originals,#preview{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px}.item{background:#eee;padding:8px;border-radius:8px;min-width:0}.item img{width:100%;height:auto;display:block}.item div{font-size:12px;overflow-wrap:anywhere;white-space:pre-wrap;margin:6px 0}
</style></head><body><main>
<h1>X3 日漫分割工具</h1>
<p>不再识别漫画格子：单页可选择整页、分 2 份或分 3 份。另可开启“整本双页扫描”，先从中缝分左右页，再分别按单页设置处理；老书阴影中缝会尝试检测，找不到时以中心线为后备。双页按日漫顺序先输出右页再输出左页。彩页整页保留。输出尺寸 528×792。</p>
<section class="card"><h3>1. 选择图片</h3><input id="files" type="file" accept="image/*" multiple></section>
<section class="card"><h3>2. 设置</h3>
<label>单页处理方式 <select id="parts"><option value="0">不切分</option><option value="2">分成 2 份</option><option value="3" selected>分成 3 份</option></select></label>
<label><input id="doublePage" type="checkbox"> 整本双页扫描（先从中缝分成左右页，再按上面的设置处理每一页）</label>
<label>分割重叠像素 <input id="overlap" type="number" min="0" max="300" value="48"> <small>数值越大，相邻取景重复内容越多</small></label>
<label>白边裁切 <select id="trim"><option value="normal">普通</option><option value="strong" selected>积极（推荐，尽量裁掉边缘水印）</option></select></label>
<button id="run">开始处理</button><button id="clear" class="secondary">清空</button></section>
<section class="card"><h3>3. 原图与判断</h3><div id="originals"></div></section>
<section class="card"><h3>4. 状态</h3><div id="status">请选择图片。</div></section>
<section class="card"><h3>5. 输出预览</h3><div id="preview"></div><button id="downloadAll" disabled>下载全部 PNG</button></section>
</main>
<script>
(()=>{"use strict";
const $=id=>document.getElementById(id),OW=528,OH=792;
let records=[],outputs=[],busy=false;
function canvas(w,h){let c=document.createElement("canvas");c.width=Math.max(1,Math.round(w));c.height=Math.max(1,Math.round(h));return c}
function crop(s,x,y,w,h){x=Math.max(0,Math.floor(x));y=Math.max(0,Math.floor(y));w=Math.max(1,Math.min(s.width-x,Math.ceil(w)));h=Math.max(1,Math.min(s.height-y,Math.ceil(h)));let c=canvas(w,h);c.getContext("2d").drawImage(s,x,y,w,h,0,0,w,h);return c}
function rotate90(s){let c=canvas(s.height,s.width),x=c.getContext("2d");x.translate(c.width/2,c.height/2);x.rotate(Math.PI/2);x.drawImage(s,-s.width/2,-s.height/2);return c}
function makePage(s){let c=canvas(OW,OH),x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,OW,OH);x.imageSmoothingEnabled=true;x.imageSmoothingQuality="high";x.drawImage(s,0,0,OW,OH);return c}
function loadImage(f){return new Promise((res,rej)=>{let u=URL.createObjectURL(f),i=new Image();i.onload=()=>{URL.revokeObjectURL(u);res(i)};i.onerror=()=>{URL.revokeObjectURL(u);rej(Error("无法读取："+f.name))};i.src=u})}
function toCanvas(i){let c=canvas(i.naturalWidth||i.width,i.naturalHeight||i.height);c.getContext("2d").drawImage(i,0,0);return c}
function gray(s,maxW=420,maxH=640){let scale=Math.min(1,maxW/s.width,maxH/s.height),w=Math.max(1,Math.round(s.width*scale)),h=Math.max(1,Math.round(s.height*scale)),c=canvas(w,h),x=c.getContext("2d",{willReadFrequently:true});x.drawImage(s,0,0,w,h);let d=x.getImageData(0,0,w,h).data,g=new Uint8Array(w*h);for(let i=0,p=0;i<d.length;i+=4,p++)g[p]=Math.round(.299*d[i]+.587*d[i+1]+.114*d[i+2]);return{g,w,h,scale}}
function colorPage(s){let c=canvas(72,96),x=c.getContext("2d",{willReadFrequently:true});x.drawImage(s,0,0,72,96);let d=x.getImageData(0,0,72,96).data,n=0,k=0;for(let i=0;i<d.length;i+=16){n++;if(Math.max(d[i],d[i+1],d[i+2])-Math.min(d[i],d[i+1],d[i+2])>38)k++}return k/n>.10}
function trimWhite(s){let mode=$("trim").value;let{g,w,h,scale}=gray(s,700,950);let th=mode==="strong"?247:251;let lim=mode==="strong"?.28:.20;function row(y){let n=0,k=0;for(let x=0;x<w;x+=2){n++;if(g[y*w+x]>=th)k++}return k/Math.max(1,n)}function col(x){let n=0,k=0;for(let y=0;y<h;y+=2){n++;if(g[y*w+x]>=th)k++}return k/Math.max(1,n)}let t=0,b=h-1,l=0,r=w-1;while(t<h*lim&&row(t)>(mode==="strong"?.84:.92))t++;while(b>h-1-h*lim&&row(b)>(mode==="strong"?.84:.92))b--;while(l<w*lim&&col(l)>(mode==="strong"?.84:.92))l++;while(r>w-1-w*lim&&col(r)>(mode==="strong"?.84:.92))r--;if(r-l<w*.35||b-t<h*.35)return s;let out=crop(s,l/scale,t/scale,(r-l+1)/scale,(b-t+1)/scale);if(mode==="strong"){let mx=Math.round(out.width*.008),my=Math.round(out.height*.008);if(out.width-2*mx>out.width*.85&&out.height-2*my>out.height*.85)out=crop(out,mx,my,out.width-2*mx,out.height-2*my)}return out}
function detectSpreadGutter(s){if(s.width/s.height<1.25)return null;let{g,w,h,scale}=gray(s,600,780),lo=Math.floor(w*.36),hi=Math.ceil(w*.64),best=-1,bestScore=0;for(let x=lo;x<hi;x++){let white=0,n=0;for(let y=Math.floor(h*.08);y<h*.92;y+=2){n++;if(g[y*w+x]>218)white++}let q=white/n;if(q>bestScore){bestScore=q;best=x}}if(best<0||bestScore<.68)return null;let mid=Math.floor(h/2),l=best,r=best;while(l>lo&&g[mid*w+l-1]>205)l--;while(r<hi-1&&g[mid*w+r+1]>205)r++;if(r-l>w*.07)return null;function ink(a,b){let k=0,n=0;for(let y=Math.floor(h*.12);y<h*.88;y+=3)for(let x=Math.max(0,a);x<Math.min(w,b);x+=3){n++;if(g[y*w+x]<180)k++}return k/Math.max(1,n)}if(ink(best-w*.045,best-w*.012)<.012||ink(best+w*.012,best+w*.045)<.012)return null;return Math.round(best/scale)}
function detectSpineCut(s){
 // 老书可能没有白色中缝，改找中央区域持续存在的暗色阴影；找不到时回退到正中间。
 let {g,w,h,scale}=gray(s,700,900),lo=Math.floor(w*.40),hi=Math.ceil(w*.60),best=Math.floor(w/2),bestScore=Infinity;
 function meanCol(x){let sum=0,n=0;for(let y=Math.floor(h*.06);y<h*.94;y+=2){sum+=g[y*w+x];n++}return sum/Math.max(1,n)}
 for(let x=lo;x<hi;x++){let m=meanCol(x),near=(meanCol(Math.max(0,x-Math.max(2,Math.round(w*.025))))+meanCol(Math.min(w-1,x+Math.max(2,Math.round(w*.025)))))/2;let darkness=m-near;let centralPenalty=Math.abs(x-w/2)/w*.08;let score=-(darkness)+centralPenalty*100;if(score<bestScore){bestScore=score;best=x}}
 return Math.round(best/scale);
}
function makeDebug(src,cuts){return src}
function name(s){return s.replace(/\.[^.]+$/,"").replace(/[\\/:*?"<>|]/g,"_").slice(0,100)||"comic"}
function add(c,n){outputs.push({canvas:c,name:n})}
function views(s,count,overlap){let baseH=Math.max(1,Math.round(s.width*2/3)),extra=Math.min(300,Math.max(0,overlap));let vh=Math.min(s.height,baseH+extra),max=s.height-vh,tops=[];if(count<=1)return[{canvas:makePage(s)}];for(let i=0;i<count;i++)tops.push(Math.round(max*i/(count-1)));
 // 只微调内部裁切位置：在目标位置附近寻找上下边缘墨线较少的地方，尽量避开对白框轮廓和横向分格线。
 if(max>0&&count>2){let{g,w,h,scale}=gray(s,360,720);let range=Math.min(Math.round(h*.055),Math.round(48*scale));function edgeCost(y){let yy=Math.max(2,Math.min(h-3,y));let cost=0,n=0;for(let dy=-2;dy<=2;dy++)for(let x=0;x<w;x+=2){let v=g[(yy+dy)*w+x];cost+=(255-v)/255;n++}return cost/Math.max(1,n)}for(let i=1;i<count-1;i++){let target=Math.round(tops[i]*scale),best=target,score=Infinity;for(let y=Math.max(2,target-range);y<=Math.min(h-3,target+range);y++){let v=edgeCost(y)+edgeCost(y+Math.round(vh*scale))*.9+Math.abs(y-target)/Math.max(1,range)*.08;if(v<score){score=v;best=y}}tops[i]=Math.round(best/scale)}}
 return tops.map((t,i)=>({canvas:makePage(rotate90(crop(s,0,t,s.width,Math.min(vh,s.height-t)))),index:i+1}))}
function download(o){let a=document.createElement("a");a.href=o.canvas.toDataURL("image/png");a.download=o.name;document.body.append(a);a.click();a.remove()}
function render(){let root=$("originals");root.replaceChildren();records.forEach((r,i)=>{let d=document.createElement("div");d.className="item";let im=document.createElement("img");im.src=(r.debug||r.canvas).toDataURL("image/jpeg",.85);let t=document.createElement("div");t.textContent=(i+1)+". "+r.file.name+"\n"+(r.reason||"等待处理");d.append(im,t);root.append(d)});root=$("preview");root.replaceChildren();outputs.forEach((o,i)=>{let d=document.createElement("div");d.className="item";let im=document.createElement("img");im.src=o.canvas.toDataURL("image/png");let t=document.createElement("div");t.textContent=(i+1)+". "+o.name;let b=document.createElement("button");b.className="secondary";b.textContent="下载此页";b.onclick=()=>download(o);d.append(im,t,b);root.append(d)});$("downloadAll").disabled=!outputs.length}
async function process(){if(busy||!records.length)return;busy=true;$("run").disabled=true;outputs=[];try{let mode=Number($("parts").value),overlap=Number($("overlap").value)||0,forceSpread=$("doublePage").checked;for(let i=0;i<records.length;i++){let r=records[i],col=colorPage(r.canvas),base=col?r.canvas:trimWhite(r.canvas),gut=null,pages,notes=[];r.debug=null;
 if(col){pages=[{src:r.canvas,suffix:"_color",portrait:true}]}else if(forceSpread){
   // 双页模式必须先在完整扫描图上找中缝并切左右页，再分别裁白边，避免把旁边页的边缘误判成页边。
   const spread=r.canvas;
   gut=detectSpreadGutter(spread);
   if(gut===null)gut=detectSpineCut(spread);
   pages=[
     {src:trimWhite(crop(spread,gut,0,spread.width-gut,spread.height)),suffix:"_R"},
     {src:trimWhite(crop(spread,0,0,gut,spread.height)),suffix:"_L"}
   ];
 }else{gut=detectSpreadGutter(base);pages=gut!==null?[{src:trimWhite(crop(base,gut,0,base.width-gut,base.height)),suffix:"_R"},{src:trimWhite(crop(base,0,0,gut,base.height)),suffix:"_L"}]:[{src:base,suffix:""}]}
 for(let p of pages){let s=p.src,nm=name(r.file.name)+p.suffix;if(p.portrait){add(makePage(s),nm+"_portrait.png");notes.push("彩页整页保留（不裁白边、不分割）");continue}if(mode===0){add(makePage(s),nm+"_portrait.png");notes.push("整页保留");continue}let v=views(s,mode,overlap);v.forEach((q,j)=>add(q.canvas,nm+"_view_"+String(j+1).padStart(2,"0")+".png"));notes.push("固定分成 "+v.length+" 份，重叠 "+Math.min(300,Math.max(0,overlap))+"px")}
 r.reason=(col?"彩页；":forceSpread?"整本双页模式：按中缝分左右页，右页优先；":gut!==null?"检测到白色中缝，右页优先；":"")+notes.join("；");render();$("status").textContent="处理 "+(i+1)+"/"+records.length+"："+r.file.name+"\n"+r.reason+"\n累计输出 "+outputs.length+" 页";await new Promise(res=>setTimeout(res,0))}
 $("status").textContent="处理完成。\n输入图片："+records.length+" 张\n输出 PNG："+outputs.length+" 张\n尺寸：528×792\n整本双页模式可先分左右页，再按单页设置不切、分 2 份或分 3 份。"}catch(e){console.error(e);$("status").textContent="处理失败："+e.message}finally{busy=false;$("run").disabled=false}}
$("files").addEventListener("change",async()=>{if(busy)return;records=[];outputs=[];$("preview").replaceChildren();for(let f of Array.from($("files").files||[])){try{let im=await loadImage(f);records.push({file:f,canvas:toCanvas(im),reason:"等待处理"})}catch(e){$("status").textContent=e.message}}render();$("status").textContent="读取完成："+records.length+" 张图片。"});
$("run").addEventListener("click",process);$("clear").addEventListener("click",()=>{if(busy)return;records=[];outputs=[];$("files").value="";render();$("status").textContent="已清空。"});
$("downloadAll").addEventListener("click",async()=>{if(!outputs.length)return;$("downloadAll").disabled=true;for(let o of outputs){download(o);await new Promise(r=>setTimeout(r,250))}$("status").textContent="已发起 "+outputs.length+" 张 PNG 下载。如浏览器拦截，请允许多文件下载。";$("downloadAll").disabled=false});
})();
</script></body></html>
