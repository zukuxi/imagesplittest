
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>X3 日漫智能分格与排版</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f2f4f8;color:#202938;font:15px/1.5 system-ui,sans-serif}
header{background:#172033;color:#fff;padding:16px}
h1{font-size:21px;margin:0}header p{font-size:13px;color:#cbd5e1;margin:4px 0}
main{max-width:1100px;margin:auto;padding:12px;display:grid;gap:12px}
.card{background:white;border:1px solid #dce1e9;border-radius:12px;padding:14px}
h2{font-size:17px;margin:0 0 10px}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
button{border:0;border-radius:8px;padding:9px 13px;background:#245bdb;color:white;font:inherit;cursor:pointer}
button.secondary{background:#e9edf5;color:#202938}
button:disabled{opacity:.45}
input,select{font:inherit;max-width:100%}
select{padding:7px;border:1px solid #ccd3df;border-radius:7px}
.check{display:flex;align-items:center;gap:5px;font-size:13px;margin:5px 12px 5px 0}
.note{font-size:12px;color:#667085}
#status{color:#245bdb;font-size:13px;margin-top:8px}
.workspace{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#stage{background:#252a35;padding:8px;border-radius:8px;overflow:auto}
#source{display:block;width:100%;height:auto}
#results{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.result{border:1px solid #ddd;padding:8px;border-radius:8px;min-width:0}
.result canvas{width:100%;height:auto;background:#eee}
.result h3{font-size:12px;overflow-wrap:anywhere}
@media(max-width:700px){.workspace{grid-template-columns:1fr}main{padding:8px}}
</style>
</head>
<body>
<header>
<h1>X3 日漫智能分格与排版</h1>
<p>优先适配 792×528 横屏 · 本地处理 · 图片不会上传</p>
</header>
<main>
<section class="card">
<h2>1. 选择漫画图片</h2>
<div class="row">
<input id="file" type="file" accept="image/*">
<button id="process" disabled>重新分析</button>
</div>
<div class="row">
<label class="check"><input id="trimOuter" type="checkbox" checked> 自动裁外围白边</label>
<label class="check"><input id="double" type="checkbox" checked> 保守检测双页</label>
<label class="check"><input id="autoPack" type="checkbox" checked> 智能合并相邻格</label>
<label class="check"><input id="trimSeg" type="checkbox" checked> 裁分段白边</label>
</div>
<p class="note">双页只有在宽高比和中缝证据都支持时才拆分。比例不足或证据不明确时保留整页。</p>
<div id="pages" class="row"></div>
<div id="info" class="note"></div>
</section>

<section class="card">
<h2>2. 分格参数</h2>
<div class="row">
<label>白色阈值
<select id="threshold">
<option value="220">宽松</option>
<option value="235" selected>普通</option>
<option value="245">严格</option>
</select></label>
<label>分隔线覆盖率
<select id="coverage">
<option value=".65">65%</option>
<option value=".78" selected>78%</option>
<option value=".88">88%</option>
</select></label>
<label>合并策略
<select id="pack">
<option value="balanced">平衡：尽量接近3:2</option>
<option value="large">大格优先：文字更大</option>
<option value="conservative">保守：少合并</option>
</select></label>
</div>
<div class="row" style="margin-top:10px">
<button id="detect" disabled>识别格子并排版</button>
<button id="clear" class="secondary" disabled>清除识别结果</button>
<button id="download" disabled>下载全部 PNG</button>
</div>
<div id="status"></div>
</section>

<section class="workspace">
<div class="card">
<h2>当前源图</h2>
<div id="stage">请先选择图片</div>
</div>
<div class="card">
<h2>排版规则</h2>
<p><b>目标画布：792×528</b></p>
<p class="note">相邻格会尝试合并成更适合横屏的组合。过窄、过高的单格不一定独立输出；但组合时不拉伸、不裁掉原始内容。</p>
<p class="note">无边框、斜格、跨格插画等复杂版面仍可能需要人工检查。低置信度时优先保留完整内容，不强行切割。</p>
<div id="stats" class="note"></div>
</div>
</section>

<section class="card">
<h2>3. X3 页面预览</h2>
<div id="results" class="note">分析后显示页面预览。</div>
</section>
</main>
<script>
(()=>{
const $=id=>document.getElementById(id);
let original=null,pages=[],pageIndex=0,outputs=[],filename='manga';
const W=792,H=528;
const lum=(r,g,b)=>.299*r+.587*g+.114*b;

function canvasFrom(src){
const c=document.createElement('canvas');
c.width=src.width;c.height=src.height;
c.getContext('2d').drawImage(src,0,0);
return c;
}
function crop(src,x,y,w,h){
const c=document.createElement('canvas');
c.width=Math.max(1,Math.round(w));c.height=Math.max(1,Math.round(h));
c.getContext('2d').drawImage(src,x,y,w,h,0,0,c.width,c.height);
return c;
}
function pixels(c){
return c.getContext('2d',{willReadFrequently:true}).getImageData(0,0,c.width,c.height).data;
}
function trimBorder(src){
const d=pixels(src),w=src.width,h=src.height;
const L=(x,y)=>{let k=(y*w+x)*4;return lum(d[k],d[k+1],d[k+2])};
const bg=(L(0,0)+L(w-1,0)+L(0,h-1)+L(w-1,h-1))/4;
const white=bg>220,threshold=white?242:25;
const sx=Math.max(1,Math.floor(w/900)),sy=Math.max(1,Math.floor(h/900));
let x0=w,y0=h,x1=-1,y1=-1;
for(let y=0;y<h;y+=sy)for(let x=0;x<w;x+=sx){
let v=L(x,y);
if(white?v<threshold:v>threshold){
x0=Math.min(x0,x);y0=Math.min(y0,y);
x1=Math.max(x1,x);y1=Math.max(y1,y);
}}
if(x1<0||x1-x0<w*.45||y1-y0<h*.45)return src;
let pad=Math.round(Math.min(w,h)*.008);
return crop(src,Math.max(0,x0-pad),Math.max(0,y0-pad),
Math.min(w,x1+pad+1)-Math.max(0,x0-pad),
Math.min(h,y1+pad+1)-Math.max(0,y0-pad));
}

/* 双页必须同时满足宽高比和中缝证据，不再因宽图就强行切半。 */
function findSpread(src){
const w=src.width,h=src.height,ratio=w/h;
if(ratio<1.72)return null;
const d=pixels(src),mid=Math.floor(w/2);
const radius=Math.max(2,Math.floor(w*.025));
const stepY=Math.max(1,Math.floor(h/500));
let best=null;
for(let x=mid-radius;x<=mid+radius;x++){
let bright=0,dark=0,n=0,edge=0;
for(let y=Math.floor(h*.06);y<h*.94;y+=stepY){
let k=(y*w+x)*4,v=lum(d[k],d[k+1],d[k+2]);
if(v>238)bright++;
if(v<38)dark++;
if(x>1&&x<w-2){
let kl=(y*w+x-2)*4,kr=(y*w+x+2)*4;
edge+=Math.abs(lum(d[kl],d[kl+1],d[kl+2])-lum(d[kr],d[kr+1],d[kr+2]))/255;
}
n++;
}
const light=bright/n,black=dark/n;
const score=Math.max(light,black);
if(!best||score>best.score)best={x,score,light,black,edge:edge/n};
}
/* 只有贯穿页面的大面积亮缝或暗装订缝才自动拆。 */
if(best && (best.light>.78 || best.black>.72)){
const leftW=best.x,rightW=w-best.x;
if(leftW/h>0.48&&rightW/h>0.48&&leftW/h<1.45&&rightW/h<1.45)
return best;
}
return null;
}
function preprocess(){
if(!original)return;
let base=canvasFrom(original);
if($('trimOuter').checked)base=trimBorder(base);
pages=[];
let spread=$('double').checked?findSpread(base):null;
if(spread){
pages=[
{canvas:crop(base,spread.x,0,base.width-spread.x,base.height),label:'右页'},
{canvas:crop(base,0,0,spread.x,base.height),label:'左页'}
];
$('status').textContent='检测到明确中缝，已拆为右页、左页。请确认预览是否正确。';
}else{
pages=[{canvas:base,label:'整页'}];
$('status').textContent='未发现足够可靠的双页证据，保留整张图片。';
}
pageIndex=0;
$('pages').innerHTML='';
pages.forEach((p,i)=>{
if(pages.length===1)return;
let b=document.createElement('button');
b.className=i?'secondary':'';
b.textContent='查看'+p.label;
b.onclick=()=>selectPage(i);
$('pages').appendChild(b);
});
selectPage(0);
}
function selectPage(i){
pageIndex=i;
const p=pages[i];
$('stage').innerHTML='';
const c=canvasFrom(p.canvas);c.id='source';
$('stage').appendChild(c);
$('info').textContent=filename+' · '+p.label+' · '+c.width+'×'+c.height;
$('stats').textContent='当前 '+(i+1)+'/'+pages.length+'；输出固定为792×528';
outputs=[];
$('results').textContent='点击“识别格子并排版”。';
$('download').disabled=true;
$('clear').disabled=false;
}

/* 找连续白色横向间隙；避免整幅图片只因一条普通线就切割。 */
function horizontalBands(src){
const w=src.width,h=src.height,d=pixels(src);
const threshold=+$('threshold').value,coverage=+$('coverage').value;
const step=Math.max(1,Math.floor(w/600));
let rows=[];
for(let y=Math.floor(h*.025);y<h*.975;y++){
let bright=0,dark=0,n=0;
for(let x=Math.floor(w*.025);x<w*.975;x+=step){
let k=(y*w+x)*4,v=lum(d[k],d[k+1],d[k+2]);
if(v>=threshold)bright++;
if(v<65)dark++;
n++;
}
if(bright/n>=coverage&&dark/n<.035)rows.push(y);
}
let bands=[];
if(!rows.length)return bands;
let s=rows[0],last=s;
for(let i=1;i<=rows.length;i++){
let y=rows[i];
if(i===rows.length||y>last+1){
if(last-s+1>=Math.max(3,h*.003))
bands.push({start:s,end:last,cut:(s+last)/2});
s=y;
}
last=y;
}
return bands.filter(b=>b.cut>h*.05&&b.cut<h*.95);
}

/* 找可信竖向白色间隙，只有足够连续且在区域内部才作为候选。 */
function verticalCuts(src){
const w=src.width,h=src.height,d=pixels(src);
let good=[];
for(let x=Math.floor(w*.08);x<w*.92;x++){
let bright=0,dark=0,n=0;
for(let y=Math.floor(h*.06);y<h*.94;y+=Math.max(1,Math.floor(h/350))){
let k=(y*w+x)*4,v=lum(d[k],d[k+1],d[k+2]);
if(v>242)bright++;if(v<60)dark++;n++;
}
if(bright/n>.86&&dark/n<.025)good.push(x);
}
let bands=[];
if(!good.length)return bands;
let s=good[0],last=s;
for(let i=1;i<=good.length;i++){
let x=good[i];
if(i===good.length||x>last+1){
if(last-s>=2)bands.push({start:s,end:last,x:(s+last)/2});
s=x;
}
last=x;
}
return bands.filter(b=>b.x>w*.20&&b.x<w*.80);
}
function cropWhite(src){
const d=pixels(src),w=src.width,h=src.height;
let x0=w,y0=h,x1=-1,y1=-1;
for(let y=0;y<h;y+=2)for(let x=0;x<w;x+=2){
let k=(y*w+x)*4;
if(lum(d[k],d[k+1],d[k+2])<246){
x0=Math.min(x0,x);y0=Math.min(y0,y);
x1=Math.max(x1,x);y1=Math.max(y1,y);
}}
if(x1<0)return src;
const pad=Math.round(Math.min(w,h)*.008);
x0=Math.max(0,x0-pad);y0=Math.max(0,y0-pad);
x1=Math.min(w,x1+pad+1);y1=Math.min(h,y1+pad+1);
return crop(src,x0,y0,x1-x0,y1-y0);
}
function fit(src){
if($('trimSeg').checked)src=cropWhite(src);
const out=document.createElement('canvas');out.width=W;out.height=H;
const c=out.getContext('2d');
c.fillStyle='#fff';c.fillRect(0,0,W,H);
const scale=Math.min(W/src.width,H/src.height);
const dw=src.width*scale,dh=src.height*scale;
c.drawImage(src,(W-dw)/2,(H-dh)/2,dw,dh);
return out;
}

/* 候选区域评分：接近3:2、面积较大、避免极窄长区域。 */
function scoreRegion(r){
const ratio=r.width/r.height;
const ratioScore=Math.exp(-Math.abs(Math.log(ratio/(W/H)))*1.35);
const areaScore=Math.min(1,(r.width*r.height)/(canvasArea()*.18));
const skinny=Math.min(1,Math.min(r.width/r.height,r.height/r.width)*2.5);
return ratioScore*.55+areaScore*.25+skinny*.20;
}
function canvasArea(){return pages[pageIndex].canvas.width*pages[pageIndex].canvas.height}
function makeRegions(src){
const hs=horizontalBands(src);
const y=[0,...hs.map(b=>b.cut),src.height];
let regions=[];
for(let i=0;i<y.length-1;i++){
let y0=Math.round(y[i]),y1=Math.round(y[i+1]);
if(y1-y0<src.height*.07)continue;
const row=crop(src,0,y0,src.width,y1-y0);
const vs=verticalCuts(row);
if(vs.length){
/* 多个竖向候选时优先取中间最明显的一条，避免过度切碎。 */
vs.sort((a,b)=>Math.abs(a.x-row.width/2)-Math.abs(b.x-row.width/2));
const x=Math.round(vs[0].x);
if(x>row.width*.22&&x<row.width*.78){
regions.push({src:crop(row,x,0,row.width-x,row.height),xOrder:0});
regions.push({src:crop(row,0,0,x,row.height),xOrder:1});
}else regions.push({src:row});
}else regions.push({src:row});
}
if(!regions.length)regions=[{src}];
return regions;
}

/* 将连续区域组合成一页。组合后仍按比例缩放完整内容，不拉伸或裁剪。 */
function packRegions(regions){
if(!$('autoPack').checked)return regions;
const mode=$('pack').value;
let result=[],group=[],height=0;
function flush(){
if(!group.length)return;
let x=0,totalH=0,maxW=0;
group.forEach(r=>{maxW=Math.max(maxW,r.src.width);totalH+=r.src.height});
const combined=document.createElement('canvas');
combined.width=maxW;combined.height=totalH;
const c=combined.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,maxW,totalH);
group.forEach(r=>{c.drawImage(r.src,0,x);x+=r.src.height});
result.push({src:combined});
group=[];height=0;
}
for(const r of regions){
const ratio=r.src.width/r.src.height;
const isTall=ratio<.72;
if(!group.length){group=[r];height=r.src.height;continue}
const candidateH=height+r.src.height;
const candidateW=Math.max(...group.map(a=>a.src.width),r.src.width);
const ratioAfter=candidateW/candidateH;
const allow=mode==='conservative'?(!isTall&&ratioAfter>1.05&&ratioAfter<2.15):
mode==='large'?candidateH<height*2.05&&ratioAfter>.95:
candidateH<height*1.8&&ratioAfter>.95&&ratioAfter<2.2;
if(allow){group.push(r);height=candidateH}
else{flush();group=[r];height=r.src.height}
}
flush();
return result;
}
function analyze(){
const src=pages[pageIndex].canvas;
const regions=makeRegions(src);
const packed=packRegions(regions);
outputs=packed.map((r,i)=>({
canvas:fit(r.src),
name:filename+'_'+pages[pageIndex].label+'_'+String(i+1).padStart(3,'0')
}));
showOutputs();
$('status').textContent='候选区域 '+regions.length+' 个，排版输出 '+outputs.length+' 页。请检查是否有误切或合并不合理。';
$('download').disabled=!outputs.length;
$('stats').textContent='源图 '+src.width+'×'+src.height+'；候选格区 '+regions.length+'；输出 '+outputs.length+' 页。每页792×528。';
}
function showOutputs(){
const list=$('results');list.innerHTML='';
outputs.forEach((o,i)=>{
const box=document.createElement('div');box.className='result';
const title=document.createElement('h3');title.textContent=(i+1)+'. '+o.name;box.appendChild(title);
const c=document.createElement('canvas');c.width=W;c.height=H;
c.getContext('2d').drawImage(o.canvas,0,0);box.appendChild(c);
const b=document.createElement('button');b.textContent='下载此页';
b.onclick=()=>downloadOne(o);box.appendChild(b);
list.appendChild(box);
});
}
function downloadOne(o){
const a=document.createElement('a');
a.href=o.canvas.toDataURL('image/png');a.download=o.name+'.png';a.click();
}
$('file').addEventListener('change',()=>{
const f=$('file').files[0];if(!f)return;
const url=URL.createObjectURL(f),img=new Image();
img.onload=()=>{
original=document.createElement('canvas');
original.width=img.naturalWidth;original.height=img.naturalHeight;
original.getContext('2d').drawImage(img,0,0);
filename=f.name.replace(/\.[^.]+$/,'').replace(/[\\/:*?"<>|]/g,'_');
$('process').disabled=false;$('detect').disabled=false;
preprocess();URL.revokeObjectURL(url);
};
img.onerror=()=>{alert('图片读取失败，请换 JPG 或 PNG');URL.revokeObjectURL(url)};
img.src=url;
});
$('process').onclick=preprocess;
$('double').addEventListener('change',()=>{if(original)preprocess()});
$('trimOuter').addEventListener('change',()=>{if(original)preprocess()});
$('detect').onclick=analyze;
$('clear').onclick=()=>{
outputs=[];$('results').textContent='结果已清除。';$('download').disabled=true;
};
$('download').onclick=()=>{
outputs.forEach((o,i)=>setTimeout(()=>downloadOne(o),i*350));
};
})();
</script>
</body>
</html>
