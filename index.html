<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>图片裁边与漫画分割工具</title>
<style>
:root {
  color-scheme: light;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  color: #202124;
  background: #f4f5f7;
}
* { box-sizing: border-box; }
body { margin: 0; padding: 16px; }
main { max-width: 1100px; margin: auto; }
h1 { font-size: 24px; margin: 4px 0 8px; }
h2 { font-size: 18px; margin: 0 0 12px; }
p { line-height: 1.6; }
.card {
  background: #fff;
  border: 1px solid #e0e3e8;
  border-radius: 12px;
  padding: 16px;
  margin: 14px 0;
}
.muted { color: #667085; font-size: 13px; }
.row {
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
}
.field {
  display: flex;
  flex-direction: column;
  gap: 5px;
  min-width: 125px;
  flex: 1;
}
label { font-size: 14px; }
input, select, button {
  font: inherit;
  min-height: 40px;
  border-radius: 8px;
}
input[type="number"], select {
  padding: 7px 9px;
  border: 1px solid #cbd0d8;
  background: white;
  width: 100%;
}
input[type="file"] { max-width: 100%; }
input[type="checkbox"] { min-height: auto; }
button {
  border: 1px solid #d0d5dd;
  padding: 8px 15px;
  cursor: pointer;
  background: white;
}
button.primary {
  background: #2458d3;
  border-color: #2458d3;
  color: white;
}
button:disabled { opacity: .45; cursor: not-allowed; }
button.danger { color: #b42318; }
.progress {
  height: 8px;
  background: #e9edf3;
  border-radius: 10px;
  overflow: hidden;
  margin: 10px 0;
}
.progress > div {
  height: 100%;
  width: 0;
  background: #2458d3;
  transition: width .15s;
}
#status {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  line-height: 1.65;
  font-size: 13px;
  background: #f7f8fa;
  padding: 12px;
  border-radius: 8px;
  max-height: 380px;
  overflow: auto;
}
#preview {
  display: grid;
  grid-template-columns: repeat(auto-fill,minmax(150px,1fr));
  gap: 12px;
}
.preview-item {
  border: 1px solid #e0e3e8;
  padding: 8px;
  border-radius: 8px;
  background: white;
  min-width: 0;
}
.preview-item img {
  display: block;
  max-width: 100%;
  max-height: 340px;
  object-fit: contain;
  margin: auto;
}
.preview-item .name {
  font-size: 12px;
  overflow-wrap: anywhere;
  margin-top: 7px;
}
canvas { max-width: 100%; }
details summary { cursor: pointer; }
hr { border: 0; border-top: 1px solid #e5e7eb; }
@media (max-width: 600px) {
  body { padding: 9px; }
  .card { padding: 12px; }
  h1 { font-size: 21px; }
  .field { min-width: 42%; }
}
</style>
</head>
<body>
<main>
  <h1>图片裁边与漫画分割工具</h1>
  <p class="muted">
    批量处理漫画图片，检测气泡与文字线索，辅助判断跨页图并分割。
    原图不会被修改。
  </p>

  <section class="card">
    <h2>1. 选择图片</h2>
    <input id="files" type="file" accept="image/*" multiple>
    <p class="muted">可以一次选择多张图片。建议先用几张图片测试检测效果。</p>
    <div class="row">
      <label><input id="debug" type="checkbox" checked> 输出检测调试图</label>
      <label><input id="useOCR" type="checkbox" checked> 使用 OCR 辅助判断</label>
    </div>
  </section>

  <section class="card">
    <h2>2. 分割设置</h2>
    <div class="row">
      <div class="field">
        <label for="parts">分割模式</label>
        <select id="parts">
          <option value="auto">自动判断</option>
          <option value="2">优先分为左右 2 页</option>
          <option value="3">优先纵向分为 3 页</option>
        </select>
      </div>
      <div class="field">
        <label for="overlap">分割重叠（像素）</label>
        <input id="overlap" type="number" min="0" max="150" value="24">
      </div>
      <div class="field">
        <label for="trim">白边处理</label>
        <select id="trim">
          <option value="off">不裁白边</option>
          <option value="auto" selected>自动裁白边</option>
        </select>
      </div>
    </div>
    <p class="muted">
      自动模式会综合中缝、气泡、文字与图像比例判断。
      OCR 只是辅助线索，不会仅因为 OCR 识别失败就直接认定没有文字。
    </p>
    <div class="row">
      <button id="run" class="primary">开始处理</button>
      <button id="clear" class="danger">清空结果</button>
    </div>
    <div class="progress"><div id="progressBar"></div></div>
    <div id="status">请选择图片，然后点击“开始处理”。</div>
  </section>

  <section class="card">
    <h2>3. 处理结果</h2>
    <div class="row">
      <button id="download" disabled>下载全部结果 ZIP</button>
    </div>
    <p class="muted">结果预览如下。调试图仅用于观察检测框，不会作为漫画页输出。</p>
    <div id="preview"></div>
  </section>
</main>

<script>
(() => {
"use strict";

const $ = id => document.getElementById(id);
const fileInput = $("files");
const runButton = $("run");
const clearButton = $("clear");
const downloadButton = $("download");
const statusBox = $("status");
const progressBar = $("progressBar");
const preview = $("preview");

let outputs = [];
let workerPromise = null;
let worker = null;
let processing = false;

function log(message) {
  statusBox.textContent += "\n" + message;
  statusBox.scrollTop = statusBox.scrollHeight;
}

function setStatus(message) {
  statusBox.textContent = message;
}

function progress(value) {
  progressBar.style.width = Math.max(0, Math.min(100, value)) + "%";
}

function clamp(value, min, max) {
  return Math.max(min, Math.min(max, value));
}

function sleepFrame() {
  return new Promise(resolve => requestAnimationFrame(resolve));
}

function loadImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      resolve(img);
    };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error("无法读取图片"));
    };
    img.src = url;
  });
}

function imageToCanvas(img) {
  const canvas = document.createElement("canvas");
  canvas.width = img.naturalWidth || img.width;
  canvas.height = img.naturalHeight || img.height;
  canvas.getContext("2d", { willReadFrequently: true })
    .drawImage(img, 0, 0);
  return canvas;
}

function canvasToBlob(canvas, type = "image/png", quality) {
  return new Promise((resolve, reject) => {
    canvas.toBlob(blob => {
      if (blob) resolve(blob);
      else reject(new Error("图片编码失败"));
    }, type, quality);
  });
}

function canvasFromBlob(blob) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      resolve(imageToCanvas(img));
    };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error("无法读取图片数据"));
    };
    img.src = url;
  });
}

function safeName(name) {
  return name.replace(/\.[^.]+$/, "")
    .replace(/[\\/:*?"<>|]/g, "_")
    .slice(0, 150) || "image";
}

/*
 * 将图片缩放到检测用尺寸。
 * 返回 scaleX / scaleY，明确记录检测图与原图之间的坐标关系。
 */
function grayImage(src, maxW = 360, maxH = 520) {
  const scale = Math.min(1, maxW / src.width, maxH / src.height);
  const w = Math.max(1, Math.round(src.width * scale));
  const h = Math.max(1, Math.round(src.height * scale));
  const canvas = document.createElement("canvas");
  canvas.width = w;
  canvas.height = h;

  const ctx = canvas.getContext("2d", { willReadFrequently: true });
  ctx.drawImage(src, 0, 0, w, h);
  const data = ctx.getImageData(0, 0, w, h).data;
  const g = new Uint8Array(w * h);

  for (let i = 0, j = 0; i < data.length; i += 4, j++) {
    g[j] = Math.round(
      data[i] * 0.299 +
      data[i + 1] * 0.587 +
      data[i + 2] * 0.114
    );
  }

  return {
    g, w, h, canvas,
    scaleX: w / src.width,
    scaleY: h / src.height
  };
}

/*
 * 坐标转换的关键修复：
 * 检测框使用 detection 尺寸，OCR / 原图使用 src 尺寸。
 * 任何情况下都不能把缩小图坐标直接当作原图坐标。
 */
function mapBoxToSource(box, detection, src) {
  const sx = src.width / detection.w;
  const sy = src.height / detection.h;

  const x0 = clamp(Math.floor(box.x * sx), 0, src.width - 1);
  const y0 = clamp(Math.floor(box.y * sy), 0, src.height - 1);
  const x1 = clamp(Math.ceil((box.x + box.w) * sx), x0 + 1, src.width);
  const y1 = clamp(Math.ceil((box.y + box.h) * sy), y0 + 1, src.height);

  return {
    x: x0,
    y: y0,
    w: x1 - x0,
    h: y1 - y0
  };
}

function isColorPage(src) {
  const { data } = src.getContext("2d", {
    willReadFrequently: true
  }).getImageData(0, 0, src.width, src.height);

  let colorCount = 0;
  const total = Math.floor(data.length / 4);
  const step = Math.max(1, Math.floor(total / 3000));

  for (let p = 0; p < total; p += step) {
    const i = p * 4;
    const max = Math.max(data[i], data[i + 1], data[i + 2]);
    const min = Math.min(data[i], data[i + 1], data[i + 2]);
    if (max - min > 35) colorCount++;
  }

  return colorCount / Math.max(1, Math.ceil(total / step)) > 0.035;
}

/*
 * 检测近白区域的连通块，作为气泡候选。
 * 候选框只用于寻找线索，不能单独决定一定要分割。
 */
function detectBalloons(src) {
  const detection = grayImage(src, 360, 520);
  const { g, w, h } = detection;
  const total = w * h;
  const seen = new Uint8Array(total);
  const boxes = [];

  const minArea = Math.max(14, Math.floor(total * 0.00007));
  const maxArea = Math.floor(total * 0.15);
  const queue = new Int32Array(total);

  // 采用固定阈值，并检查候选框的宽高，避免大量小噪点。
  const threshold = 226;

  for (let start = 0; start < total; start++) {
    if (seen[start] || g[start] < threshold) continue;

    let head = 0, tail = 0;
    queue[tail++] = start;
    seen[start] = 1;

    let minX = w, minY = h, maxX = 0, maxY = 0;
    let area = 0;

    while (head < tail) {
      const p = queue[head++];
      const x = p % w;
      const y = Math.floor(p / w);

      area++;
      if (x < minX) minX = x;
      if (x > maxX) maxX = x;
      if (y < minY) minY = y;
      if (y > maxY) maxY = y;

      const neighbors = [
        x > 0 ? p - 1 : -1,
        x + 1 < w ? p + 1 : -1,
        y > 0 ? p - w : -1,
        y + 1 < h ? p + w : -1
      ];

      for (const q of neighbors) {
        if (q < 0 || seen[q] || g[q] < threshold) continue;
        seen[q] = 1;
        queue[tail++] = q;
      }

      // 极大连通区域不再扩张，避免大面积白底占用过多时间。
      if (tail >= total) break;
    }

    const bw = maxX - minX + 1;
    const bh = maxY - minY + 1;

    if (area < minArea || area > maxArea) continue;
    if (bw < 5 || bh < 7) continue;
    if (bw > w * 0.72 || bh > h * 0.72) continue;

    const ratio = bw / Math.max(1, bh);
    if (ratio > 7 || ratio < 0.12) continue;

    boxes.push({
      x: minX, y: minY, w: bw, h: bh,
      area
    });
  }

  // 先按面积从大到小，限制候选数量。
  boxes.sort((a, b) => b.area - a.area);
  const filtered = [];

  for (const b of boxes) {
    const centerX = b.x + b.w / 2;
    const centerY = b.y + b.h / 2;

    const duplicate = filtered.some(a => {
      const ax = a.x + a.w / 2;
      const ay = a.y + a.h / 2;
      const dx = Math.abs(centerX - ax);
      const dy = Math.abs(centerY - ay);
      return dx < Math.min(a.w, b.w) * 0.55 &&
             dy < Math.min(a.h, b.h) * 0.55;
    });

    if (!duplicate) filtered.push(b);
    if (filtered.length >= 80) break;
  }

  return {
    boxes: filtered,
    detection,
    w, h
  };
}

/*
 * 竖排文字/笔画检测。
 * 注意：候选框先从 detection 坐标转换到灰度图坐标，
 * 不再将原图坐标、检测图坐标混用。
 */
function detectVerticalInk(src, box, detection) {
  const { g, w, h } = grayImage(src, 700, 1000);

  const mx = w / detection.w;
  const my = h / detection.h;

  const x0 = clamp(Math.floor(box.x * mx), 0, w - 1);
  const y0 = clamp(Math.floor(box.y * my), 0, h - 1);
  const x1 = clamp(Math.ceil((box.x + box.w) * mx), x0 + 1, w);
  const y1 = clamp(Math.ceil((box.y + box.h) * my), y0 + 1, h);

  const bw = x1 - x0;
  const bh = y1 - y0;
  if (bw < 2 || bh < 3) {
    return { likely: false, score: 0, dark: 0, density: 0 };
  }

  let dark = 0;
  const columnHits = new Uint16Array(bw);
  const rowHits = new Uint16Array(bh);
  const area = bw * bh;

  for (let y = y0; y < y1; y++) {
    for (let x = x0; x < x1; x++) {
      if (g[y * w + x] < 155) {
        dark++;
        columnHits[x - x0]++;
        rowHits[y - y0]++;
      }
    }
  }

  const density = dark / Math.max(1, area);
  let activeColumns = 0;
  let activeRows = 0;

  for (const n of columnHits) if (n >= 2) activeColumns++;
  for (const n of rowHits) if (n >= 2) activeRows++;

  const colRatio = activeColumns / Math.max(1, bw);
  const rowRatio = activeRows / Math.max(1, bh);

  // 文字通常不是完全空白，也不应整块全黑。
  const likely =
    dark >= 7 &&
    density >= 0.012 &&
    density <= 0.68 &&
    (colRatio > 0.12 || rowRatio > 0.16);

  const score = Math.round(
    100 * Math.min(1, density * 3 + colRatio * 0.35 + rowRatio * 0.25)
  );

  return { likely, score, dark, density, colRatio, rowRatio };
}

async function getWorker() {
  if (worker) return worker;
  if (workerPromise) return workerPromise;

  workerPromise = (async () => {
    log("正在加载 Tesseract.js OCR 引擎……");

    if (!window.Tesseract) {
      await new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src =
          "https://cdn.jsdelivr.net/npm/tesseract.js@6.0.1/dist/tesseract.min.js";
        script.onload = resolve;
        script.onerror = () => reject(
          new Error("Tesseract.js 加载失败，请检查网络或 CDN 是否可访问")
        );
        document.head.appendChild(script);
      });
    }

    if (!window.Tesseract) {
      throw new Error("Tesseract.js 加载后仍不可用");
    }

    log("OCR 引擎已加载，正在下载语言模型。首次运行可能需要等待。");

    const lang = "jpn_vert+chi_sim+chi_tra";

    const w = await window.Tesseract.createWorker(
      lang,
      1,
      {
        logger: m => {
          if (m.status) {
            const pct = typeof m.progress === "number"
              ? ` ${Math.round(m.progress * 100)}%`
              : "";
            setStatus(
              statusBox.textContent.split("\n").slice(-5).join("\n") +
              "\nOCR：" + m.status + pct
            );
          }
        }
      }
    );

    try {
      await w.setParameters({
        preserve_interword_spaces: "1"
      });
    } catch (e) {
      log("提示：部分 OCR 参数不受当前版本支持，将继续使用默认设置。");
    }

    worker = w;
    log("OCR 语言模型准备完成。");
    return worker;
  })();

  try {
    return await workerPromise;
  } catch (error) {
    workerPromise = null;
    worker = null;
    throw error;
  }
}

/*
 * OCR 输入必须是原图坐标框。
 * 先裁剪候选区域，再放大和增强对比度。
 */
async function ocrAssist(src, box) {
  try {
    const marginX = Math.round(box.w * 0.08);
    const marginY = Math.round(box.h * 0.08);

    const x = clamp(box.x - marginX, 0, src.width - 1);
    const y = clamp(box.y - marginY, 0, src.height - 1);
    const right = clamp(box.x + box.w + marginX, x + 1, src.width);
    const bottom = clamp(box.y + box.h + marginY, y + 1, src.height);

    const cropW = right - x;
    const cropH = bottom - y;

    // OCR 图像放大，但避免过大画布导致移动设备内存占用过高。
    const scale = Math.min(
      4,
      1800 / Math.max(cropW, cropH),
      1200 / Math.max(1, Math.min(cropW, cropH))
    );

    const c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(cropW * scale));
    c.height = Math.max(1, Math.round(cropH * scale));

    const ctx = c.getContext("2d", { willReadFrequently: true });
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "high";
    ctx.drawImage(
      src, x, y, cropW, cropH,
      0, 0, c.width, c.height
    );

    const imageData = ctx.getImageData(0, 0, c.width, c.height);
    const d = imageData.data;

    let sum = 0;
    const count = Math.floor(d.length / 4);
    for (let i = 0; i < d.length; i += 4) {
      sum += d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114;
    }
    const mean = sum / Math.max(1, count);
    const factor = mean < 100 ? 1.35 : mean > 220 ? 1.7 : 1.45;

    for (let i = 0; i < d.length; i += 4) {
      const gray = d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114;
      const v = clamp(Math.round((gray - mean) * factor + 180), 0, 255);
      d[i] = d[i + 1] = d[i + 2] = v;
      d[i + 3] = 255;
    }
    ctx.putImageData(imageData, 0, 0);

    const ocr = await getWorker();

    let result = await ocr.recognize(c);
    let text = (result.data && result.data.text || "").trim();
    let confidence = Number(result.data && result.data.confidence || 0);

    // 首次识别没有文字或信心度很低时，改用稀疏文本模式重试。
    if (!text || confidence < 18) {
      try {
        await ocr.setParameters({
          tessedit_pageseg_mode: "11"
        });
        result = await ocr.recognize(c);
        const retryText = (result.data && result.data.text || "").trim();
        const retryConfidence = Number(
          result.data && result.data.confidence || 0
        );

        if (retryText.length > text.length ||
            retryConfidence > confidence) {
          text = retryText;
          confidence = retryConfidence;
        }
      } finally {
        try {
          await ocr.setParameters({
            tessedit_pageseg_mode: "6"
          });
        } catch (e) {}
      }
    }

    const hasText = /[\p{L}\p{N}\p{Script=Han}\p{Script=Hiragana}\p{Script=Katakana}]/u
      .test(text);

    return {
      ok: hasText,
      error: false,
      text: text.slice(0, 120),
      confidence
    };
  } catch (error) {
    return {
      ok: false,
      error: true,
      text: "",
      confidence: 0,
      message: error && error.message ? error.message : String(error)
    };
  }
}

function detectGutter(src) {
  const { g, w, h } = grayImage(src, 360, 520);
  const start = Math.floor(w * 0.25);
  const end = Math.ceil(w * 0.75);
  const scores = [];

  for (let x = start; x < end; x++) {
    let bright = 0;
    let dark = 0;
    for (let y = 0; y < h; y++) {
      const v = g[y * w + x];
      if (v > 238) bright++;
      if (v < 80) dark++;
    }
    scores.push({
      x,
      score: bright / h - (dark / h) * 0.6
    });
  }

  scores.sort((a, b) => b.score - a.score);
  const best = scores[0];

  if (!best || best.score < 0.25) {
    return { found: false, x: Math.round(w / 2), confidence: 0 };
  }

  return {
    found: true,
    x: best.x / w,
    confidence: best.score
  };
}

function detectSeparators(src) {
  const { g, w, h } = grayImage(src, 360, 520);
  const rows = [];
  const cols = [];

  // 检查水平分隔线。
  for (let y = Math.floor(h * 0.08); y < h * 0.92; y++) {
    let bright = 0;
    for (let x = 0; x < w; x++) {
      if (g[y * w + x] > 238) bright++;
    }
    const ratio = bright / w;
    if (ratio > 0.92) rows.push({ pos: y / h, score: ratio });
  }

  // 检查竖向分隔线。
  for (let x = Math.floor(w * 0.08); x < w * 0.92; x++) {
    let bright = 0;
    for (let y = 0; y < h; y++) {
      if (g[y * w + x] > 238) bright++;
    }
    const ratio = bright / h;
    if (ratio > 0.92) cols.push({ pos: x / w, score: ratio });
  }

  function mergeNearby(list, minGap) {
    const result = [];
    for (const item of list) {
      const last = result[result.length - 1];
      if (last && item.pos - last.pos < minGap) {
        if (item.score > last.score) result[result.length - 1] = item;
      } else {
        result.push(item);
      }
    }
    return result;
  }

  return {
    rows: mergeNearby(rows, 0.035),
    cols: mergeNearby(cols, 0.035)
  };
}

function trimInfo(src) {
  const { g, w, h } = grayImage(src, 500, 800);
  const threshold = 242;
  const edge = 0.985;

  let left = w, top = h, right = 0, bottom = 0;

  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      if (g[y * w + x] < threshold) {
        if (x < left) left = x;
        if (x > right) right = x;
        if (y < top) top = y;
        if (y > bottom) bottom = y;
      }
    }
  }

  if (right <= left || bottom <= top) {
    return { x: 0, y: 0, w: src.width, h: src.height };
  }

  const sx = src.width / w;
  const sy = src.height / h;
  let x = Math.floor(left * sx);
  let y = Math.floor(top * sy);
  let r = Math.ceil((right + 1) * sx);
  let b = Math.ceil((bottom + 1) * sy);

  // 避免误裁掉漫画边缘，限制裁边幅度。
  x = Math.min(x, Math.floor(src.width * 0.12));
  y = Math.min(y, Math.floor(src.height * 0.12));
  r = Math.max(r, Math.ceil(src.width * edge));
  b = Math.max(b, Math.ceil(src.height * edge));

  x = clamp(x, 0, src.width - 1);
  y = clamp(y, 0, src.height - 1);
  r = clamp(r, x + 1, src.width);
  b = clamp(b, y + 1, src.height);

  return { x, y, w: r - x, h: b - y };
}

function cropCanvas(src, rect) {
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(rect.w));
  c.height = Math.max(1, Math.round(rect.h));
  c.getContext("2d").drawImage(
    src,
    rect.x, rect.y, rect.w, rect.h,
    0, 0, c.width, c.height
  );
  return c;
}

function makeDebug(src, detection, results, gutter, separators) {
  const c = document.createElement("canvas");
  c.width = src.width;
  c.height = src.height;
  const ctx = c.getContext("2d");
  ctx.drawImage(src, 0, 0);

  const sx = src.width / detection.w;
  const sy = src.height / detection.h;

  ctx.lineWidth = Math.max(2, src.width / 500);
  ctx.font = `${Math.max(12, src.width / 40)}px sans-serif`;

  for (const item of results) {
    const b = item.box;
    const x = b.x * sx;
    const y = b.y * sy;
    const w = b.w * sx;
    const h = b.h * sy;

    ctx.strokeStyle = item.ocr && item.ocr.ok ? "#00a650" : "#e53935";
    ctx.strokeRect(x, y, w, h);

    if (item.ink && item.ink.likely) {
      ctx.fillStyle = "#ff9800";
      ctx.fillText("INK", x, Math.max(14, y - 3));
    }
  }

  if (gutter && gutter.found) {
    ctx.strokeStyle = "#00a0ff";
    ctx.lineWidth = Math.max(3, src.width / 300);
    const x = gutter.x * src.width;
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, src.height);
    ctx.stroke();
  }

  if (separators) {
    ctx.strokeStyle = "#9c27b0";
    ctx.lineWidth = Math.max(2, src.width / 500);

    for (const row of separators.rows) {
      const y = row.pos * src.height;
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(src.width, y);
      ctx.stroke();
    }
    for (const col of separators.cols) {
      const x = col.pos * src.width;
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, src.height);
      ctx.stroke();
    }
  }

  return c;
}

/*
 * 将原图按 x 比例切割，重叠区域可按设置值添加。
 */
function splitVertical(src, ratios, overlapPx) {
  const cuts = [0, ...ratios, 1]
    .map(v => clamp(v, 0, 1))
    .sort((a, b) => a - b);

  const unique = [];
  for (const n of cuts) {
    if (!unique.length || Math.abs(n - unique[unique.length - 1]) > 0.005) {
      unique.push(n);
    }
  }

  const result = [];

  for (let i = 0; i < unique.length - 1; i++) {
    const a = unique[i];
    const b = unique[i + 1];
    if (b - a < 0.04) continue;

    const left = Math.max(0, Math.floor(a * src.width) -
      (i > 0 ? overlapPx : 0));
    const right = Math.min(src.width, Math.ceil(b * src.width) +
      (i < unique.length - 2 ? overlapPx : 0));

    if (right <= left) continue;

    result.push(cropCanvas(src, {
      x: left,
      y: 0,
      w: right - left,
      h: src.height
    }));
  }

  return result.length ? result : [src];
}

function addPreview(blob, name, isDebug = false) {
  const item = document.createElement("div");
  item.className = "preview-item";

  const img = document.createElement("img");
  const url = URL.createObjectURL(blob);
  img.src = url;
  img.alt = name;

  const caption = document.createElement("div");
  caption.className = "name";
  caption.textContent = name + (isDebug ? "（调试图）" : "");

  item.append(img, caption);
  preview.appendChild(item);
}

async function processOne(file, fileIndex, totalFiles) {
  log(`\n${fileIndex + 1}/${totalFiles}. ${file.name}`);

  let img;
  try {
    img = await loadImage(file);
  } catch (error) {
    log("图片读取失败：" + error.message);
    return;
  }

  let panel = imageToCanvas(img);

  if ($("trim").value === "auto") {
    const rect = trimInfo(panel);
    if (rect.x || rect.y ||
        rect.w !== panel.width || rect.h !== panel.height) {
      panel = cropCanvas(panel, rect);
      log(`自动裁边：${rect.w} × ${rect.h}`);
    }
  }

  const det = detectBalloons(panel);
  const gutter = detectGutter(panel);
  const separators = detectSeparators(panel);

  log(`气泡候选 ${det.boxes.length} 个；检测图 ${det.w}×${det.h}`);

  let inkCount = 0;
  let ocrCount = 0;
  let ocrSuccess = 0;
  let ocrErrors = 0;
  const results = [];

  const useOCR = $("useOCR").checked;

  for (let i = 0; i < det.boxes.length; i++) {
    const b = det.boxes[i];
    const ink = detectVerticalInk(panel, b, det.detection);

    let ocr = {
      ok: false,
      error: false,
      text: "",
      confidence: 0
    };

    if (ink.likely) {
      inkCount++;

      if (useOCR) {
        // 重要修复：转换成原图坐标后再交给 OCR。
        const sourceBox = mapBoxToSource(b, det.detection, panel);
        ocrCount++;
        ocr = await ocrAssist(panel, sourceBox);

        if (ocr.error) {
          ocrErrors++;
          if (ocrErrors <= 3) {
            log("OCR 错误：" + (ocr.message || "未知错误"));
          }
        } else if (ocr.ok) {
          ocrSuccess++;
        }
      }
    }

    results.push({ box: b, ink, ocr });

    // 让移动设备定期刷新界面，避免长任务看起来像卡死。
    if (i % 5 === 0) await sleepFrame();
  }

  log(`竖排/笔画疑似有字 ${inkCount} 个`);
  log(`OCR 实际检查 ${ocrCount} 个；识别成功 ${ocrSuccess} 个；错误 ${ocrErrors} 个`);

  const recognized = results
    .filter(r => r.ocr && r.ocr.ok)
    .slice(0, 5)
    .map(r => r.ocr.text.replace(/\s+/g, " ").slice(0, 35));

  if (recognized.length) {
    log("OCR 示例：" + recognized.join(" / "));
  }

  const sepRows = separators.rows.filter(
    r => r.pos > 0.12 && r.pos < 0.88
  );
  const sepCols = separators.cols.filter(
    r => r.pos > 0.12 && r.pos < 0.88
  );

  const requested = $("parts").value;
  let ratios = [];

  if (requested === "2") {
    ratios = [gutter.found ? gutter.x : 0.5];
  } else if (requested === "3") {
    ratios = [1 / 3, 2 / 3];
  } else {
    // 自动模式优先采用明显中缝；否则检查强分隔线。
    if (gutter.found &&
        gutter.x > 0.32 &&
        gutter.x < 0.68 &&
        gutter.confidence > 0.3) {
      ratios = [gutter.x];
    } else if (sepCols.length >= 1) {
      const central = sepCols
        .filter(r => r.pos > 0.28 && r.pos < 0.72)
        .sort((a, b) => Math.abs(a.pos - 0.5) - Math.abs(b.pos - 0.5))[0];

      if (central) ratios = [central.pos];
    }

    // 竖向长图通常无需左右分割。
    if (panel.height > panel.width * 1.35 && !gutter.found) {
      ratios = [];
    }
  }

  const overlap = clamp(parseInt($("overlap").value, 10) || 0, 0, 150);
  const pages = splitVertical(panel, ratios, overlap);

  log(`分页线索：横线 ${sepRows.length} 条，竖线 ${sepCols.length} 条，` +
      `中缝${gutter.found ? "有" : "未确认"}`);
  log(`本图输出 ${pages.length} 页`);

  const base = safeName(file.name);

  for (let i = 0; i < pages.length; i++) {
    const blob = await canvasToBlob(pages[i]);
    const name = pages.length === 1
      ? `${base}.png`
      : `${base}-${String(i + 1).padStart(2, "0")}.png`;

    outputs.push({ name, blob });
    addPreview(blob, name);
  }

  if ($("debug").checked) {
    const debugCanvas = makeDebug(panel, det.detection, results, gutter, separators);
    const blob = await canvasToBlob(debugCanvas);
    const name = `${base}-debug.png`;
    outputs.push({ name, blob, debug: true });
    addPreview(blob, name, true);
  }
}

async function run() {
  if (processing) return;

  const files = Array.from(fileInput.files || [])
    .filter(f => f.type.startsWith("image/"));

  if (!files.length) {
    setStatus("请先选择图片文件。");
    return;
  }

  processing = true;
  runButton.disabled = true;
  clearButton.disabled = true;
  downloadButton.disabled = true;
  outputs = [];
  preview.replaceChildren();
  progress(0);
  setStatus("开始处理……");

  try {
    for (let i = 0; i < files.length; i++) {
      try {
        await processOne(files[i], i, files.length);
      } catch (error) {
        log(`处理失败：${files[i].name}\n${error.stack || error.message || error}`);
      }

      progress((i + 1) / files.length * 100);
      await sleepFrame();
    }

    log("\n全部处理结束。");
    log(`输出文件总数：${outputs.length}`);
  } catch (error) {
    log("\n处理过程中发生错误：" + (error.stack || error.message || error));
  } finally {
    processing = false;
    runButton.disabled = false;
    clearButton.disabled = false;
    downloadButton.disabled = outputs.length === 0;
  }
}

async function downloadAll() {
  if (!outputs.length) return;

  if (!window.JSZip) {
    setStatus(statusBox.textContent + "\n正在加载 ZIP 打包组件……");

    try {
      await new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src =
          "https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js";
        script.onload = resolve;
        script.onerror = () => reject(new Error("JSZip 加载失败"));
        document.head.appendChild(script);
      });
    } catch (error) {
      log(error.message);
      log("你仍可以在结果预览中查看图片；请检查网络后再试下载 ZIP。");
      return;
    }
  }

  const zip = new JSZip();
  for (const item of outputs) {
    zip.file(item.name, item.blob);
  }

  downloadButton.disabled = true;
  try {
    log("正在打包 ZIP……");
    const blob = await zip.generateAsync(
      { type: "blob" },
      metadata => progress(metadata.percent)
    );

    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "漫画图片处理结果.zip";
    document.body.appendChild(a);
    a.click();
    a.remove();

    setTimeout(() => URL.revokeObjectURL(url), 30000);
    log("ZIP 已生成。");
  } catch (error) {
    log("ZIP 打包失败：" + (error.message || error));
  } finally {
    downloadButton.disabled = outputs.length === 0;
  }
}

function clearAll() {
  if (processing) return;

  outputs = [];
  preview.replaceChildren();
  fileInput.value = "";
  progress(0);
  setStatus("已清空。请选择图片，然后点击“开始处理”。");
  downloadButton.disabled = true;
}

runButton.addEventListener("click", run);
clearButton.addEventListener("click", clearAll);
downloadButton.addEventListener("click", downloadAll);

})();
</script>
