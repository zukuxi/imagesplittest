
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X3 日漫保守分格工具</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;padding:16px;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  background:#f3f4f6;color:#222;
}
main{max-width:1000px;margin:auto}
h1{font-size:23px;margin:0 0 8px}
.desc{font-size:14px;color:#555;line-height:1.7}
.panel{
  background:#fff;border-radius:12px;
  padding:15px;margin:14px 0;
  box-shadow:0 2px 8px #0000000a;
}
button,.file-label{
  display:inline-block;padding:10px 14px;
  border:0;border-radius:8px;
  background:#1769aa;color:white;
  font-size:15px;cursor:pointer;
  margin:4px 4px 4px 0;
}
button:disabled{opacity:.45;cursor:not-allowed}
.secondary{background:#555}
input[type=file]{max-width:100%}
label.option{display:block;margin:12px 0;line-height:1.6}
input[type=number]{width:80px;padding:5px}
#status{white-space:pre-wrap;line-height:1.7;font-size:14px}
#preview{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(145px,1fr));
  gap:12px;
}
.page{
  min-width:0;background:#e9e9e9;padding:8px;border-radius:8px;
}
.page img{display:block;width:100%;height:auto;background:white}
.page .caption{font-size:12px;margin-top:6px;overflow-wrap:anywhere}
.original img{max-width:100%;height:auto;display:block}
.small{font-size:12px;color:#666;line-height:1.6}
hr{border:0;border-top:1px solid #ddd;margin:14px 0}
</style>
</head>
<body>
<main>
<h1>X3 日漫保守分格与横屏排版</h1>
<div class="desc">
目标页面：792 × 528。默认不拼格、不把上下格子合成一页。
只有横向分隔线非常明确时才切割，并保留重叠区域。
边界不明确时优先保留原图，不猜测格子内部的边界。
</div>

<section class="panel">
  <h3>1. 选择漫画图片</h3>
  <input id="files" type="file" accept="image/*" multiple>
  <p class="small">支持常见图片格式。可以一次选择多张图片；按文件选择顺序处理。</p>
  <button id="run">开始保守分割</button>
  <button id="clear" class="secondary">清空</button>
</section>

<section class="panel">
  <h3>2. 分割设置</h3>

  <label class="option">
    横向白色分隔线严格程度
    <select id="strict">
      <option value="99">极严格（推荐，尽量不误切）</option>
      <option value="97">严格</option>
      <option value="94">较宽松（误切风险更高）</option>
    </select>
  </label>

  <label class="option">
    分隔线最低厚度：
    <input id="gutter" type="number" min="2" max="60" value="8"> 像素
  </label>

  <label class="option">
    分隔线检测亮度：
    <select id="white">
      <option value="245">近白色（推荐）</option>
      <option value="235">浅灰白</option>
      <option value="220">较暗的灰白（误切风险更高）</option>
    </select>
  </label>

  <label class="option">
    分割边界重叠：
    <input id="overlap" type="number" min="0" max="80" value="12"> 像素
    <div class="small">重叠能降低边界内容丢失的风险，但边界附近可能重复显示。</div>
  </label>

  <label class="option">
    <input id="trim" type="checkbox">
    仅裁掉明确的外侧白边（默认关闭）
  </label>

  <label class="option">
    <input id="rotate" type="checkbox">
    原图横向比例较宽时，允许尝试按中央分隔线拆成左右两张
    <div class="small">默认关闭。中央线不明显时不应开启，以免误切跨格内容。</div>
  </label>
</section>

<section class="panel">
  <h3>3. 处理状态</h3>
  <div id="status">请选择图片，然后开始处理。</div>
</section>

<section class="panel">
  <h3>4. 原图预览</h3>
  <div id="originals"></div>
</section>

<section class="panel">
  <h3>5. 分割结果预览</h3>
  <div class="small">
    每个结果单独生成一页，不会把上下格子拼在一起。
    结果按比例放入 792 × 528 页面；竖长内容可能出现留白。
  </div>
  <hr>
  <div id="preview"></div>
  <hr>
  <button id="download" disabled>下载全部 PNG</button>
</section>
</main>

<script>
(function(){
"use strict";

const W=792,H=528;
const $=id=>document.getElementById(id);
let results=[];
let busy=false;

function setStatus(s){$("status").textContent=s;}

function canvasOf(w,h){
  const c=document.createElement("canvas");
  c.width=Math.max(1,Math.round(w));
  c.height=Math.max(1,Math.round(h));
  return c;
}

function loadImage(file){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{
      URL.revokeObjectURL(url);
      resolve(img);
    };
    img.onerror=()=>{
      URL.revokeObjectURL(url);
      reject(new Error("图片读取失败："+file.name));
    };
    img.src=url;
  });
}

function imageCanvas(img){
  const c=canvasOf(img.naturalWidth||img.width,img.naturalHeight||img.height);
  c.getContext("2d",{willReadFrequently:true}).drawImage(img,0,0,c.width,c.height);
  return c;
}

function cropCanvas(src,x,y,w,h){
  x=Math.max(0,Math.floor(x));
  y=Math.max(0,Math.floor(y));
  w=Math.max(1,Math.min(src.width-x,Math.ceil(w)));
  h=Math.max(1,Math.min(src.height-y,Math.ceil(h)));
  const c=canvasOf(w,h);
  c.getContext("2d").drawImage(src,x,y,w,h,0,0,w,h);
  return c;
}

/*
 * 保守裁白边：
 * 只沿外缘逐行/逐列检查，遇到足够多的非白像素便停止。
 * 默认关闭，避免把边缘的头发、对白或速度线裁掉。
 */
function trimOuter(src){
  const ctx=src.getContext("2d",{willReadFrequently:true});
  const data=ctx.getImageData(0,0,src.width,src.height).data;
  const w=src.width,h=src.height;
  const threshold=248;
  const minInk=Math.max(2,Math.floor(Math.min(w,h)*0.002));

  function rowHasInk(y,x1,x2){
    let count=0;
    for(let x=x1;x<x2;x+=2){
      const i=(y*w+x)*4;
      if(data[i+3]>10 &&
        (data[i]<threshold||data[i+1]<threshold||data[i+2]<threshold)){
        if(++count>=minInk)return true;
      }
    }
    return false;
  }
  function colHasInk(x,y1,y2){
    let count=0;
    for(let y=y1;y<y2;y+=2){
      const i=(y*w+x)*4;
      if(data[i+3]>10 &&
        (data[i]<threshold||data[i+1]<threshold||data[i+2]<threshold)){
        if(++count>=minInk)return true;
      }
    }
    return false;
  }

  let top=0,bottom=h-1,left=0,right=w-1;
  const maxY=Math.floor(h*0.12);
  const maxX=Math.floor(w*0.12);

  while(top<maxY && !rowHasInk(top,0,w))top++;
  while(bottom>h-1-maxY && !rowHasInk(bottom,0,w))bottom--;
  while(left<maxX && !colHasInk(left,top,bottom+1))left++;
  while(right>w-1-maxX && !colHasInk(right,top,bottom+1))right--;

  if(right-left<w*0.5 || bottom-top<h*0.5)return src;
  return cropCanvas(src,left,top,right-left+1,bottom-top+1);
}

/*
 * 计算一行的白色覆盖率。
 * 只在几乎整行都是白色、且横跨大部分画面的地方寻找分割线。
 */
function rowWhiteRatio(data,w,y,threshold){
  let white=0,total=0;
  for(let x=0;x<w;x+=2){
    const i=(y*w+x)*4;
    if(data[i+3]<10 || (
      data[i]>=threshold && data[i+1]>=threshold && data[i+2]>=threshold
    ))white++;
    total++;
  }
  return total?white/total:0;
}

function findHorizontalCuts(src){
  const w=src.width,h=src.height;
  if(h<30)return [];

  const ctx=src.getContext("2d",{willReadFrequently:true});
  const data=ctx.getImageData(0,0,w,h).data;
  const strict=Number($("strict").value)/100;
  const threshold=Number($("white").value);
  const minThickness=Number($("gutter").value);
  const minBand=Math.max(45,Math.floor(h*0.055));

  const ratios=new Float32Array(h);
  for(let y=0;y<h;y++){
    ratios[y]=rowWhiteRatio(data,w,y,threshold);
  }

  const candidates=[];
  let start=-1;

  for(let y=0;y<h;y++){
    if(ratios[y]>=strict){
      if(start<0)start=y;
    }else if(start>=0){
      const end=y-1;
      if(end-start+1>=minThickness){
        candidates.push({
          start,end,
          center:Math.floor((start+end)/2),
          score:ratios.slice(start,end+1).reduce((a,b)=>a+b,0)/(end-start+1)
        });
      }
      start=-1;
    }
  }

  if(start>=0 && h-start>=minThickness){
    candidates.push({
      start,end:h-1,center:Math.floor((start+h-1)/2),
      score:1
    });
  }

  // 候选线必须把图像分成足够大的区域。
  const cuts=[];
  let last=0;
  for(const c of candidates){
    const y=c.center;
    if(y-last<minBand)continue;
    if(h-y<minBand)continue;
    cuts.push(y);
    last=y;
  }
  return cuts;
}

/*
 * 可选中央竖线检测。
 * 必须是宽图，而且中央连续区域大部分接近白色。
 * 此功能默认关闭。
 */
function findVerticalCenterCut(src){
  const w=src.width,h=src.height;
  if(w/h<1.65)return null;

  const ctx=src.getContext("2d",{willReadFrequently:true});
  const data=ctx.getImageData(0,0,w,h).data;
  const threshold=Number($("white").value);
  const mid=Math.floor(w/2);
  const radius=Math.max(2,Math.floor(w*0.008));
  const x1=Math.max(0,mid-radius);
  const x2=Math.min(w-1,mid+radius);

  let whiteRows=0,total=0;
  for(let y=0;y<h;y+=2){
    let bright=0,n=0;
    for(let x=x1;x<=x2;x+=2){
      const i=(y*w+x)*4;
      if(data[i+3]<10 || (
        data[i]>=threshold&&data[i+1]>=threshold&&data[i+2]>=threshold
      ))bright++;
      n++;
    }
    if(n && bright/n>=0.92)whiteRows++;
    total++;
  }
  if(total && whiteRows/total>=0.92)return mid;
  return null;
}

/*
 * 单页适配。
 * 不拉伸，不裁剪，不拼接；只按比例缩放并居中。
 */
function fitPage(src){
  const out=canvasOf(W,H);
  const ctx=out.getContext("2d");
  ctx.fillStyle="#fff";
  ctx.fillRect(0,0,W,H);

  const scale=Math.min(W/src.width,H/src.height);
  const dw=src.width*scale;
  const dh=src.height*scale;
  const dx=(W-dw)/2;
  const dy=(H-dh)/2;

  ctx.imageSmoothingEnabled=true;
  ctx.imageSmoothingQuality="high";
  ctx.drawImage(src,dx,dy,dw,dh);
  return out;
}

function makeSlices(src){
  const cuts=findHorizontalCuts(src);
  const overlap=Math.max(0,Math.min(80,Number($("overlap").value)||0));
  const slices=[];
  let start=0;

  for(const cut of cuts){
    const end=cut;
    if(end-start<20)continue;

    // 相邻片段保留重叠，避免分隔线附近内容被切掉。
    const y=Math.max(0,start-(slices.length?overlap:0));
    const bottom=Math.min(src.height,end+1+overlap);
    if(bottom-y>=20){
      slices.push(cropCanvas(src,0,y,src.width,bottom-y));
    }
    start=end+1;
  }

  if(src.height-start>=20){
    const y=Math.max(0,start-(slices.length?overlap:0));
    slices.push(cropCanvas(src,0,y,src.width,src.height-y));
  }

  if(!slices.length)slices.push(src);
  return {slices,cuts};
}

function addOriginal(name,src){
  const wrap=document.createElement("div");
  wrap.className="original";
  const title=document.createElement("p");
  title.textContent=name+"（"+src.width+" × "+src.height+"）";
  const img=document.createElement("img");
  img.src=src.toDataURL("image/png");
  wrap.append(title,img);
  $("originals").appendChild(wrap);
}

function renderResults(){
  const root=$("preview");
  root.replaceChildren();

  results.forEach((r,i)=>{
    const wrap=document.createElement("div");
    wrap.className="page";

    const img=document.createElement("img");
    img.src=r.canvas.toDataURL("image/png");
    img.alt=r.name;

    const cap=document.createElement("div");
    cap.className="caption";
    cap.textContent=(i+1)+". "+r.name;

    const download=document.createElement("button");
    download.className="secondary";
    download.textContent="下载此页";
    download.onclick=()=>saveCanvas(r.canvas,r.name);

    wrap.append(img,cap,download);
    root.appendChild(wrap);
  });

  $("download").disabled=results.length===0;
}

function safeName(name){
  return name.replace(/\.[^.]+$/,"")
    .replace(/[\\/:*?"<>|]/g,"_")
    .slice(0,100)||"page";
}

function saveCanvas(canvas,name){
  const a=document.createElement("a");
  a.download=name.endsWith(".png")?name:name+".png";
  a.href=canvas.toDataURL("image/png");
  a.click();
}

async function processFiles(){
  if(busy)return;
  const files=Array.from($("files").files||[]);
  if(!files.length){
    setStatus("请先选择图片。");
    return;
  }

  busy=true;
  $("run").disabled=true;
  $("preview").replaceChildren();
  $("originals").replaceChildren();
  results=[];

  try{
    let total=0;
    for(let index=0;index<files.length;index++){
      const file=files[index];
      setStatus(
        "正在处理 "+(index+1)+"/"+files.length+"："+
        file.name+"\n已生成 "+total+" 页。"
      );

      const img=await loadImage(file);
      let src=imageCanvas(img);

      addOriginal(file.name,src);

      if($("trim").checked){
        src=trimOuter(src);
      }

      // 只有用户主动开启，才尝试识别中央竖分隔线。
      if($("rotate").checked){
        const center=findVerticalCenterCut(src);
        if(center!==null){
          const left=cropCanvas(src,0,0,center,src.height);
          const right=cropCanvas(src,center,0,src.width-center,src.height);

          // 日漫阅读顺序：先右页，再左页。
          const parts=[right,left];
          for(let p=0;p<parts.length;p++){
            const page=fitPage(parts[p]);
            results.push({
              canvas:page,
              name:safeName(file.name)+"_spread_"+(p+1)+".png"
            });
            total++;
          }
          continue;
        }
      }

      const {slices,cuts}=makeSlices(src);

      for(let i=0;i<slices.length;i++){
        const page=fitPage(slices[i]);
        const suffix=slices.length>1
          ? "_part_"+String(i+1).padStart(2,"0")
          : "_page_01";

        results.push({
          canvas:page,
          name:safeName(file.name)+suffix+".png"
        });
        total++;
      }

      setStatus(
        "已处理 "+(index+1)+"/"+files.length+"："+
        file.name+"\n"+
        "检测到 "+cuts.length+" 条明确的横向分隔线；"+
        "本图生成 "+slices.length+" 页。\n"+
        "累计生成 "+total+" 页。"
      );

      // 让浏览器有机会更新界面。
      await new Promise(resolve=>setTimeout(resolve,0));
    }

    renderResults();
    setStatus(
      "处理完成。\n"+
      "输入图片："+files.length+" 张\n"+
      "输出页面："+results.length+" 页\n\n"+
      "没有进行上下拼接。分割线检测不到时会保留整张图片；"+
      "如果格子没有清晰的白色横向分隔线，本版本不会尝试猜测边界。"
    );
  }catch(err){
    console.error(err);
    setStatus("处理失败："+(err&&err.message?err.message:String(err)));
  }finally{
    busy=false;
    $("run").disabled=false;
  }
}

$("run").addEventListener("click",processFiles);

$("clear").addEventListener("click",()=>{
  if(busy)return;
  $("files").value="";
  $("preview").replaceChildren();
  $("originals").replaceChildren();
  results=[];
  $("download").disabled=true;
  setStatus("已清空。请选择图片，然后开始处理。");
});

$("download").addEventListener("click",async()=>{
  // 逐页下载，不依赖 ZIP 库，兼容性更好。
  if(!results.length)return;
  for(let i=0;i<results.length;i++){
    saveCanvas(results[i].canvas,results[i].name);
    await new Promise(resolve=>setTimeout(resolve,250));
  }
  setStatus(
    "已发起 "+results.length+" 个 PNG 文件的下载。\n"+
    "如果浏览器阻止了多个文件下载，请允许此网站下载多个文件。"
  );
});
})();
</script>
</body>
</html>
