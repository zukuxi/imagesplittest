
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>X3 日漫竖排文字检测与分割</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:14px;background:#f3f4f6;color:#222;font-family:system-ui,sans-serif}
main{max-width:960px;margin:auto}
h1{font-size:22px}
h3{font-size:17px;margin-top:0}
.card{background:white;padding:15px;border-radius:12px;margin:13px 0}
p{font-size:14px;line-height:1.7;color:#555}
label{display:block;margin:12px 0;font-size:14px}
button,select,input{font:inherit}
button{background:#1769aa;color:white;border:0;border-radius:8px;padding:10px 14px;margin:4px;cursor:pointer}
button:disabled{opacity:.45}
.secondary{background:#555}
#status{white-space:pre-wrap;line-height:1.7;font-size:14px}
#originals,#preview{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.item{background:#eee;border-radius:8px;padding:8px;min-width:0}
.item img{display:block;width:100%;height:auto;background:white}
.item div{font-size:12px;overflow-wrap:anywhere;margin:6px 0}
.small{font-size:12px;color:#777}
</style>
</head>
<body>
<main>
<h1>X3 日漫竖排文字检测与分割</h1>
<p>
不使用 OCR。先裁切外围白边，再检测双页中缝和可能的横向漫画格子。
不会单凭对白框或一条横线决定分页；目录、标题页和彩页优先保持整页。
双页按右页、左页顺序处理。输出 PNG 尺寸为 528 × 792。
</p>

<section class="card">
<h3>1. 选择图片</h3>
<input id="files" type="file" accept="image/*" multiple>
</section>

<section class="card">
<h3>2. 分割设置</h3>
<label>每个需要分割的页面分成几份
<select id="parts">
<option value="2">2 份</option>
<option value="3" selected>3 份</option>
</select>
</label>
<label>相邻分割重叠像素
<input id="overlap" type="number" min="0" max="200" value="24">
</label>
<label>外围白边
<select id="trim">
<option value="normal">普通裁切</option>
<option value="strong" selected>积极裁切</option>
<option value="off">关闭</option>
</select>
</label>
<label><input id="debug" type="checkbox" checked> 显示检测调试图</label>
<button id="run">开始检测与分割</button>
<button id="clear" class="secondary">清空</button>
</section>

<section class="card">
<h3>3. 原图与检测信息</h3>
<div id="originals"></div>
</section>

<section class="card">
<h3>4. 处理状态</h3>
<div id="status">请选择图片。</div>
</section>

<section class="card">
<h3>5. 输出预览</h3>
<div id="preview"></div>
<button id="download" disabled>下载全部 PNG</button>
</section>
</main>

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const PW=528,PH=792;
let records=[],outputs=[],busy=false;

function status(s){$("status").textContent=s}
function canvas(w,h){
 const c=document.createElement("canvas");
 c.width=Math.max(1,Math.round(w));c.height=Math.max(1,Math.round(h));
 return c;
}
function crop(src,x,y,w,h){
 x=Math.max(0,Math.floor(x));y=Math.max(0,Math.floor(y));
 w=Math.max(1,Math.min(src.width-x,Math.ceil(w)));
 h=Math.max(1,Math.min(src.height-y,Math.ceil(h)));
 const c=canvas(w,h);
 c.getContext("2d").drawImage(src,x,y,w,h,0,0,w,h);
 return c;
}
function rotate90(src){
 const c=canvas(src.height,src.width),ctx=c.getContext("2d");
 ctx.translate(c.width/2,c.height/2);ctx.rotate(Math.PI/2);
 ctx.drawImage(src,-src.width/2,-src.height/2);
 return c;
}
function loadImage(file){
 return new Promise((resolve,reject)=>{
  const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{URL.revokeObjectURL(url);resolve(img)};
  img.onerror=()=>{URL.revokeObjectURL(url);reject(Error("无法读取："+file.name))};
  img.src=url;
 });
}
function toCanvas(img){
 const c=canvas(img.naturalWidth||img.width,img.naturalHeight||img.height);
 c.getContext("2d").drawImage(img,0,0,c.width,c.height);
 return c;
}
function grayImage(src,maxW=500,maxH=700){
 const scale=Math.min(1,maxW/src.width,maxH/src.height);
 const w=Math.max(1,Math.round(src.width*scale));
 const h=Math.max(1,Math.round(src.height*scale));
 const c=canvas(w,h),ctx=c.getContext("2d",{willReadFrequently:true});
 ctx.drawImage(src,0,0,w,h);
 const rgba=ctx.getImageData(0,0,w,h).data,g=new Uint8Array(w*h);
 for(let i=0,p=0;i<rgba.length;i+=4,p++)
  g[p]=Math.round(.299*rgba[i]+.587*rgba[i+1]+.114*rgba[i+2]);
 return {g,w,h,scale};
}
function isColorPage(src){
 const w=90,h=120,c=canvas(w,h),ctx=c.getContext("2d",{willReadFrequently:true});
 ctx.drawImage(src,0,0,w,h);
 const d=ctx.getImageData(0,0,w,h).data;
 let colored=0,n=0;
 for(let i=0;i<d.length;i+=16){
  if(Math.max(d[i],d[i+1],d[i+2])-Math.min(d[i],d[i+1],d[i+2])>35)colored++;
  n++;
 }
 return colored/Math.max(1,n)>.08;
}
function trimInfo(src){
 const mode=$("trim").value,w=src.width,h=src.height;
 if(mode==="off")return {canvas:src,left:0,top:0};
 const {g,scale,w:sw,h:sh}=grayImage(src,600,800);
 const threshold=mode==="strong"?242:248;
 function rowWhite(y){
  let n=0,t=0;
  for(let x=0;x<sw;x+=2){if(g[y*sw+x]>=threshold)n++;t++}
  return n/Math.max(1,t);
 }
 function colWhite(x){
  let n=0,t=0;
  for(let y=0;y<sh;y+=2){if(g[y*sw+x]>=threshold)n++;t++}
  return n/Math.max(1,t);
 }
 let top=0,bottom=sh-1,left=0,right=sw-1;
 const my=Math.floor(sh*(mode==="strong"?.18:.10));
 const mx=Math.floor(sw*(mode==="strong"?.18:.10));
 while(top<my&&rowWhite(top)>.94)top++;
 while(bottom>sh-my&&rowWhite(bottom)>.94)bottom--;
 while(left<mx&&colWhite(left)>.94)left++;
 while(right>sw-mx&&colWhite(right)>.94)right--;
 if(right-left<sw*.45||bottom-top<sh*.45)return {canvas:src,left:0,top:0};
 const l=Math.round(left/scale),t=Math.round(top/scale);
 return {canvas:crop(src,l,t,Math.round((right-left+1)/scale),Math.round((bottom-top+1)/scale)),left:l,top:t};
}
function trim(src){return trimInfo(src).canvas}

/* 亮区候选只用于调试，不作为分页的单独依据。 */
function detectBalloons(src){
 const {g,w,h,scale}=grayImage(src,360,520);
 const visited=new Uint8Array(w*h),q=new Int32Array(w*h);
 let head=0,tail=0;
 function add(i){
  if(i<0||i>=w*h||visited[i]||g[i]<205)return;
  visited[i]=1;q[tail++]=i;
 }
 for(let x=0;x<w;x++){add(x);add((h-1)*w+x)}
 for(let y=0;y<h;y++){add(y*w);add(y*w+w-1)}
 while(head<tail){
  const i=q[head++],x=i%w,y=(i/w)|0;
  if(x>0)add(i-1);if(x<w-1)add(i+1);
  if(y>0)add(i-w);if(y<h-1)add(i+w);
 }
 const boxes=[],minArea=Math.max(12,w*h*.0003),maxArea=w*h*.30;
 for(let i=0;i<w*h;i++){
  if(visited[i]||g[i]<205)continue;
  head=0;tail=0;q[tail++]=i;visited[i]=1;
  let area=0,minX=w,minY=h,maxX=0,maxY=0;
  while(head<tail){
   const p=q[head++],x=p%w,y=(p/w)|0;area++;
   if(x<minX)minX=x;if(x>maxX)maxX=x;
   if(y<minY)minY=y;if(y>maxY)maxY=y;
   const ns=[x>0?p-1:-1,x<w-1?p+1:-1,y>0?p-w:-1,y<h-1?p+w:-1];
   for(const n of ns)if(n>=0&&!visited[n]&&g[n]>=205){visited[n]=1;q[tail++]=n}
  }
  const bw=maxX-minX+1,bh=maxY-minY+1,ratio=bw/Math.max(1,bh);
  if(area<minArea||area>maxArea||bw<5||bh<5||bw>w*.94||bh>h*.75||ratio<.18||ratio>12)continue;
  if(bw*bh>w*h*.32)continue;
  boxes.push({x:minX,y:minY,w:bw,h:bh,area});
 }
 boxes.sort((a,b)=>b.w*b.h-a.w*a.h);
 const kept=[];
 for(const b of boxes){
  let duplicate=false;
  for(const a of kept){
   const iw=Math.max(0,Math.min(a.x+a.w,b.x+b.w)-Math.max(a.x,b.x));
   const ih=Math.max(0,Math.min(a.y+a.h,b.y+b.h)-Math.max(a.y,b.y));
   if(iw*ih/Math.max(1,Math.min(a.w*a.h,b.w*b.h))>.70){duplicate=true;break}
  }
  if(!duplicate)kept.push(b);
 }
 kept.sort((a,b)=>a.y-b.y||a.x-b.x);
 return {boxes:kept,w,h,scale};
}

/*
 * 检测横向格子边界。
 * 相比上一版，降低对浅色扫描图的限制，并允许边界有少量墨迹中断。
 * 单条线不会直接触发分页，最终仍会检查页面内容和格子数量。
 */
function detectPanelRows(src){
 const {g,w,h,scale}=grayImage(src,500,750);
 const rowWhite=new Float32Array(h);
 const rowDark=new Float32Array(h);
 const rowInk=new Float32Array(h);
 const x0=Math.floor(w*.04),x1=Math.ceil(w*.96);
 for(let y=0;y<h;y++){
  let white=0,dark=0,ink=0,n=0;
  for(let x=x0;x<x1;x++){
   const v=g[y*w+x];n++;
   if(v>=220)white++;
   if(v<115)dark++;
   if(v<185)ink++;
  }
  rowWhite[y]=white/Math.max(1,n);
  rowDark[y]=dark/Math.max(1,n);
  rowInk[y]=ink/Math.max(1,n);
 }
 const bands=[];
 let start=-1;
 for(let y=Math.floor(h*.035);y<Math.ceil(h*.965);y++){
  const hit=rowWhite[y]>.78&&rowDark[y]<.09;
  if(hit&&start<0)start=y;
  if((!hit||y===h-1)&&start>=0){
   const end=hit&&y===h-1?y:y-1;
   if(end-start+1>=Math.max(2,Math.round(h*.003)))
    bands.push({start,end,mid:Math.round((start+end)/2)});
   start=-1;
  }
 }
 const merged=[];
 for(const b of bands){
  const last=merged[merged.length-1];
  if(last&&b.start-last.end<=Math.max(3,h*.014)){
   last.end=b.end;last.mid=Math.round((last.start+last.end)/2);
  }else merged.push({...b});
 }
 const boundaries=[];
 for(const b of merged){
  const y=b.mid;
  if(y<h*.10||y>h*.90)continue;
  const radius=Math.max(3,Math.round(h*.04));
  const before=Math.max(0,y-radius),after=Math.min(h-1,y+radius);
  let above=0,below=0,aboveInk=0,belowInk=0;
  for(let yy=before;yy<y;yy++){above+=rowDark[yy];aboveInk+=rowInk[yy]}
  for(let yy=y+1;yy<=after;yy++){below+=rowDark[yy];belowInk+=rowInk[yy]}
  above/=Math.max(1,y-before);
  below/=Math.max(1,after-y);
  aboveInk/=Math.max(1,y-before);
  belowInk/=Math.max(1,after-y);
  // 边界上下必须都有内容，避免把纯文字目录中的横向留白当成格子线
  if(above>.009&&below>.009&&aboveInk>.015&&belowInk>.015){
   boundaries.push({y:Math.round(y/scale),score:above+below});
  }
 }
 return {boundaries,debug:{w,h,scale,rowWhite,rowDark,rowInk,bands:merged}};
}

function detectGutter(src){
 if(src.width/src.height<1.25)return null;
 const {g,w,h,scale}=grayImage(src,700,900);
 let bestX=-1,best=-1;
 for(let x=Math.floor(w*.35);x<Math.ceil(w*.65);x++){
  let light=0,n=0;
  for(let y=Math.floor(h*.06);y<h*.94;y+=2){if(g[y*w+x]>218)light++;n++}
  const score=light/Math.max(1,n);
  if(score>best){best=score;bestX=x}
 }
 if(best<.66)return null;
 const margin=Math.max(3,Math.round(w*.04));
 function darkRatio(a,b){
  let dark=0,n=0;
  for(let y=Math.floor(h*.1);y<h*.9;y+=3)
   for(let x=Math.max(0,a);x<Math.min(w,b);x+=3){n++;if(g[y*w+x]<190)dark++}
  return dark/Math.max(1,n);
 }
 if(darkRatio(bestX-margin*3,bestX-margin)<.018||
    darkRatio(bestX+margin,bestX+margin*3)<.018)return null;
 return Math.round(bestX/scale);
}
function makePage(src,rotate=false){
 const content=rotate?rotate90(src):src;
 const c=canvas(PW,PH),ctx=c.getContext("2d");
 ctx.fillStyle="white";ctx.fillRect(0,0,PW,PH);
 const scale=Math.min((PW-12)/content.width,(PH-12)/content.height);
 const w=content.width*scale,h=content.height*scale;
 ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality="high";
 ctx.drawImage(content,(PW-w)/2,(PH-h)/2,w,h);
 return c;
}
function safeName(s){return s.replace(/\.[^.]+$/,"").replace(/[\\/:*?"<>|]/g,"_").slice(0,100)||"comic"}
function addOutput(c,name){outputs.push({canvas:c,name})}

/* 目录页通常是许多短文字行，而非连续的大面积漫画画面。
   这里统计暗色像素分布，辅助避免把文字目录切成多页。 */
function pageInkProfile(src){
 const {g,w,h}=grayImage(src,240,360);
 let ink=0,rows=0,activeRows=0;
 const rowInk=[];
 for(let y=0;y<h;y++){
  let n=0;
  for(let x=0;x<w;x++)if(g[y*w+x]<150)n++;
  const ratio=n/w;
  rowInk.push(ratio);
  ink+=n;
  if(ratio>.012)activeRows++;
 }
 for(let y=1;y<h-1;y++){
  if(rowInk[y]>.012&&rowInk[y-1]<.006&&rowInk[y+1]<.006)rows++;
 }
 return {density:ink/(w*h),activeRatio:activeRows/h,thinRows:rows};
}

function analyzePanels(src){
 const detected=detectPanelRows(src);
 const ys=detected.boundaries.map(b=>b.y).sort((a,b)=>a-b);
 const minGap=src.height*.14;
 const separated=[];
 for(const y of ys){
  if(!separated.length||y-separated[separated.length-1]>=minGap)separated.push(y);
 }
 const cuts=separated.filter(y=>y>src.height*.10&&y<src.height*.90);
 const segments=[];
 let last=0;
 for(const y of cuts){
  segments.push({top:last,bottom:y});
  last=y;
 }
 segments.push({top:last,bottom:src.height});
 return {cuts,segments,detected};
}

function shouldSplitByPanels(src,analysis){
 const {cuts,segments}=analysis;

 if(cuts.length<2)
  return {split:false,reason:"有效横向边界不足 2 条"};

 if(segments.length<3)
  return {split:false,reason:"上下漫画格子不足 3 格"};

 const valid=segments.filter(
  s=>s.bottom-s.top>=src.height*.14
 );

 if(valid.length<3)
  return {split:false,reason:"有效漫画格子不足 3 格"};

 // 排除分界线附近只有少量墨迹的情况。
 // 对白框横边经常被误判为分界线：线附近虽然是白色，
 // 但分界线上下没有足够连续的漫画画面内容。
 const {g,w,h}=grayImage(src,300,450);
 const rowInk=new Float32Array(h);

 for(let y=0;y<h;y++){
  let ink=0;
  for(let x=Math.floor(w*.04);x<Math.ceil(w*.96);x++){
   if(g[y*w+x]<175)ink++;
  }
  rowInk[y]=ink/(w*.92);
 }

 const realCuts=[];
 for(const y0 of cuts){
  const y=Math.round(y0*h/src.height);
  const radius=Math.max(3,Math.round(h*.035));
  let above=0,below=0;
  for(let yy=Math.max(0,y-radius);yy<y;yy++)above+=rowInk[yy];
  for(let yy=y+1;yy<=Math.min(h-1,y+radius);yy++)below+=rowInk[yy];

  above/=Math.max(1,Math.min(h-1,y)-Math.max(0,y-radius));
  below/=Math.max(1,Math.min(h-1,y+radius)-y);

  // 分界线两侧都必须有足够的画面墨迹
  if(above>.025&&below>.025)realCuts.push(y0);
 }

 if(realCuts.length<2)
  return {split:false,reason:"未找到足够的真实漫画格子边界"};

 // 只使用通过复核的边界重新生成分组。
 const realSegments=[];
 let last=0;
 for(const y of realCuts){
  realSegments.push({top:last,bottom:y});
  last=y;
 }
 realSegments.push({top:last,bottom:src.height});

 const good=realSegments.filter(
  s=>s.bottom-s.top>=src.height*.14
 );

 if(good.length<3)
  return {split:false,reason:"复核后漫画格子不足 3 格"};

 const ratios=good.map(s=>(s.bottom-s.top)/src.height);
 if(Math.max(...ratios)>.76)
  return {split:false,reason:"页面主要内容集中在一个大区域"};

 return {
  split:true,
  reason:"复核后检测到 "+good.length+" 个漫画区域",
  segments:good
};
}


function makeDebug(src,det,analysis){
 const c=canvas(src.width,src.height),ctx=c.getContext("2d");
 ctx.drawImage(src,0,0);
 const sx=src.width/det.w,sy=src.height/det.h;
 det.boxes.forEach(b=>{
  ctx.strokeStyle="#ff1744";
  ctx.lineWidth=Math.max(2,src.width/450);
  ctx.strokeRect(b.x*sx,b.y*sy,b.w*sx,b.h*sy);
 });
 if(analysis&&analysis.cuts){
  ctx.strokeStyle="#00c853";ctx.lineWidth=Math.max(3,src.width/300);
  analysis.cuts.forEach(y=>{
   ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(src.width,y);ctx.stroke();
  });
 }
 return c;
}
function renderOriginals(){
 const root=$("originals");root.replaceChildren();
 records.forEach((r,i)=>{
  const box=document.createElement("div");box.className="item";
  const img=document.createElement("img");img.src=(r.debug||r.canvas).toDataURL("image/jpeg",.85);
  const text=document.createElement("div");
  text.textContent=(i+1)+". "+r.file.name+"\n"+(r.reason||"等待处理");
  box.append(img,text);root.append(box);
 });
}
function renderOutputs(){
 const root=$("preview");root.replaceChildren();
 outputs.forEach((o,i)=>{
  const box=document.createElement("div");box.className="item";
  const img=document.createElement("img");img.src=o.canvas.toDataURL("image/png");
  const t=document.createElement("div");t.textContent=(i+1)+". "+o.name;
  const b=document.createElement("button");b.className="secondary";b.textContent="下载此页";
  b.onclick=()=>download(o);
  box.append(img,t,b);root.append(box);
 });
 $("download").disabled=!outputs.length;
}
function download(o){
 const a=document.createElement("a");a.href=o.canvas.toDataURL("image/png");a.download=o.name;
 document.body.append(a);a.click();a.remove();
}

async function process(){
 if(busy||!records.length)return;
 busy=true;$("run").disabled=true;outputs=[];$("preview").replaceChildren();
 try{
  const parts=Number($("parts").value);
  const overlap=Math.max(0,Math.min(200,Number($("overlap").value)||0));

  for(let fi=0;fi<records.length;fi++){
   const r=records[fi],src=r.canvas;
   status("分析图片 "+(fi+1)+"/"+records.length+"："+r.file.name);
   r.debug=null;

   const color=isColorPage(src);
   const ti=trimInfo(src),base=ti.canvas;
   const gutter=color?null:detectGutter(base);
   let panels=[];

   if(color){
    panels=[{canvas:base,suffix:""}];
   }else if(gutter!==null){
    panels=[
     {canvas:trim(crop(base,gutter,0,base.width-gutter,base.height)),suffix:"_R"},
     {canvas:trim(crop(base,0,0,gutter,base.height)),suffix:"_L"}
    ];
   }else{
    panels=[{canvas:base,suffix:""}];
   }

   const decisions=[];
   let pageCount=0;

   for(const p of panels){
    const name=safeName(r.file.name)+p.suffix;
    const panel=p.canvas;

    if(color){
     addOutput(makePage(panel,false),name+"_portrait.png");
     pageCount++;
     decisions.push("彩页保持整页");
     continue;
    }

    const balloonDet=detectBalloons(panel);
    const analysis=analyzePanels(panel);
    const decision=shouldSplitByPanels(panel,analysis);

    if($("debug").checked&&!r.debug)
     r.debug=makeDebug(panel,balloonDet,analysis);

    if(!decision.split){
     addOutput(makePage(panel,false),name+"_portrait.png");
     pageCount++;
     decisions.push(
      "亮区候选 "+balloonDet.boxes.length+
      "；横向边界 "+analysis.cuts.length+
      "；"+decision.reason+"；保持整页"
     );
    }else{
     let groups=decision.segments.map(s=>({top:s.top,bottom:s.bottom}));

     // 选择 2 份时，将上下区域合并为两组。
     if(parts===2&&groups.length>=3){
      const mid=Math.floor(groups.length/2);
      groups=[
       {top:groups[0].top,bottom:groups[mid-1].bottom},
       {top:groups[mid].top,bottom:groups[groups.length-1].bottom}
      ];
     }else if(groups.length>parts){
      const reduced=[];
      for(let i=0;i<parts;i++){
       const a=Math.floor(i*groups.length/parts);
       const b=Math.max(a,Math.floor((i+1)*groups.length/parts)-1);
       reduced.push({top:groups[a].top,bottom:groups[b].bottom});
      }
      groups=reduced;
     }

     for(let i=0;i<groups.length;i++){
      const g=groups[i];
      const y0=Math.max(0,Math.floor(g.top-overlap/2));
      const y1=Math.min(panel.height,Math.ceil(g.bottom+overlap/2));
      const piece=crop(panel,0,y0,panel.width,y1-y0);
      addOutput(
       makePage(rotate90(piece),false),
       name+"_part_"+String(i+1).padStart(2,"0")+".png"
      );
      pageCount++;
     }

     decisions.push(
      "亮区候选 "+balloonDet.boxes.length+
      "；横向边界 "+analysis.cuts.length+
      "；"+decision.reason+"；分为 "+groups.length+" 页"
     );
    }
   }

   r.reason=(color?"彩页；":gutter!==null?"检测到双页中缝，右页优先；":"")+
    decisions.join("；")+"；本图输出 "+pageCount+" 页";

   renderOriginals();
   renderOutputs();
   status(
    "已处理 "+(fi+1)+"/"+records.length+"："+r.file.name+
    "\n"+r.reason+"\n累计输出："+outputs.length+" 页"
   );
   await new Promise(resolve=>setTimeout(resolve,0));
  }

  status(
   "处理完成。\n输入图片："+records.length+
   " 张\n输出 PNG："+outputs.length+
   " 张\n尺寸：528 × 792\n"+
   "红框是亮区候选，仅作参考；绿色线是检测到的横向分割线。\n"+
   "本版本不使用 OCR。请检查目录页以及第 7、14、15 张的分割结果。"
  );
 }catch(e){
  console.error(e);
  status("处理失败："+(e.message||String(e)));
 }finally{
  busy=false;
  $("run").disabled=false;
 }
}

$("files").addEventListener("change",async()=>{
 if(busy)return;
 records=[];outputs=[];
 $("preview").replaceChildren();
 $("originals").replaceChildren();
 $("download").disabled=true;
 const files=Array.from($("files").files||[]);
 if(!files.length){status("请选择图片。");return}
 try{
  for(const f of files){
   const img=await loadImage(f);
   records.push({file:f,canvas:toCanvas(img),reason:"等待检测"});
  }
  renderOriginals();
  status("读取完成："+records.length+" 张图片。");
 }catch(e){
  status("读取失败："+e.message);
 }
});
$("run").addEventListener("click",process);
$("clear").addEventListener("click",()=>{
 if(busy)return;
 records=[];outputs=[];$("files").value="";
 $("originals").replaceChildren();
 $("preview").replaceChildren();
 $("download").disabled=true;
 status("已清空。");
});
$("download").addEventListener("click",async()=>{
 if(!outputs.length)return;
 $("download").disabled=true;
 for(let i=0;i<outputs.length;i++){
  download(outputs[i]);
  await new Promise(r=>setTimeout(r,250));
 }
 status("已发起 "+outputs.length+" 张 PNG 下载。如浏览器拦截，请允许多文件下载。");
 $("download").disabled=false;
});
})();
</script>
