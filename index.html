
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>X3 图片裁边与日漫分割工具</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:16px;background:#f3f4f6;color:#222;font-family:system-ui,-apple-system,sans-serif}
main{max-width:900px;margin:auto}
h1{font-size:23px;margin:0 0 8px}
p{font-size:14px;line-height:1.7;color:#555}
.card{background:white;border-radius:12px;padding:16px;margin:14px 0;box-shadow:0 2px 8px #00000008}
label{display:block;margin:14px 0;font-size:14px}
select,input[type=number]{padding:8px;border:1px solid #ccc;border-radius:7px;font-size:15px}
input[type=file]{max-width:100%}
button{border:0;border-radius:8px;background:#1769aa;color:white;padding:11px 15px;font-size:15px;margin:4px 5px 4px 0;cursor:pointer}
button.secondary{background:#555}
button:disabled{opacity:.5}
#status{font-size:14px;line-height:1.7;white-space:pre-wrap}
#preview{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:12px}
.item{min-width:0;padding:8px;background:#eee;border-radius:8px}
.item img{display:block;width:100%;height:auto;background:white}
.item div{font-size:12px;line-height:1.5;overflow-wrap:anywhere;margin:6px 0}
.original{margin:12px 0}
.original img{display:block;max-width:100%;height:auto}
.small{font-size:12px;color:#777}
hr{border:0;border-top:1px solid #ddd;margin:15px 0}
</style>
</head>
<body>
<main>
<h1>X3 图片裁边与日漫分割工具</h1>
<p>
处理顺序：原图检测中缝 → 裁白边 → 必要时按右页、左页顺序拆分
→ 纵向切割 2 份或 3 份 → 每份独立裁白边 → 输出 792 × 528 PNG。
中缝检测会兼容一定程度的灰色底色和阴影。
</p>

<section class="card">
<h3>1. 选择图片</h3>
<input id="files" type="file" accept="image/*" multiple>
<p class="small">支持一次选择多张图片，按选择顺序处理。</p>
</section>

<section class="card">
<h3>2. 切割设置</h3>

<label>
纵向切成几份<br>
<select id="parts">
<option value="2">切成 2 份</option>
<option value="3" selected>切成 3 份</option>
</select>
</label>

<label>
相邻页面重叠量<br>
<input id="overlap" type="number" min="0" max="200" step="4" value="24"> 像素
<p class="small">保留原设置；纵向取景仍按顶部、中间、底部位置切割。</p>
</label>

<label>
白边裁切强度<br>
<select id="trim">
<option value="normal">普通：只裁明显白边</option>
<option value="strong" selected>积极：尽量裁掉边框白边</option>
<option value="off">不裁白边</option>
</select>
<p class="small">裁边仅用于去除外围白边；中缝检测使用独立的灰度采样，不会修改原图颜色。</p>
</label>

<label>
页面适配方式<br>
<select id="fit">
<option value="fit" selected>完整显示，不裁切画面</option>
</select>
</label>

<button id="run">开始切割</button>
<button id="clear" class="secondary">清空</button>
</section>

<section class="card">
<h3>3. 处理状态</h3>
<div id="status">请选择图片，然后开始切割。</div>
</section>

<section class="card">
<h3>4. 原图预览</h3>
<div id="originals"></div>
</section>

<section class="card">
<h3>5. 输出预览</h3>
<p class="small">输出图片为 792 × 528。每份取景独立裁白边，之后完整缩放到 X3 页面。</p>
<div id="preview"></div>
<hr>
<button id="download" disabled>下载全部 PNG</button>
</section>
</main>

<script>
(function(){
"use strict";

const PAGE_W=792;
const PAGE_H=528;
const $=id=>document.getElementById(id);

let outputs=[];
let busy=false;

function status(s){
  $("status").textContent=s;
}

function canvas(w,h){
  const c=document.createElement("canvas");
  c.width=Math.max(1,Math.round(w));
  c.height=Math.max(1,Math.round(h));
  return c;
}

function readImage(file){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file);
    const img=new Image();

    img.onload=()=>{
      URL.revokeObjectURL(url);
      resolve(img);
    };

    img.onerror=()=>{
      URL.revokeObjectURL(url);
      reject(new Error("无法读取图片："+file.name));
    };

    img.src=url;
  });
}

function fromImage(img){
  const c=canvas(
    img.naturalWidth||img.width,
    img.naturalHeight||img.height
  );

  c.getContext("2d",{willReadFrequently:true})
    .drawImage(img,0,0,c.width,c.height);

  return c;
}

function crop(src,x,y,w,h){
  x=Math.max(0,Math.floor(x));
  y=Math.max(0,Math.floor(y));
  w=Math.max(1,Math.min(src.width-x,Math.ceil(w)));
  h=Math.max(1,Math.min(src.height-y,Math.ceil(h)));

  const c=canvas(w,h);
  c.getContext("2d").drawImage(src,x,y,w,h,0,0,w,h);
  return c;
}

/*
 * 裁掉外围连续近白区域。
 * 返回裁切结果和裁切偏移量，便于将中缝坐标
 * 从原图坐标准确换算到裁切后的坐标。
 */
function trimWhiteBorderInfo(src){
  const mode=$("trim").value;
  const w=src.width;
  const h=src.height;

  if(mode==="off"||w<10||h<10){
    return {canvas:src,left:0,top:0};
  }

  const data=src.getContext("2d",{
    willReadFrequently:true
  }).getImageData(0,0,w,h).data;

  const ratioThreshold=mode==="strong"?0.86:0.94;
  const maxX=Math.floor(w*(mode==="strong"?0.18:0.10));
  const maxY=Math.floor(h*(mode==="strong"?0.18:0.10));
  const sampleStep=Math.max(1,Math.floor(Math.min(w,h)/1200));

  function isBright(r,g,b,a){
    if(a<10)return true;
    return r>=242&&g>=242&&b>=242;
  }

  function rowBrightRatio(y){
    let bright=0,total=0;
    for(let x=0;x<w;x+=sampleStep){
      const i=(y*w+x)*4;
      if(isBright(data[i],data[i+1],data[i+2],data[i+3]))bright++;
      total++;
    }
    return bright/Math.max(1,total);
  }

  function colBrightRatio(x){
    let bright=0,total=0;
    for(let y=0;y<h;y+=sampleStep){
      const i=(y*w+x)*4;
      if(isBright(data[i],data[i+1],data[i+2],data[i+3]))bright++;
      total++;
    }
    return bright/Math.max(1,total);
  }

  let top=0,bottom=h-1,left=0,right=w-1;

  while(top<maxY&&rowBrightRatio(top)>=ratioThreshold)top++;
  while(bottom>h-1-maxY&&rowBrightRatio(bottom)>=ratioThreshold)bottom--;
  while(left<maxX&&colBrightRatio(left)>=ratioThreshold)left++;
  while(right>w-1-maxX&&colBrightRatio(right)>=ratioThreshold)right--;

  // 避免裁掉太多正文。
  if(right-left<w*0.45||bottom-top<h*0.45){
    return {canvas:src,left:0,top:0};
  }

  return {
    canvas:crop(src,left,top,right-left+1,bottom-top+1),
    left,
    top
  };
}

function trimWhiteBorder(src){
  return trimWhiteBorderInfo(src).canvas;
}

/*
 * 改进版中缝检测。
 *
 * 在中央 35%～65% 范围内寻找连续的浅色竖缝，
 * 不再要求正中央附近必须几乎纯白。
 *
 * 仅在检测副本上采样灰度，不会改变输出画面。
 * 返回原图坐标中的中缝位置；没有可靠结果时返回 null。
 */
function detectCenterGutter(src){
  const w=src.width;
  const h=src.height;

  if(w<200||h<200||w/h<1.25)return null;

  const maxScanW=700;
  const maxScanH=900;
  const scale=Math.min(1,maxScanW/w,maxScanH/h);
  const sw=Math.max(1,Math.round(w*scale));
  const sh=Math.max(1,Math.round(h*scale));

  const sample=canvas(sw,sh);
  const sctx=sample.getContext("2d",{willReadFrequently:true});
  sctx.drawImage(src,0,0,sw,sh);

  const rgba=sctx.getImageData(0,0,sw,sh).data;
  const gray=new Uint8Array(sw*sh);

  for(let i=0,p=0;i<rgba.length;i+=4,p++){
    gray[p]=Math.round(
      rgba[i]*0.299+
      rgba[i+1]*0.587+
      rgba[i+2]*0.114
    );
  }

  const xStart=Math.floor(sw*0.35);
  const xEnd=Math.ceil(sw*0.65);
  const rowStep=Math.max(1,Math.floor(sh/600));
  const scores=[];

  /*
   * 对每列评分：
   * 浅色占比越高越好；
   * 比左右邻近像素明显偏暗的列会受到惩罚，
   * 避免把黑色装订线当作白色中缝。
   */
  for(let x=xStart;x<xEnd;x++){
    let bright=0,veryBright=0,contrastPenalty=0,total=0;

    const offset=Math.max(2,Math.round(sw*0.012));
    const lx=Math.max(0,x-offset);
    const rx=Math.min(sw-1,x+offset);

    for(let y=0;y<sh;y+=rowStep){
      const v=gray[y*sw+x];
      const lv=gray[y*sw+lx];
      const rv=gray[y*sw+rx];
      const neighbors=(lv+rv)/2;

      total++;
      if(v>=190)bright++;
      if(v>=220)veryBright++;

      if(v<neighbors-18)contrastPenalty++;
    }

    const brightRatio=bright/Math.max(1,total);
    const veryBrightRatio=veryBright/Math.max(1,total);
    const penalty=contrastPenalty/Math.max(1,total);

    const score=
      brightRatio*0.55+
      veryBrightRatio*0.25-
      penalty*0.30;

    scores.push({x,score,brightRatio,veryBrightRatio});
  }

  if(!scores.length)return null;

  // 对相邻列平滑评分，减少扫描噪点影响。
  const radius=Math.max(2,Math.round(sw*0.006));
  let best=null;

  for(const candidate of scores){
    let sum=0,count=0;

    for(const item of scores){
      if(Math.abs(item.x-candidate.x)<=radius){
        sum+=item.score;
        count++;
      }
    }

    const smooth=sum/Math.max(1,count);

    if(!best||smooth>best.score){
      best={
        x:candidate.x,
        score:smooth,
        brightRatio:candidate.brightRatio,
        veryBrightRatio:candidate.veryBrightRatio
      };
    }
  }

  // 宽松接受灰色扫描底色，但不接受明显黑暗区域。
  if(best.brightRatio<0.52||best.score<0.43)return null;

  /*
   * 检查候选中缝是否沿大部分图像高度连续。
   * 使用候选列周围的小带区域，容忍少量文字、
   * 网点或阴影穿过中缝。
   */
  const bandRadius=Math.max(2,Math.round(sw*0.004));
  let brightRows=0;
  let sampledRows=0;

  for(let y=0;y<sh;y+=rowStep){
    let bright=0,total=0;

    for(let x=Math.max(xStart,best.x-bandRadius);
        x<=Math.min(xEnd-1,best.x+bandRadius);x++){
      if(gray[y*sw+x]>=185)bright++;
      total++;
    }

    if(bright/Math.max(1,total)>=0.65)brightRows++;
    sampledRows++;
  }

  const continuity=brightRows/Math.max(1,sampledRows);
  if(continuity<0.48)return null;

  /*
   * 中缝左右必须都有内容。
   * 使用较宽区域抽样，避免仅仅因为中缝旁边
   * 几个像素是白色，就错误地认定为双页图。
   */
  function sideHasContent(x1,x2){
    x1=Math.max(0,Math.min(sw-1,x1));
    x2=Math.max(x1+1,Math.min(sw,x2));

    let dark=0,total=0;
    const stepX=Math.max(1,Math.floor((x2-x1)/30));
    const stepY=Math.max(1,Math.floor(sh/400));

    for(let y=0;y<sh;y+=stepY){
      for(let x=x1;x<x2;x+=stepX){
        total++;
        if(gray[y*sw+x]<195)dark++;
      }
    }

    return dark/Math.max(1,total)>0.025;
  }

  const offset=Math.max(4,Math.round(sw*0.035));
  const sideWidth=Math.max(8,Math.round(sw*0.09));

  const leftHasContent=sideHasContent(
    best.x-offset-sideWidth,
    best.x-offset
  );

  const rightHasContent=sideHasContent(
    best.x+offset,
    best.x+offset+sideWidth
  );

  if(!leftHasContent||!rightHasContent)return null;

  return Math.max(1,Math.min(w-1,Math.round(best.x/scale)));
}

function makePage(src){
  const out=canvas(PAGE_W,PAGE_H);
  const ctx=out.getContext("2d");

  ctx.fillStyle="#fff";
  ctx.fillRect(0,0,PAGE_W,PAGE_H);

  const margin=8;
  const availableW=PAGE_W-margin*2;
  const availableH=PAGE_H-margin*2;

  // 完整显示，不裁切画面。
  const scale=Math.min(
    availableW/src.width,
    availableH/src.height
  );

  const dw=src.width*scale;
  const dh=src.height*scale;
  const dx=(PAGE_W-dw)/2;
  const dy=(PAGE_H-dh)/2;

  ctx.imageSmoothingEnabled=true;
  ctx.imageSmoothingQuality="high";
  ctx.drawImage(src,dx,dy,dw,dh);

  return out;
}

function safeName(s){
  return s.replace(/\.[^.]+$/,"")
    .replace(/[\\/:*?"<>|]/g,"_")
    .slice(0,100)||"image";
}

function addOriginal(file,src){
  const box=document.createElement("div");
  box.className="original";

  const title=document.createElement("div");
  title.textContent=file.name+"（原图 "+src.width+" × "+src.height+"）";

  const img=document.createElement("img");
  img.src=src.toDataURL("image/png");
  img.alt=file.name;

  box.append(title,img);
  $("originals").appendChild(box);
}

function addOutput(c,name){
  outputs.push({canvas:c,name:name});
}

function downloadOne(item){
  const a=document.createElement("a");
  a.href=item.canvas.toDataURL("image/png");
  a.download=item.name;
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function render(){
  const root=$("preview");
  root.replaceChildren();

  outputs.forEach((item,i)=>{
    const box=document.createElement("div");
    box.className="item";

    const img=document.createElement("img");
    img.src=item.canvas.toDataURL("image/png");
    img.alt=item.name;

    const caption=document.createElement("div");
    caption.textContent=(i+1)+". "+item.name;

    const btn=document.createElement("button");
    btn.className="secondary";
    btn.textContent="下载此页";
    btn.addEventListener("click",()=>downloadOne(item));

    box.append(img,caption,btn);
    root.appendChild(box);
  });

  $("download").disabled=outputs.length===0;
}

async function process(){
  if(busy)return;

  const files=Array.from($("files").files||[]);

  if(!files.length){
    status("请先选择图片。");
    return;
  }

  busy=true;
  $("run").disabled=true;
  $("preview").replaceChildren();
  $("originals").replaceChildren();
  outputs=[];

  try{
    const count=Number($("parts").value);
    let pageCount=0;

    for(let fi=0;fi<files.length;fi++){
      const file=files[fi];

      status("正在处理 "+(fi+1)+"/"+files.length+"："+file.name);

      const img=await readImage(file);
      const original=fromImage(img);
      addOriginal(file,original);

      /*
       * 先检测原图中缝，再裁外围白边。
       * 这样不对称的白边不会让中缝位置偏移。
       */
      const originalGutterX=detectCenterGutter(original);
      const trimInfo=trimWhiteBorderInfo(original);
      const trimmedOriginal=trimInfo.canvas;

      const w=trimmedOriginal.width;
      const h=trimmedOriginal.height;
      const baseName=safeName(file.name);

      // 将原图中缝坐标转换成裁边后坐标。
      let gutterX=null;

      if(originalGutterX!==null){
        const adjustedX=originalGutterX-trimInfo.left;

        if(adjustedX>w*0.25&&adjustedX<w*0.75){
          gutterX=adjustedX;
        }
      }

      const panels=[];

      if(gutterX!==null){
        // 日漫阅读顺序：右页先，左页后。
        const rightPage=crop(
          trimmedOriginal,gutterX,0,w-gutterX,h
        );

        const leftPage=crop(
          trimmedOriginal,0,0,gutterX,h
        );

        panels.push({
          canvas:trimWhiteBorder(rightPage),
          suffix:"_R"
        });

        panels.push({
          canvas:trimWhiteBorder(leftPage),
          suffix:"_L"
        });
      }else{
        panels.push({
          canvas:trimmedOriginal,
          suffix:""
        });
      }

      let localPageCount=0;

      for(let pi=0;pi<panels.length;pi++){
        const panel=panels[pi].canvas;
        const panelName=baseName+panels[pi].suffix;
        const pw=panel.width;
        const ph=panel.height;

        // 单张 X3 页面比例为 792 × 528。
        const targetH=Math.min(
          ph,
          Math.max(1,Math.round(pw*PAGE_H/PAGE_W))
        );

        const maxY=Math.max(0,ph-targetH);
        let positions;

        if(count===2){
          positions=[0,maxY];
        }else{
          positions=[
            0,
            Math.round(maxY*0.58),
            maxY
          ];
        }

        // 去除完全相同的取景起点，避免短图重复输出。
        positions=positions
          .map(y=>Math.max(0,Math.min(maxY,Math.round(y))))
          .filter((y,i,a)=>a.indexOf(y)===i);

        for(let i=0;i<positions.length;i++){
          const y0=positions[i];
          const y1=Math.min(ph,y0+targetH);

          const rawPart=crop(
            panel,0,y0,pw,y1-y0
          );

          const trimmedPart=trimWhiteBorder(rawPart);
          const page=makePage(trimmedPart);

          addOutput(
            page,
            panelName+"_part_"+String(i+1).padStart(2,"0")+".png"
          );

          pageCount++;
          localPageCount++;
        }
      }

      status(
        "已处理 "+(fi+1)+"/"+files.length+"："+file.name+
        "\n原图尺寸："+original.width+" × "+original.height+
        "\n裁边后："+w+" × "+h+
        "\n中缝检测："+(
          gutterX!==null
            ?"已识别，按右页 → 左页拆分（位置 "+Math.round(gutterX)+"）"
            :"未找到可靠中缝，保留整张图"
        )+
        "\n本张输出："+localPageCount+" 页"+
        "\n累计输出："+pageCount+" 页"
      );

      render();
      await new Promise(resolve=>setTimeout(resolve,0));
    }

    status(
      "全部完成！"+
      "\n输入图片："+files.length+" 张"+
      "\n输出页面："+outputs.length+" 页"+
      "\n页面尺寸：792 × 528"+
      "\n双页图按右页 → 左页排序"+
      "\n未确认中缝的图片保持完整。"
    );

  }catch(e){
    console.error(e);
    status("处理失败："+(e.message||String(e)));
  }finally{
    busy=false;
    $("run").disabled=false;
  }
}

$("run").addEventListener("click",process);

$("clear").addEventListener("click",()=>{
  if(busy)return;

  $("files").value="";
  $("preview").replaceChildren();
  $("originals").replaceChildren();
  outputs=[];
  $("download").disabled=true;
  status("已清空。请选择图片，然后开始切割。");
});

$("download").addEventListener("click",async()=>{
  if(!outputs.length)return;

  $("download").disabled=true;
  status("正在逐页发起下载，共 "+outputs.length+" 个 PNG 文件。");

  for(let i=0;i<outputs.length;i++){
    downloadOne(outputs[i]);
    await new Promise(resolve=>setTimeout(resolve,300));
  }

  status(
    "已发起全部 "+outputs.length+" 个 PNG 文件的下载。\n"+
    "如果浏览器阻止多个文件下载，请允许此网站下载多个文件。"
  );

  $("download").disabled=false;
});

})();
</script>
</body>
</html>
